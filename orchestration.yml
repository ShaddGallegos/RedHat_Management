---
# RHIS Orchestration Playbook
# Direct entry point for ansible_dev_node_orchestration-only (skips interactive ansible_dev_node_prompts)
# 
# Equivalent to: ansible-playbook site.yml -t phase1,phase2,phase3,phase4,phase5,phase6,phase7
# 
# Usage:
#   ansible-playbook ansible_dev_node_orchestration.yml \
#     -e deployment_scenario=satellite_aap \
#     -e deployment_platform=aws

- name: "RHIS Full Orchestration"
  hosts: localhost
  gather_facts: true
  
  vars:
    deployment_scenario: "{{ deployment_scenario | default('full_stack') }}"
    deployment_platform: "{{ deployment_platform | default('libvirt') }}"
    deployment_os: "{{ deployment_os | default('rhel-9') }}"
    install_method: "{{ install_method | default('oemdrv') }}"
  
  roles:
    - role: ansible_dev_node_orchestration_master
      tags: ["phase1", "phase2", "phase3", "phase4", "phase5", "phase6", "phase7"]
