---
- name: Test LVM Extension Workflow
- hosts: test_hosts
  gather_facts: true
  become: true
 
  vars:
 # Test variables - customize as needed
    vg_name: "rhel"
    lv_name: "root"
    mount_point: "/"
    threshold_percent: 80
    servicenow_instance: "dev12345"
    servicenow_username: "{{ lookup('env', 'SNOW_USER') | default('admin') }}"
    servicenow_password: "{{ lookup('env', 'SNOW_PASS') | default('password') }}"
 
  tasks:
- name: Display system information
 ansible.builtin.debug:
 msg: |
 Testing LVM extension on:
 Hostname: {{ ansible_hostname }}
 OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
 
- name: Check if OS is supported
 ansible.builtin.set_fact:
 is_supported_os: "{{ ansible_distribution == 'RedHat' and ansible_distribution_major_version in ['8', '9'] }}"
 
- name: Display OS support status
 ansible.builtin.debug:
 msg: |
 OS support status: {{ is_supported_os | bool }}
 {% if not is_supported_os | bool %}
 WARNING: This is not a supported OS version.
 Supported: Red Hat Enterprise Linux 8, 9
 Current: {{ ansible_distribution }} {{ ansible_distribution_version }}
 {% endif %}
 
- name: Get mount information
 ansible.builtin.setup:
 gather_subset:
 - mounts
 when: is_supported_os | bool
 
- name: Execute LVM system inspection
 ansible.builtin.include_role:
- name: lvm_system_inspection
  vars:
    target_vg: "{{ vg_name }}"
    target_lv: "{{ lv_name }}"
    required_growth_percent: 20
    when: is_supported_os | bool
    ignore_errors: true
 
- name: Display inspection results
 ansible.builtin.debug:
 msg: |
 LVM Inspection Results:
 VG: {{ vg_name }}
 LV: {{ lv_name }}
 Current Size: {{ lv_size_gb | default('Unknown') }}GB
 VG Free Space: {{ vg_free_gb | default('Unknown') }}GB
 Required Space: {{ required_space_gb | default('Unknown') }}GB
 Sufficient Space: {{ sufficient_space | default('Unknown') }}
 when: is_supported_os | bool
 
 # Uncomment to perform actual extension
 # - name: Test LVM extension
 # ansible.builtin.include_role:
 # name: lvm_smart_extend
 # vars:
 # target_vg: "{{ vg_name }}"
 # target_lv: "{{ lv_name }}"
 # target_mount: "{{ mount_point }}"
 # required_growth_percent: 10 # Use a smaller value for testing
 # when: is_supported_os | bool and sufficient_space | default(false) | bool
 
- name: Test ServiceNow ticket creation
 ansible.builtin.debug:
 msg: |
 TESTING ONLY - No actual ServiceNow ticket would be created with these details:
 Instance: {{ servicenow_instance }}
 Short Description: "High disk usage detected on {{ ansible_hostname }}"
 Category: "Infrastructure"
 Subcategory: "Storage"
 Assignment Group: "Linux Systems"
 when: is_supported_os | bool
 
 # Uncomment to test ServiceNow role (requires valid credentials)
 # - name: Test ServiceNow ticket update
 # ansible.builtin.include_role:
 # name: servicenow_ticket_management
 # tasks_from: update_ticket.yml
 # vars:
 # snow_instance: "{{ servicenow_instance }}"
 # snow_ticket_number: "INC0010001" # Test ticket number
 # work_notes: "TEST ONLY - LVM inspection completed on {{ ansible_hostname }}"
 # ticket_state: "2" # In Progress
 # when: is_supported_os | bool