---
- name: Render VM templates locally for verification
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    vm_list:
      - name: demo-ansibledev.example.local
        memory: 8192
        vcpus: 4
        disk: /var/lib/libvirt/images/ansibledev.qcow2
        network: default
      - name: demo-satellite.example.local
        memory: 8192
        vcpus: 4
        disk: /var/lib/libvirt/images/satellite.qcow2
        network: default
  tasks:
    - name: Ensure /tmp/vm-templates exists
      file:
        path: /tmp/vm-templates
        state: directory
        mode: '0755'
    - name: Assign deterministic MAC addresses to VMs when not provided
      set_fact:
        vm_list: "{{ (vm_list_updated | default([])) + [ item | combine({'mac': (item.mac | default('52:54:00:' + (item.name | hash('sha1'))[0:2] + ':' + (item.name | hash('sha1'))[2:4] + ':' + (item.name | hash('sha1'))[4:6])) }) ] }}"
      loop: "{{ vm_list }}"
      loop_control:
        loop_var: item
    - name: Render VM XML template for each VM
      template:
        src: "../templates/vm_default.xml.j2"
        dest: "/tmp/vm-templates/{{ item.name }}.xml"
      loop: "{{ vm_list }}"
      loop_control:
        loop_var: item
      vars:
        vm: "{{ item }}"
