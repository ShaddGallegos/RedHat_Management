---
# test_lvm_inspection_role.yml - Test playbook for the lvm_system_inspection role
- name: Test LVM System Inspection Role
- hosts: all
  gather_facts: true
  become: true
 
  vars:
 # Example variables - customize for your environment
    vg_name: "rootvg"
    lv_name: "rootlv" 
    mount_point: "/"
    lvm_required_growth_percent: 25
    lvm_show_debug_info: true
 
  roles:
 - lvm_system_inspection
 
 post_tasks:
- name: Display complete inspection results
 ansible.builtin.debug:
 msg: |
 === Complete LVM Inspection Results ===
 Can extend existing VG: {{ lvm_inspection.can_extend_existing }}
 Current LV size: {{ lvm_inspection.current_lv_size_gb }}GB
 Required additional space: {{ lvm_inspection.required_additional_gb }}GB
 {% if not lvm_inspection.can_extend_existing %}
 New disk size needed: {{ lvm_inspection.new_disk_size_gb }}GB
 {% endif %}
 Free PEs available: {{ lvm_inspection.free_pe }}
 Required PEs: {{ lvm_inspection.required_pe }}
 Volume Group: {{ lvm_inspection.vg_name }}
 Logical Volume: {{ lvm_inspection.lv_name }}
 Mount Point: {{ lvm_inspection.mount_point }}
 OS Version: RHEL {{ lvm_inspection.os_version }}