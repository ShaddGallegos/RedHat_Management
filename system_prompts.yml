---
- name: Collect management system prompts (Satellite, AAP, IdM, Insights)
  hosts: localhost
  gather_facts: true

  vars_prompt:
    # Satellite
    - name: satellite_domain
      prompt: "Satellite domain (e.g. hostname -d)"
      private: false
      default: "{{ ansible_domain | default('example.com') }}"

    - name: satellite_primary_interface
      prompt: "Primary interface for Satellite services (DHCP/DNS/TFTP)"
      private: false
      default: "{{ ansible_default_ipv4.interface | default('enp2s0') }}"

    - name: satellite_fqdn
      prompt: "Satellite FQDN"
      private: false
      default: "{{ ansible_fqdn | default('satellite.' + (ansible_domain | default('example.com'))) }}"

    - name: satellite_fqdn_ip
      prompt: "Satellite FQDN IP (leave blank to auto-detect)"
      private: false
      default: "{{ ansible_default_ipv4.address | default('') }}"

    - name: satellite_gateway
      prompt: "Gateway for primary interface (leave blank to auto-detect)"
      private: false
      default: "{{ ansible_default_ipv4.gateway | default('') }}"

    - name: satellite_nameserver
      prompt: "Nameserver to publish via DHCP (leave blank to auto-detect)"
      private: false
      default: "{{ (ansible_dns.nameservers | first) | default('') if ansible_dns is defined else '' }}"

    - name: satellite_dhcp_range_start
      prompt: "DHCP range start (leave blank to auto-compute)"
      private: false
      default: ""

    - name: satellite_dhcp_range_end
      prompt: "DHCP range end (leave blank to auto-compute)"
      private: false
      default: ""

    - name: satellite_pxeserver
      prompt: "PXE/TFTP server IP (leave blank to use primary IP)"
      private: false
      default: ""

    - name: satellite_initial_admin_email
      prompt: "Initial Satellite admin email"
      private: false
      default: "admin@{{ ansible_domain | default('example.com') }}"

    - name: satellite_admin_user
      prompt: "Satellite admin username"
      private: false
      default: "admin"

    - name: satellite_admin_password
      prompt: "Satellite admin password"
      private: true

    - name: satellite_mail_relay
      prompt: "Satellite SMTP relay host:port (leave blank to skip)"
      private: false
      default: ""

    - name: satellite_mail_relay_credentials
      prompt: "Satellite SMTP relay credentials (user:pass) leave blank if not required"
      private: true
      default: ""

    # AAP
    - name: aap_admin_user
      prompt: "AAP admin user"
      private: false
      default: "admin"

    - name: aap_admin_password
      prompt: "AAP admin password"
      private: true

    - name: automation_hub_token
      prompt: "Ansible Automation Hub token (leave blank if not needed)"
      private: true
      default: ""

    # IdM
    - name: idm_domain
      prompt: "IdM domain"
      private: false
      default: "{{ ansible_domain | default('example.com') }}"

    - name: idm_realm
      prompt: "IdM realm (usually domain uppercased)"
      private: false
      default: "{{ (ansible_domain | default('example.com')) | upper }}"

    - name: idm_admin_password
      prompt: "IdM admin password"
      private: true

    - name: idm_directory_manager_password
      prompt: "IdM Directory Manager password"
      private: true

    # Insights
    - name: insights_account
      prompt: "Red Hat Insights account number"
      private: false
      default: "000000"

    - name: insights_username
      prompt: "Red Hat Insights username"
      private: false
      default: "insights-user"

    - name: insights_password
      prompt: "Red Hat Insights password"
      private: true

  tasks:
    - name: Stat user env.yml (user-level)
      stat:
        path: "{{ lookup('env','HOME') + '/.ansible/conf/env.yml' }}"
      register: controller_env_yml

    - name: Load user env.yml into `user_env` if present
      include_vars:
        file: "{{ lookup('env','HOME') + '/.ansible/conf/env.yml' }}"
        name: user_env
      when: controller_env_yml.stat.exists

    - name: Build combined variable set
      set_fact:
        management_vars:
          satellite_domain: "{{ user_env.satellite_domain | default(satellite_domain) }}"
          satellite_primary_interface: "{{ user_env.satellite_primary_interface | default(satellite_primary_interface) }}"
          satellite_fqdn: "{{ user_env.satellite_fqdn | default(satellite_fqdn) }}"
          satellite_fqdn_ip: "{{ user_env.satellite_fqdn_ip | default(satellite_fqdn_ip) }}"
          satellite_gateway: "{{ user_env.satellite_gateway | default(satellite_gateway) }}"
          satellite_nameserver: "{{ user_env.satellite_nameserver | default(satellite_nameserver) }}"
          satellite_dhcp_range_start: "{{ user_env.satellite_dhcp_range_start | default(satellite_dhcp_range_start) }}"
          satellite_dhcp_range_end: "{{ user_env.satellite_dhcp_range_end | default(satellite_dhcp_range_end) }}"
          satellite_pxeserver: "{{ user_env.satellite_pxeserver | default(satellite_pxeserver) }}"
          satellite_initial_admin_email: "{{ user_env.satellite_initial_admin_email | default(satellite_initial_admin_email) }}"
          satellite_admin_user: "{{ user_env.satellite_admin_user | default(satellite_admin_user) }}"
          satellite_admin_password: "{{ user_env.satellite_admin_password | default(satellite_admin_password) }}"
          satellite_mail_relay: "{{ user_env.satellite_mail_relay | default(satellite_mail_relay) }}"
          satellite_mail_relay_credentials: "{{ user_env.satellite_mail_relay_credentials | default(satellite_mail_relay_credentials) }}"
          aap_admin_user: "{{ user_env.aap_admin_user | default(aap_admin_user) }}"
          aap_admin_password: "{{ user_env.aap_admin_password | default(aap_admin_password) }}"
          automation_hub_token: "{{ user_env.automation_hub_token | default(automation_hub_token) }}"
          idm_domain: "{{ user_env.idm_domain | default(idm_domain) }}"
          idm_realm: "{{ user_env.idm_realm | default(idm_realm) }}"
          idm_admin_password: "{{ user_env.idm_admin_password | default(idm_admin_password) }}"
          idm_directory_manager_password: "{{ user_env.idm_directory_manager_password | default(idm_directory_manager_password) }}"
          insights_account: "{{ user_env.insights_account | default(insights_account) }}"
          insights_username: "{{ user_env.insights_username | default(insights_username) }}"
          insights_password: "{{ user_env.insights_password | default(insights_password) }}"

    - name: Write merged variables to env.local.generated.yml
      copy:
        dest: "./env.local.generated.yml"
        mode: '0600'
        content: |
          # Generated by system_prompts.yml on {{ ansible_date_time.iso8601 }}
          # Move secrets into your vault and reference them as needed.
          {{ management_vars | to_nice_yaml(indent=2) }}

    - name: Display where the generated file was written
      debug:
        msg: "Wrote combined management variables to ./env.local.generated.yml"
