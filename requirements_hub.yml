---
# Collections that require Red Hat Automation Hub access (subscription token)
# Install with: ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN=<token> ansible-galaxy collection install -r requirements_hub.yml
collections:
  - name: redhat.satellite
    version: ">=4.8.0"
  - name: redhat.satellite_operations
    version: ">=1.3.0"
  - name: redhat.rhel_system_roles
    version: ">=1.22.0"
  - name: infra.aap_configuration
    version: ">=2.6.0"
  # redhat.aap removed due to hub dependency resolution issues
  # redhat.idm removed due to hub dependency resolution issues
  - name: redhat.insights
    version: ">=1.3.0"
  # redhat.libvirt removed due to hub dependency resolution issues
  # redhat.virtualization removed due to hub dependency resolution issues
  # redhat.migration removed due to hub dependency resolution issues
  # redhat.cloudforms removed due to hub dependency resolution issues
  # redhat.certificates removed due to hub dependency resolution issues
  # redhat.firewall removed due to hub dependency resolution issues
  # redhat.logging removed due to hub dependency resolution issues
  # redhat.monitoring removed due to hub dependency resolution issues
  # redhat.network_insights removed due to hub dependency resolution issues
  # redhat.storage removed due to hub dependency resolution issues
  # redhat.system_roles removed due to hub dependency resolution issues
  # redhat.users removed due to hub dependency resolution issues
  # redhat.workloads removed due to hub dependency resolution issues
  - name: ansible.utils
    version: ">=2.11.0"
  # ansible.builtin removed from requirements (builtin collection)
  - name: community.general
    version: ">=6.0.0"
  - name: ansible.posix
    version: ">=2.0.0"
  - name: ansible.netcommon
    version: ">=4.0.0"
  - name: community.crypto
    version: ">=3.0.0"
  - name: community.windows
    version: ">=2.0.0"
  - name: community.vmware  
    version: ">=3.0.0"
