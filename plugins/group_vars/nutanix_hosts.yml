---
# =============================================================================
# Nutanix-Managed Hosts Configuration
# =============================================================================
# Variables specific to hosts managed by Nutanix Prism Central
# These hosts can leverage Nutanix storage features for LVM extension
# =============================================================================

# -----------------------------------------------------------------------------
# Nutanix Prism Central API Configuration
# -----------------------------------------------------------------------------
nutanix_prism:
 # Prism Central connection
 host: "{{ lookup('env', 'NUTANIX_HOST') | default('prism.example.com') }}"
 port: 9440
 username: "{{ lookup('env', 'NUTANIX_USER') | default(lookup('ansible.builtin.vars', 'vault_nutanix_username', default='admin')) }}"
 password: "{{ lookup('env', 'NUTANIX_PASS') | default(lookup('ansible.builtin.vars', 'vault_nutanix_password', default='password')) }}"
 
 # API settings
 api_version: "v3"
 verify_ssl: false
 timeout: 60
 
 # Retry settings
 max_retries: 3
 retry_delay: 5

# Backward compatibility
nutanix_host: "{{ nutanix_prism.host }}"
nutanix_username: "{{ nutanix_prism.username }}"
nutanix_password: "{{ nutanix_prism.password }}"

# -----------------------------------------------------------------------------
# Nutanix Storage Configuration
# -----------------------------------------------------------------------------
nutanix_storage:
 # Storage container settings
 default_container: "{{ lookup('env', 'STORAGE_CONTAINER_NAME') | default('default-container') }}"
 container_uuid: "{{ lookup('env', 'STORAGE_CONTAINER_UUID') | default('') }}"
 
 # Storage pools
 storage_pools:
 production:
- name: "Production-Pool"
 container: "prod-container"
 performance_tier: "high"
 
 development:
- name: "Development-Pool"
 container: "dev-container"
 performance_tier: "standard"
 
 test:
- name: "Test-Pool"
 container: "test-container"
 performance_tier: "standard"
 
 # Disk provisioning
 thin_provision: true
 compression_enabled: true
 deduplication_enabled: true
 
 # Storage policies
 flash_mode: false
 replication_factor: 2

# Backward compatibility
storage_container_uuid: "{{ nutanix_storage.container_uuid }}"

# -----------------------------------------------------------------------------
# Nutanix VM Configuration
# -----------------------------------------------------------------------------
nutanix_vm:
 # VM identification
 identify_by: "name" # Options: name, uuid, ip
 
 # VM categories (for grouping)
 categories:
 environment: "{{ vm_environment | default('production') }}"
 application: "{{ vm_application | default('general') }}"
 backup_policy: "{{ vm_backup_policy | default('daily') }}"
 
 # Power management
 allow_power_operations: false
 
 # Snapshot settings
 snapshot_before_extend: true
 snapshot_retention_days: 7
 snapshot_naming_prefix: "lvm-extend"

# -----------------------------------------------------------------------------
# Nutanix Disk Extension Configuration
# -----------------------------------------------------------------------------
nutanix_disk:
 # Automatic disk addition
 auto_add_disk: true
 auto_add_threshold_gb: 10 # Add disk if less than this free in VG
 
 # New disk settings
 default_disk_size_gb: 100
 min_disk_size_gb: 50
 max_disk_size_gb: 2000
 disk_size_increment_gb: 50
 
 # Disk type
 disk_type: "DISK" # Options: DISK, CDROM
 device_type: "SCSI" # Options: SCSI, IDE, PCI
 
 # SCSI settings
 scsi_adapter_type: "PVSCSI" # Options: PVSCSI, LSI_LOGIC
 
 # Disk limits per VM
 max_disks_per_vm: 16
 max_total_storage_gb: 10000
 
 # Naming convention
 disk_label_prefix: "lvm-data"
 use_sequential_numbering: true

# -----------------------------------------------------------------------------
# LVM Configuration for Nutanix Hosts
# -----------------------------------------------------------------------------
lvm_nutanix:
 # Default volume group
 default_vg: "rhel"
 
 # Volume groups configuration
 volume_groups:
 rhel:
 description: "Root volume group"
 pvs:
 - /dev/sda2
 lvs:
- name: root
 mount: /
 fstype: xfs
- name: home
 mount: /home
 fstype: xfs
- name: var
 mount: /var
 fstype: xfs
 
 data_vg:
 description: "Data volume group"
 pvs:
 - /dev/sdb
 lvs:
- name: data
 mount: /data
 fstype: xfs
- name: logs
 mount: /var/log
 fstype: xfs
 
 # Logical volumes to manage
 managed_lvs:
 - vg: rhel
 lv: root
 mount: /
 extend_percent: 20
 min_free_gb: 10
 critical_threshold: 90
 warning_threshold: 80
 
 - vg: rhel
 lv: home
 mount: /home
 extend_percent: 15
 min_free_gb: 5
 critical_threshold: 85
 warning_threshold: 75
 
 - vg: rhel
 lv: var
 mount: /var
 extend_percent: 20
 min_free_gb: 10
 critical_threshold: 90
 warning_threshold: 80
 
 - vg: data_vg
 lv: data
 mount: /data
 extend_percent: 25
 min_free_gb: 50
 critical_threshold: 85
 warning_threshold: 75
 
 # File system resizing
 resize_filesystem: true
 verify_resize: true

# Backward compatibility
vg_name: "{{ lvm_nutanix.default_vg }}"
lv_name: root
mount_point: /
extend_percent: 20

# -----------------------------------------------------------------------------
# Nutanix Integration Features
# -----------------------------------------------------------------------------
nutanix_features:
 # VM Management
 manage_vm_power_state: false
 manage_vm_snapshots: true
 manage_vm_categories: true
 
 # Storage Management
 manage_disks: true
 manage_volumes: true
 manage_volume_groups: true
 
 # Monitoring
 collect_vm_metrics: true
 collect_storage_metrics: true
 report_to_prism: true
 
 # Automation
 auto_disk_addition: true
 auto_snapshot_cleanup: true
 auto_category_updates: true

# -----------------------------------------------------------------------------
# Performance and Optimization
# -----------------------------------------------------------------------------
nutanix_performance:
 # I/O optimization
 enable_io_analytics: true
 io_priority: "normal" # Options: high, normal, low
 
 # Cache settings
 cache_policy: "write-back" # Options: write-back, write-through
 
 # QoS settings
 enable_qos: false
 iops_limit: 0 # 0 = unlimited
 bandwidth_limit_mbps: 0 # 0 = unlimited
 
 # Storage optimization
 enable_compression: true
 enable_deduplication: true
 enable_erasure_coding: false

# -----------------------------------------------------------------------------
# Backup and Recovery
# -----------------------------------------------------------------------------
nutanix_backup:
 # Snapshot configuration
 enable_snapshots: true
 snapshot_schedule: "daily"
 snapshot_retention: 7
 
 # Backup integration
 protection_domain: "{{ vm_protection_domain | default('') }}"
 backup_policy: "{{ vm_backup_policy | default('daily') }}"
 
 # Recovery settings
 enable_crash_consistent: true
 enable_app_consistent: false
 
 # Replication
 enable_replication: false
 replication_target: ""
 replication_schedule: "hourly"

# -----------------------------------------------------------------------------
# Monitoring and Alerting
# -----------------------------------------------------------------------------
nutanix_monitoring:
 # Metrics collection
 collect_metrics: true
 metrics_interval_seconds: 60
 
 # Alerts
 enable_alerts: true
 alert_on_disk_add: true
 alert_on_extension: true
 alert_on_failure: true
 
 # Integration with Prism Central alerts
 create_prism_alerts: true
 alert_severity: "WARNING" # Options: CRITICAL, WARNING, INFO
 
 # Performance monitoring
 monitor_iops: true
 monitor_latency: true
 monitor_throughput: true
 
 # Thresholds
 high_latency_threshold_ms: 50
 high_iops_threshold: 10000
 low_throughput_threshold_mbps: 100

# -----------------------------------------------------------------------------
# Security Configuration
# -----------------------------------------------------------------------------
nutanix_security:
 # API security
 use_ssl: true
 verify_certificates: false
 
 # VM security
 enable_secure_boot: false
 enable_vtpm: false
 
 # Data security
 enable_encryption_at_rest: false
 encryption_algorithm: "AES-256"
 
 # Access control
 require_rbac: true
 allowed_operations:
 - read
 - create_disk
 - attach_disk
 - detach_disk
 - create_snapshot
 - delete_snapshot

# -----------------------------------------------------------------------------
# Nutanix-Specific Variables
# -----------------------------------------------------------------------------
nutanix_vars:
 # Cluster information
 cluster_name: "{{ lookup('env', 'NUTANIX_CLUSTER') | default('') }}"
 cluster_uuid: "{{ lookup('env', 'NUTANIX_CLUSTER_UUID') | default('') }}"
 
 # Network configuration
 network_name: "{{ vm_network_name | default('default') }}"
 network_uuid: "{{ vm_network_uuid | default('') }}"
 subnet_name: "{{ vm_subnet_name | default('default') }}"
 
 # Project/tenant
 project_name: "{{ nutanix_project | default('default') }}"
 project_uuid: "{{ nutanix_project_uuid | default('') }}"
 
 # Tags and metadata
 vm_tags:
 managed_by: "ansible"
 automation: "lvm-extension"
 created_by: "{{ ansible_user_id | default('unknown') }}"
 
 # Custom attributes
 custom_attributes: {}

# -----------------------------------------------------------------------------
# Workflow Configuration
# -----------------------------------------------------------------------------
nutanix_workflow:
 # Pre-extension steps
 pre_extension:
 - create_snapshot
 - verify_vm_state
 - check_cluster_capacity
 - validate_storage_container
 
 # Extension steps
 extension:
 - calculate_disk_size
 - create_disk
 - attach_disk
 - scan_scsi_bus
 - create_pv
 - extend_vg
 - extend_lv
 - resize_filesystem
 
 # Post-extension steps
 post_extension:
 - verify_extension
 - update_monitoring
 - create_ticket
 - send_notification
 - cleanup_old_snapshots
 
 # Rollback steps (on failure)
 rollback:
 - detach_disk
 - delete_disk
 - restore_snapshot
 - notify_failure

# -----------------------------------------------------------------------------
# Maintenance and Cleanup
# -----------------------------------------------------------------------------
nutanix_maintenance:
 # Snapshot cleanup
 cleanup_old_snapshots: true
 snapshot_retention_days: 7
 
 # Disk cleanup
 remove_unused_disks: false
 unused_disk_age_days: 30
 
 # Orphaned resources
 cleanup_orphaned_disks: false
 cleanup_orphaned_snapshots: true
 
 # Maintenance windows
 maintenance_window:
 enabled: true
 allowed_days:
 - monday
 - tuesday
 - wednesday
 - thursday
 - friday
 start_time: "22:00"
 end_time: "06:00"

# -----------------------------------------------------------------------------
# Logging and Debugging
# -----------------------------------------------------------------------------
nutanix_logging:
 # Log levels
 log_level: "INFO" # Options: DEBUG, INFO, WARNING, ERROR
 
 # API logging
 log_api_calls: true
 log_api_responses: false
 
 # Operation logging
 log_disk_operations: true
 log_vm_operations: true
 log_snapshot_operations: true
 
 # Debug mode
 debug_mode: false
 verbose_output: false

# -----------------------------------------------------------------------------
# Integration with Other Systems
# -----------------------------------------------------------------------------
integration:
 # ServiceNow
 update_servicenow_cmdb: true
 servicenow_ci_class: "cmdb_ci_vm_instance"
 
 # Red Hat Satellite
 update_satellite_host: true
 
 # Monitoring
 update_monitoring_system: true
 monitoring_system: "prometheus" # Options: prometheus, nagios, zabbix
 
 # CMDB
 update_cmdb: true
 cmdb_system: "servicenow"

# -----------------------------------------------------------------------------
# Testing and Validation
# -----------------------------------------------------------------------------
nutanix_testing:
 # Test mode
 dry_run: "{{ lookup('env', 'DRY_RUN') | default('false') | bool }}"
 
 # Validation checks
 validate_before_extend: true
 validate_after_extend: true
 
 # Test operations
 test_api_connectivity: true
 test_storage_operations: false
 
 # Rollback testing
 test_rollback: false
 auto_rollback_on_failure: true

# -----------------------------------------------------------------------------
# Custom Hooks
# -----------------------------------------------------------------------------
nutanix_hooks:
 # Pre-extension hooks
 pre_extension_script: ""
 pre_extension_playbook: ""
 
 # Post-extension hooks
 post_extension_script: ""
 post_extension_playbook: ""
 
 # Error hooks
 on_error_script: ""
 on_error_playbook: ""
 
 # Success hooks
 on_success_script: ""
 on_success_playbook: ""