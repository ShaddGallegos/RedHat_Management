---
# Common variables for all hosts

# ServiceNow credentials
servicenow_instance: "dev12345"
servicenow_username: "{{ lookup('env', 'SNOW_USER') | default('admin') }}"
servicenow_password: "{{ lookup('env', 'SNOW_PASS') | default('password') }}"

# Notification settings
mail_smtp_host: "smtp.example.com"
mail_smtp_port: 25
admin_email: "admin@example.com"
operations_email: "operations@example.com"

# EDA settings
eda_webhook_url: "http://localhost:5000/webhook"

# Monitoring thresholds
threshold_percent: 90

# ServiceNow
SNOW_INSTANCE: "dev12345"
SNOW_USER: "automation_user"
SNOW_PASS: "secure_password"

# Satellite
SATELLITE_URL: "https://satellite.example.com"
SATELLITE_USER: "admin"
SATELLITE_PASS: "password"

# Insights
INSIGHTS_USER: "username"
INSIGHTS_PASS: "password"

# Nutanix
NUTANIX_HOST: "prism.example.com"
NUTANIX_USER: "admin"
NUTANIX_PASS: "password"

# AAP
AAP_HOST: "aap.example.com"
AAP_USER: "admin"
AAP_PASS: "password"
RH_AUTOMATION_HUB_TOKEN: "token_here"

# Notifications
EMAIL_ENABLED: "true"
SMTP_HOST: "smtp.example.com"
SMTP_USER: "user"
SMTP_PASS: "password"
ADMIN_EMAIL: "admin@example.com"
OPS_EMAIL: "ops@example.com"

# Splunk (optional)
SPLUNK_ENABLED: "true"
SPLUNK_HEC_URL: "https://splunk.example.com:8088/services/collector"
SPLUNK_HEC_TOKEN: "token"

# EDA
EDA_ENABLED: "true"
EDA_WEBHOOK_URL: "http://localhost:5000/webhook"

# Testing
DRY_RUN: "false"