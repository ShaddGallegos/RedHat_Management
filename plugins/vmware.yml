# Example configuration for VMware dynamic inventory plugin
# Place this file in your inventory directory or reference it in your playbook
# Usage: ansible-inventory -i vmware.yml --list

plugin: vmware
api_url: https://vcenter.example.com/rest/vcenter/host
api_token: "{{ lookup('env','VMWARE_API_TOKEN') }}"
fallback: true

hosts:
  - vmware-host1.example.com
  - vmware-host2.example.com

groups:
  vmware_hosts:
    hosts:
      - vmware-host1.example.com
      - vmware-host2.example.com
  vmware_all:
    hosts:
      - vmware-host1.example.com
      - vmware-host2.example.com

hostvars:
  vmware-host1.example.com:
    ansible_host: 192.168.8.11
    datacenter: DC1
  vmware-host2.example.com:
    ansible_host: 192.168.8.12
    datacenter: DC2
