# Example configuration for Satellite dynamic inventory plugin
# Place this file in your inventory directory or reference it in your playbook
# Usage: ansible-inventory -i satellite.yml --list

plugin: satellite
api_url: http://satellite.example.com/api/hosts
api_token: "{{ lookup('env','SATELLITE_API_TOKEN') }}"
fallback: true

hosts:
  - satellite-server.example.com
  - capsule-server.example.com

groups:
  satellite_servers:
    hosts:
      - satellite-server.example.com
  capsule_servers:
    hosts:
      - capsule-server.example.com
  satellite_all:
    hosts:
      - satellite-server.example.com
      - capsule-server.example.com

hostvars:
  satellite-server.example.com:
    ansible_host: 192.168.3.11
    os: RHEL
    capsule: false
  capsule-server.example.com:
    ansible_host: 192.168.3.12
    os: RHEL
    capsule: true
