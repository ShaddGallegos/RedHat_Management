# Example configuration for Libvirt dynamic inventory plugin
# Place this file in your inventory directory or reference it in your playbook
# Usage: ansible-inventory -i libvirt.yml --list

plugin: libvirt
api_url: http://libvirt.example.com/api/hosts
api_token: "{{ lookup('env','LIBVIRT_API_TOKEN') }}"
fallback: true

hosts:
  - libvirt-host1.example.com
  - libvirt-host2.example.com

groups:
  libvirt_hosts:
    hosts:
      - libvirt-host1.example.com
      - libvirt-host2.example.com
  libvirt_all:
    hosts:
      - libvirt-host1.example.com
      - libvirt-host2.example.com

hostvars:
  libvirt-host1.example.com:
    ansible_host: 192.168.4.11
    vm: true
    state: running
  libvirt-host2.example.com:
    ansible_host: 192.168.4.12
    vm: true
    state: stopped
