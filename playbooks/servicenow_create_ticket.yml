---
- name: Create ServiceNow Incident Ticket
- hosts: localhost
  gather_facts: false
 connection: local
 
  vars:
    snow_instance: "{{ lookup('env', 'SNOW_INSTANCE') | default('dev12345') }}"
    snow_username: "{{ lookup('env', 'SNOW_USER') | default('admin') }}"
    snow_password: "{{ lookup('env', 'SNOW_PASS') | default('changeme') }}"
 
  tasks:
- name: Create incident for high disk usage
 servicenow.itsm.incident:
 instance:
 host: "{{ snow_instance }}.service-now.com"
 username: "{{ snow_username }}"
 password: "{{ snow_password }}"
 state: new
 short_description: "High Disk Usage Alert - {{ hostname }}"
 description: |
 Automated LVM Extension Required
 
 Host: {{ hostname }}
 Disk Usage: {{ disk_usage_percent }}%
 Volume Group: {{ vg_name | default('N/A') }}
 Logical Volume: {{ lv_name | default('N/A') }}
 Mount Point: {{ mount_point }}
 Device: {{ device }}
 urgency: high
 impact: medium
 caller: "{{ user_email | default('automation@example.com') }}"
 assignment_group: Storage Team
 register: snow_ticket
 
- name: Display ticket information
 debug:
 msg: "ServiceNow ticket created: {{ snow_ticket.record.number }}"
