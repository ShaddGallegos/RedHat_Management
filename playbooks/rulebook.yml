---
# rulebook.yml - Event Driven Ansible rulebook for automated LVM management with ServiceNow integration
---
- name: Automated LVM Management for RHEL 8/9 on Nutanix with ServiceNow Integration
- hosts: all
 sources:
- name: disk_usage_webhook
 ansible.eda.webhook:
 host: 0.0.0.0
 port: 5000
 endpoint: webhook
 
- name: disk_creation_webhook 
 ansible.eda.webhook:
 host: 0.0.0.0
 port: 5001 # FIXED: Different port to avoid conflicts
 endpoint: create-disk
 
- name: disk_integration_webhook
 ansible.eda.webhook:
 host: 0.0.0.0
 port: 5002 # FIXED: Different port to avoid conflicts
 endpoint: integrate-disk
 
 rules:
 # Rule 1: Handle high disk usage alerts (90%+ usage) - CREATE SNOW TICKET
- name: Handle High Disk Usage - Create ServiceNow Ticket and Trigger LVM Extension
 condition: >
 event.payload.disk_usage_percent is defined and 
 event.payload.disk_usage_percent >= 90 and
 event.payload.is_lvm == true and
 event.payload.os_family == "RedHat" and
 event.payload.os_version in ["8", "9"]
 actions: # FIXED: Changed from 'action' to 'actions' for multiple tasks
 - run_playbook:
- name: playbooks/servicenow_create_ticket.yml
 extra_vars:
 hostname: "{{ event.payload.hostname }}"
 disk_usage_percent: "{{ event.payload.disk_usage_percent }}"
 vg_name: "{{ event.payload.vg_name | default('rhel') }}"
 lv_name: "{{ event.payload.lv_name | default('root') }}"
 mount_point: "{{ event.payload.mount_point | default('/') }}"
 device: "{{ event.payload.device | default('/dev/sda') }}"
 user_email: "{{ event.payload.user_email | default('user@example.com') }}"
 admin_email: "{{ event.payload.admin_email | default('admin@example.com') }}"
 operations_email: "{{ event.payload.operations_email | default('operations@example.com') }}"
 limit: localhost
 
 - run_playbook:
- name: extend_lvm_with_snow.yml
 extra_vars:
 vg_name: "{{ event.payload.vg_name | default('rhel') }}"
 lv_name: "{{ event.payload.lv_name | default('root') }}"
 mount_point: "{{ event.payload.mount_point | default('/') }}"
 device: "{{ event.payload.device | default('/dev/sda') }}"
 extend_percent: 20
 hostname: "{{ event.payload.hostname }}"
 user_email: "{{ event.payload.user_email | default('user@example.com') }}"
 admin_email: "{{ event.payload.admin_email | default('admin@example.com') }}"
 operations_email: "{{ event.payload.operations_email | default('operations@example.com') }}"
 limit: "{{ event.payload.hostname }}"
 
 # Rule 2: Handle new disk creation requests - UPDATE SNOW TICKET
- name: Handle New Disk Creation Request with ServiceNow Update
 condition: >
 event.payload.action is defined and
 event.payload.action == "create_new_disk" and
 event.payload.new_disk_size_gb is defined and
 event.payload.snow_ticket_number is defined
 actions: # FIXED: Changed from 'action' to 'actions'
 - run_playbook:
- name: playbooks/servicenow_update_ticket.yml
 extra_vars:
 snow_ticket_number: "{{ event.payload.snow_ticket_number }}"
 update_message: "Creating new {{ event.payload.new_disk_size_gb }}GB disk for {{ event.payload.hostname }} via Nutanix API"
 work_notes: "Automated disk creation initiated for LVM extension"
 state: "In Progress"
 limit: localhost
 
 - run_playbook:
- name: nutanix_disk_creation_with_snow.yml
 extra_vars:
 vm_name: "{{ event.payload.hostname }}"
 target_hostname: "{{ event.payload.hostname }}"
 new_disk_size_gb: "{{ event.payload.new_disk_size_gb }}"
 vg_name: "{{ event.payload.vg_name | default('rhel') }}"
 lv_name: "{{ event.payload.lv_name | default('root') }}"
 mount_point: "{{ event.payload.mount_point | default('/') }}"
 snow_ticket_number: "{{ event.payload.snow_ticket_number }}"
 nutanix_cluster_ip: "{{ nutanix_host | default('SET_NUTANIX_HOST') }}"
 nutanix_user: "{{ nutanix_username | default('SET_NUTANIX_USER') }}"
 nutanix_pass: "{{ nutanix_password | default('SET_NUTANIX_PASS') }}"
 storage_container_uuid: "{{ storage_container_uuid | default('SET_STORAGE_CONTAINER_UUID') }}"
 limit: localhost
 
 # Rule 3: Handle disk integration after creation - CLOSE SNOW TICKET
- name: Handle Disk Integration and Close ServiceNow Ticket
 condition: >
 event.payload.action is defined and
 event.payload.action == "integrate_new_disk" and
 event.payload.disk_created == true and
 event.payload.snow_ticket_number is defined
 actions: # FIXED: Changed from 'action' to 'actions'
 - run_playbook:
- name: disk_integration_with_snow.yml
 extra_vars:
 new_disk_size_gb: "{{ event.payload.new_disk_size_gb }}"
 vg_name: "{{ event.payload.vg_name | default('rhel') }}"
 lv_name: "{{ event.payload.lv_name | default('root') }}"
 mount_point: "{{ event.payload.mount_point | default('/') }}"
 hostname: "{{ event.payload.hostname }}"
 snow_ticket_number: "{{ event.payload.snow_ticket_number }}"
 limit: "{{ event.payload.hostname }}"
 
 - run_playbook:
- name: playbooks/servicenow_close_ticket.yml
 extra_vars:
 snow_ticket_number: "{{ event.payload.snow_ticket_number }}"
 hostname: "{{ event.payload.hostname }}"
 vg_name: "{{ event.payload.vg_name | default('rhel') }}"
 lv_name: "{{ event.payload.lv_name | default('root') }}"
 mount_point: "{{ event.payload.mount_point | default('/') }}"
 space_added_gb: "{{ event.payload.new_disk_size_gb | default('20% of original') }}"
 user_email: "{{ event.payload.user_email | default('user@example.com') }}"
 admin_email: "{{ event.payload.admin_email | default('admin@example.com') }}"
 operations_email: "{{ event.payload.operations_email | default('operations@example.com') }}"
 limit: localhost
 
 # Rule 4: Handle non-LVM filesystems - CREATE SNOW TICKET (manual intervention)
- name: Handle Non-LVM High Disk Usage with ServiceNow Ticket
 condition: >
 event.payload.disk_usage_percent is defined and 
 event.payload.disk_usage_percent >= 90 and
 event.payload.is_lvm == false
 actions: # FIXED: Changed from 'action' to 'actions'
 - run_playbook:
- name: playbooks/servicenow_create_manual_ticket.yml
 extra_vars:
 hostname: "{{ event.payload.hostname }}"
 mount_point: "{{ event.payload.mount_point | default('/var') }}"
 usage_percent: "{{ event.payload.disk_usage_percent }}"
 device: "{{ event.payload.device | default('/dev/sda1') }}"
 ticket_type: "non_lvm_manual_intervention"
 user_email: "{{ event.payload.user_email | default('user@example.com') }}"
 admin_email: "{{ event.payload.admin_email | default('admin@example.com') }}"
 operations_email: "{{ event.payload.operations_email | default('operations@example.com') }}"
 limit: localhost
 
 - run_playbook:
- name: non_lvm_alert.yml
 extra_vars:
 mount_point: "{{ event.payload.mount_point }}"
 usage_percent: "{{ event.payload.disk_usage_percent }}"
 device: "{{ event.payload.device }}"
 snow_ticket_created: true
 limit: "{{ event.payload.hostname }}"
 
 # Rule 5: Handle unsupported OS versions - CREATE SNOW TICKET (manual intervention)
- name: Handle Unsupported OS Versions with ServiceNow Ticket
 condition: >
 event.payload.disk_usage_percent is defined and 
 event.payload.disk_usage_percent >= 90 and
 (event.payload.os_family!= "RedHat" or
 event.payload.os_version not in ["8", "9"])
 actions: # FIXED: Changed from 'action' to 'actions'
 - run_playbook:
- name: playbooks/servicenow_create_manual_ticket.yml
 extra_vars:
 hostname: "{{ event.payload.hostname }}"
 os_family: "{{ event.payload.os_family | default('Unknown') }}"
 os_version: "{{ event.payload.os_version | default('Unknown') }}"
 usage_percent: "{{ event.payload.disk_usage_percent }}"
 ticket_type: "unsupported_os_manual_intervention"
 user_email: "{{ event.payload.user_email | default('user@example.com') }}"
 admin_email: "{{ event.payload.admin_email | default('admin@example.com') }}"
 operations_email: "{{ event.payload.operations_email | default('operations@example.com') }}"
 limit: localhost
 
 - run_playbook:
- name: unsupported_os_alert.yml
 extra_vars:
 os_family: "{{ event.payload.os_family }}"
 os_version: "{{ event.payload.os_version }}"
 usage_percent: "{{ event.payload.disk_usage_percent }}"
 snow_ticket_created: true
 limit: "{{ event.payload.hostname }}"