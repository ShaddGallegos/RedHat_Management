---
# RHIS Orchestration Playbook
# Main entry point for complete deployment
# Supports all 15 scenarios across 7 platforms with selective execution via tags

- name: "RHIS - Main Orchestration Playbook"
  hosts: localhost
  gather_facts: true

  vars:
    # Load deployment configuration
    deployment_config_file: "{{ lookup('env', 'HOME') }}/.ansible/conf/deployment_config.yml"

    # Deployment metadata
    deployment_version: "1.0.0"
    deployment_timestamp: "{{ ansible_date_time.iso8601 }}"

    # Product definitions
    products:
      scenario_satellite:
        name: "Red Hat Satellite 6.18"
        version: "6.18"
        tags: ["scenario_satellite"]
        roles: ["scenario_satellite"]
      aap:
        name: "Ansible Automation Platform 2.6"
        version: "2.6"
        tags: ["aap"]
        roles: ["aap"]
      idm:
        name: "Red Hat Identity Management 3.0"
        version: "3.0"
        tags: ["idm"]
        roles: ["idm"]
      scenario_openshift:
        name: "OpenShift 4.21+"
        version: "4.21"
        tags: ["scenario_openshift"]
        roles: ["scenario_openshift"]

    # Platform definitions
    platforms:
      libvirt:
        name: "LibVirt (KVM)"
        provisioner_role: "platform_libvirt_vm_provisioner"
        tags: ["libvirt", "local"]
      baremetal:
        name: "Bare Metal"
        provisioner_role: "platform_baremetal_provisioner"
        tags: ["baremetal", "enterprise"]
      aws:
        name: "Amazon Web Services"
        provisioner_role: "platform_infrastructure_manager"
        tags: ["aws", "cloud"]
      azure:
        name: "Microsoft Azure"
        provisioner_role: "platform_infrastructure_manager"
        tags: ["azure", "cloud"]
      gcp:
        name: "Google Cloud Platform"
        provisioner_role: "platform_infrastructure_manager"
        tags: ["gcp", "cloud"]
      platform_vmware:
        name: "VMware vSphere"
        provisioner_role: "platform_infrastructure_manager"
        tags: ["platform_vmware", "enterprise"]
      platform_nutanix:
        name: "Nutanix HCI"
        provisioner_role: "platform_infrastructure_manager"
        tags: ["platform_nutanix", "enterprise"]

    # Scenario definitions (derived from deployment_scenario variable)
    scenario_config: "{{ lookup('vars', 'scenarios_' + deployment_scenario | replace('-', '_')) | default({}) }}"

  # Define all scenario configurations
  vars_files:
    - "{{ playbook_dir }}/scenario_configs.yml"

  pre_tasks:
    - name: "Display deployment header"
      tags: ["always"]
      ansible.builtin.debug:
        msg: |
          
             RHIS Orchestration - Red Hat Infrastructure Standard 
             Version: {{ deployment_version }}                           
             Timestamp: {{ deployment_timestamp }}               
          

          Deployment Configuration:
            Scenario: {{ deployment_scenario }}
            Platform: {{ deployment_platform }}
            OS: {{ deployment_os }}
            Installation Method: {{ install_method | default('oemdrv') }}

    - name: "Load deployment configuration"
      tags: ["always"]
      block:
        - name: "Check if deployment config exists"
          ansible.builtin.stat:
            path: "{{ deployment_config_file }}"
          register: config_stat

        - name: "Load deployment configuration from file"
          ansible.builtin.include_vars:
            ansible.builtin.file: "{{ deployment_config_file }}"
            name: deployment_config
          when: config_stat.stat.exists

        - name: "Create default deployment configuration"
          ansible.builtin.set_fact:
            deployment_config:
              scenario: "{{ deployment_scenario | default('full_stack') }}"
              platform: "{{ deployment_platform | default('libvirt') }}"
              os_generic: "{{ deployment_os | default('rhel-9') }}"
              install_method: "{{ install_method | default('oemdrv') }}"
          when: not config_stat.stat.exists

    - name: "Validate deployment scenario"
      tags: ["always", "validate"]
      ansible.builtin.assert:
        that:
          - deployment_scenario is defined
          - deployment_scenario in scenarios_valid_values
        fail_msg: "Invalid scenario: {{ deployment_scenario }}"
      vars:
        scenarios_valid_values:
          - "satellite_only"
          - "aap_only"
          - "idm_only"
          - "openshift_only"
          - "satellite_aap"
          - "satellite_idm"
          - "satellite_openshift"
          - "aap_idm"
          - "aap_openshift"
          - "idm_openshift"
          - "satellite_aap_idm"
          - "satellite_aap_openshift"
          - "satellite_idm_openshift"
          - "aap_idm_openshift"
          - "full_stack"

    - name: "Validate deployment platform"
      tags: ["always", "validate"]
      ansible.builtin.assert:
        that:
          - deployment_platform is defined
          - deployment_platform in platforms_valid_values
        fail_msg: "Invalid platform: {{ deployment_platform }}"
      vars:
        platforms_valid_values:
          - "libvirt"
          - "baremetal"
          - "aws"
          - "azure"
          - "gcp"
          - "platform_vmware"
          - "platform_nutanix"

  tasks:
    # ========================================================================
    # PHASE 1: Initialization and Infrastructure Preparation
    # ========================================================================

    - name: "PHASE 1 - Initialize Ansible Developer Node"
      tags: ["phase1", "init", "setup"]
      block:
        - name: "Setup ansible developer host environment"
          ansible.builtin.include_role:
            name: "installer_host"
            tasks_from: "setup"
          vars:
            installer_host_ansible_dev_platform: "{{ deployment_platform }}"
          tags: ["init", "setup", "always"]

        - name: "Install platform-specific requirements"
          ansible.builtin.include_role:
            name: "installer_host"
            tasks_from: "platform_requirements"
          vars:
            installer_host_target_platform: "{{ deployment_platform }}"
          tags: ["init", "setup", "requirements"]

        - name: "Initialize credential management"
          ansible.builtin.include_role:
            name: "installer_host"
            tasks_from: "credential_setup"
          tags: ["init", "credentials"]

    - name: "PHASE 2 - Platform Infrastructure Preparation"
      tags: ["phase2", "prepare", "platform_infrastructure_core"]
      block:
        - name: "Prepare platform - {{ deployment_platform }}"
          ansible.builtin.include_role:
            name: "platform_prep"
            tasks_from: "{{ deployment_platform }}"
          tags: ["phase2", "prepare", "platform_infrastructure_core"]

        - name: "Configure platform networking - {{ deployment_platform }}"
          ansible.builtin.include_role:
            name: "platform_prep"
            tasks_from: "networking"
          tags: ["phase2", "prepare", "networking"]

        - name: "Setup installation method - {{ install_method | default('oemdrv') }}"
          ansible.builtin.include_role:
            name: "platform_prep"
            tasks_from: "install_method_{{ install_method | default('oemdrv') }}"
          tags: ["phase2", "prepare", "install_method"]

    - name: "PHASE 3 - Generate Inventory"
      tags: ["phase3", "inventory", "setup"]
      block:
        - name: "Build dynamic inventory"
          ansible.builtin.include_role:
            name: "ansible_dev_node_inventory_generator"
            tasks_from: "main"
          vars:
            inventory_generator_scenario: "{{ deployment_scenario }}"
            inventory_generator_platform: "{{ deployment_platform }}"
          tags: ["phase3", "inventory", "configure"]

        - name: "Validate generated inventory"
          ansible.builtin.include_role:
            name: "ansible_dev_node_inventory_generator"
            tasks_from: "validate"
          tags: ["phase3", "inventory", "validate"]

    # ========================================================================
    # PHASE 4: Product Deployment (Conditional based on Scenario)
    # ========================================================================

    - name: "PHASE 4A - Deploy Satellite 6.18"
      when: "'scenario_satellite' in deployment_scenario"
      tags: ["phase4a", "scenario_satellite"]
      block:
        - name: "Provision Satellite VM/Instance"
          ansible.builtin.include_role:
            name: "{{ platforms[deployment_platform].provisioner_role }}"
            tasks_from: "provision_satellite"
          tags: ["phase4a", "scenario_satellite", "provision"]

        - name: "Configure Satellite base OS"
          ansible.builtin.include_role:
            name: "rhel_base"
            tasks_from: "main"
          vars:
            rhel_base_target_os: "{{ deployment_os }}"
          tags: ["phase4a", "scenario_satellite", "os_generic"]

        - name: "Install and configure Satellite 6.18"
          ansible.builtin.include_role:
            name: "scenario_satellite"
            tasks_from: "install"
          tags: ["phase4a", "scenario_satellite", "install", "configure"]

        - name: "Post-configuration tasks for Satellite"
          ansible.builtin.include_role:
            name: "scenario_satellite"
            tasks_from: "postconfigure"
          tags: ["phase4a", "scenario_satellite", "configure"]

    - name: "PHASE 4B - Deploy AAP 2.6"
      when: "'aap' in deployment_scenario"
      tags: ["phase4b", "aap"]
      block:
        - name: "Provision AAP Controller VM/Instance"
          ansible.builtin.include_role:
            name: "{{ platforms[deployment_platform].provisioner_role }}"
            tasks_from: "provision_aap"
          tags: ["phase4b", "aap", "provision"]

        - name: "Configure AAP base OS"
          ansible.builtin.include_role:
            name: "rhel_base"
            tasks_from: "main"
          vars:
            rhel_base_target_os: "{{ deployment_os }}"
          tags: ["phase4b", "aap", "os_generic"]

        - name: "Install and configure AAP 2.6"
          ansible.builtin.include_role:
            name: "aap"
            tasks_from: "install"
          tags: ["phase4b", "aap", "install", "configure"]

        - name: "Post-configuration tasks for AAP"
          ansible.builtin.include_role:
            name: "aap"
            tasks_from: "postconfigure"
          tags: ["phase4b", "aap", "configure"]

    - name: "PHASE 4C - Deploy IdM 3.0"
      when: "'idm' in deployment_scenario"
      tags: ["phase4c", "idm"]
      block:
        - name: "Provision IdM VM/Instance"
          ansible.builtin.include_role:
            name: "{{ platforms[deployment_platform].provisioner_role }}"
            tasks_from: "provision_idm"
          tags: ["phase4c", "idm", "provision"]

        - name: "Configure IdM base OS"
          ansible.builtin.include_role:
            name: "rhel_base"
            tasks_from: "main"
          vars:
            rhel_base_target_os: "{{ deployment_os }}"
          tags: ["phase4c", "idm", "os_generic"]

        - name: "Install and configure IdM 3.0"
          ansible.builtin.include_role:
            name: "idm"
            tasks_from: "install"
          tags: ["phase4c", "idm", "install", "configure"]

        - name: "Post-configuration tasks for IdM"
          ansible.builtin.include_role:
            name: "idm"
            tasks_from: "postconfigure"
          tags: ["phase4c", "idm", "configure"]

    - name: "PHASE 4D - Deploy OpenShift"
      when: "'scenario_openshift' in deployment_scenario"
      tags: ["phase4d", "scenario_openshift"]
      block:
        - name: "Provision OpenShift platform_infrastructure_core"
          ansible.builtin.include_role:
            name: "{{ platforms[deployment_platform].provisioner_role }}"
            tasks_from: "provision_openshift"
          tags: ["phase4d", "scenario_openshift", "provision"]

        - name: "Configure OpenShift base OS"
          ansible.builtin.include_role:
            name: "rhel_base"
            tasks_from: "main"
          vars:
            rhel_base_target_os: "{{ deployment_os }}"
          tags: ["phase4d", "scenario_openshift", "os_generic"]

        - name: "Install and configure OpenShift"
          ansible.builtin.include_role:
            name: "scenario_openshift"
            tasks_from: "install"
          tags: ["phase4d", "scenario_openshift", "install", "configure"]

        - name: "Post-configuration tasks for OpenShift"
          ansible.builtin.include_role:
            name: "scenario_openshift"
            tasks_from: "postconfigure"
          tags: ["phase4d", "scenario_openshift", "configure"]

    # ========================================================================
    # PHASE 5: Integration Configuration
    # ========================================================================

    - name: "PHASE 5 - Configure Integrations"
      tags: ["phase5", "integrate", "integration_generic"]
      block:
        - name: "Configure Satellite ↔ AAP Integration"
          ansible.builtin.include_role:
            name: "integration_generic"
            tasks_from: "satellite_aap"
          when: "'scenario_satellite' in deployment_scenario and 'aap' in deployment_scenario"
          tags: ["phase5", "integrate", "satellite_aap"]

        - name: "Configure Satellite ↔ IdM Integration"
          ansible.builtin.include_role:
            name: "integration_generic"
            tasks_from: "satellite_idm"
          when: "'scenario_satellite' in deployment_scenario and 'idm' in deployment_scenario"
          tags: ["phase5", "integrate", "satellite_idm"]

        - name: "Configure Satellite ↔ OpenShift Integration"
          ansible.builtin.include_role:
            name: "integration_generic"
            tasks_from: "satellite_openshift"
          when: "'scenario_satellite' in deployment_scenario and 'scenario_openshift' in deployment_scenario"
          tags: ["phase5", "integrate", "satellite_openshift"]

        - name: "Configure AAP ↔ IdM Integration"
          ansible.builtin.include_role:
            name: "integration_generic"
            tasks_from: "aap_idm"
          when: "'aap' in deployment_scenario and 'idm' in deployment_scenario"
          tags: ["phase5", "integrate", "aap_idm"]

        - name: "Configure AAP → OpenShift Integration"
          ansible.builtin.include_role:
            name: "integration_generic"
            tasks_from: "aap_openshift"
          when: "'aap' in deployment_scenario and 'scenario_openshift' in deployment_scenario"
          tags: ["phase5", "integrate", "aap_openshift"]

        - name: "Configure IdM ↔ OpenShift Integration"
          ansible.builtin.include_role:
            name: "integration_generic"
            tasks_from: "idm_openshift"
          when: "'idm' in deployment_scenario and 'scenario_openshift' in deployment_scenario"
          tags: ["phase5", "integrate", "idm_openshift"]

    # ========================================================================
    # PHASE 6: Ansible-CMDB Setup
    # ========================================================================

    - name: "PHASE 6 - Setup Ansible-CMDB"
      tags: ["phase6", "scenario_ansible_cmdb_core"]
      block:
        - name: "Install and configure Ansible-CMDB on Satellite"
          ansible.builtin.include_role:
            name: "scenario_ansible_cmdb_core"
            tasks_from: "main"
          when: "'scenario_satellite' in deployment_scenario"
          tags: ["phase6", "scenario_ansible_cmdb_core", "setup"]

        - name: "Populate Ansible-CMDB with inventory facts"
          ansible.builtin.include_role:
            name: "scenario_ansible_cmdb_core"
            tasks_from: "populate"
          tags: ["phase6", "scenario_ansible_cmdb_core", "populate"]

    # ========================================================================
    # PHASE 7: Validation and Verification
    # ========================================================================

    - name: "PHASE 7 - Validate Deployment"
      tags: ["phase7", "validate"]
      block:
        - name: "Run health checks for deployed products"
          ansible.builtin.include_role:
            name: "ansible_dev_node_support"
            tasks_from: "health_check"
          tags: ["phase7", "validate", "health_check"]

        - name: "Validate integrations"
          ansible.builtin.include_role:
            name: "ansible_dev_node_support"
            tasks_from: "validate_integrations"
          tags: ["phase7", "validate", "integrations"]

        - name: "Generate deployment report"
          ansible.builtin.include_role:
            name: "ansible_dev_node_support"
            tasks_from: "deployment_report"
          tags: ["phase7", "validate", "report"]

  post_tasks:
    - name: "Display deployment completion summary"
      tags: ["always"]
      ansible.builtin.debug:
        msg: |
          
                           DEPLOYMENT COMPLETE                     
          

          Scenario: {{ deployment_scenario }}
          Platform: {{ deployment_platform }}
          OS: {{ deployment_os }}

          Deployment Date: {{ deployment_timestamp }}

          Next Steps:
            1. Review deployment logs
            2. Access Satellite: https://scenario_satellite-host
            3. Access AAP: https://aap-controller
            4. Access IdM: https://idm-host
            5. Access Ansible-CMDB: http://scenario_satellite-host:8081
          For troubleshooting, see:
            - docs/troubleshooting/
            - logs/deployment_{{ deployment_timestamp }}.log
