---
- name: Configure Ansible Automation Platform 2.5
- hosts: localhost
  gather_facts: false

  vars_files:
    - ../vault/credentials.yml

  vars:
    aap_controller_host: "{{ aap.controller_url }}"
    aap_controller_username: "{{ aap.username }}"
    aap_controller_password: "{{ aap.password }}"
    aap_validate_certs: false

    # Organization
    organization_name: "Default"

    # Project
    project_name: "LVM Auto-Extension"
    project_scm_url: "{{ github_repo_url | default('https://github.com/your-org/lvm-automation.git') }}"
    project_scm_branch: "main"

    # Machine credential defaults
    ssh_username: "{{ machine_credentials.ssh_username | default('ansible') }}"
    ssh_key_path: "{{ machine_credentials.ssh_key_path | default('~/.ssh/id_rsa') }}"
    ssh_key_unlock: "{{ machine_credentials.ssh_key_unlock | default('') }}"
    become_method: "{{ machine_credentials.become_method | default('sudo') }}"
    become_username: "{{ machine_credentials.become_username | default('root') }}"
    become_password: "{{ machine_credentials.become_password | default('') }}"

  tasks:
    # ==========================================================================
    # CREDENTIAL TYPES
    # ==========================================================================
- name: Create Nutanix Credential Type
      awx.awx.credential_type:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "Nutanix Prism Central"
        description: "Credential for Nutanix Prism Central API"
        kind: cloud
        inputs:
          fields:
            - id: nutanix_host
              type: string
              label: "Prism Central Host"
            - id: nutanix_port
              type: string
              label: "Prism Central Port"
              default: "9440"
            - id: nutanix_username
              type: string
              label: "Username"
            - id: nutanix_password
              type: string
              label: "Password"
              secret: true
          injectors:
            env:
              NUTANIX_HOST: "{{ '{{' }} nutanix_host {{ '}}' }}"
              NUTANIX_PORT: "{{ '{{' }} nutanix_port {{ '}}' }}"
              NUTANIX_USER: "{{ '{{' }} nutanix_username {{ '}}' }}"
              NUTANIX_PASS: "{{ '{{' }} nutanix_password {{ '}}' }}"
            extra_vars:
              nutanix_host: "{{ '{{' }} nutanix_host {{ '}}' }}"
              nutanix_port: "{{ '{{' }} nutanix_port {{ '}}' }}"
              nutanix_username: "{{ '{{' }} nutanix_username {{ '}}' }}"
              nutanix_password: "{{ '{{' }} nutanix_password {{ '}}' }}"
        state: present

- name: Create Splunk HEC Credential Type
      awx.awx.credential_type:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "Splunk HEC"
        description: "Credential for Splunk HTTP Event Collector"
        kind: cloud
        inputs:
          fields:
            - id: splunk_url
              type: string
              label: "Splunk HEC URL"
            - id: splunk_token
              type: string
              label: "HEC Token"
              secret: true
          injectors:
            env:
              SPLUNK_URL: "{{ '{{' }} splunk_url {{ '}}' }}"
              SPLUNK_TOKEN: "{{ '{{' }} splunk_token {{ '}}' }}"
            extra_vars:
              splunk_url: "{{ '{{' }} splunk_url {{ '}}' }}"
              splunk_token: "{{ '{{' }} splunk_token {{ '}}' }}"
        state: present

    # ==========================================================================
    # MACHINE CREDENTIALS
    # ==========================================================================
- name: Read SSH private key
      slurp:
        src: "{{ ssh_key_path | expanduser }}"
      register: ssh_private_key_content
      when: ssh_key_path is defined and ssh_key_path != ''
      ignore_errors: true

- name: Create Machine Credential (SSH Key)
      awx.awx.credential:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "Linux Servers - SSH Key"
        description: "Machine credential for Linux servers using SSH key authentication"
        organization: "{{ organization_name }}"
        credential_type: "Machine"
        inputs:
          username: "{{ ssh_username }}"
          ssh_key_data: "{{ ssh_private_key_content.content | b64decode }}"
          ssh_key_unlock: "{{ ssh_key_unlock }}"
          become_method: "{{ become_method }}"
          become_username: "{{ become_username }}"
          become_password: "{{ become_password }}"
        state: present
      when: ssh_private_key_content is defined and ssh_private_key_content.content is defined

- name: Create Machine Credential (Username/Password)
      awx.awx.credential:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "Linux Servers - Password"
        description: "Machine credential for Linux servers using password authentication (fallback)"
        organization: "{{ organization_name }}"
        credential_type: "Machine"
        inputs:
          username: "{{ ssh_username }}"
          password: "{{ machine_credentials.ssh_password | default('') }}"
          become_method: "{{ become_method }}"
          become_username: "{{ become_username }}"
          become_password: "{{ become_password }}"
        state: present
      when: machine_credentials.ssh_password is defined and machine_credentials.ssh_password != ''

    # ==========================================================================
    # SERVICENOW CREDENTIALS
    # ==========================================================================
- name: Create ServiceNow Credential
      awx.awx.credential:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "ServiceNow Production"
        description: "ServiceNow ITSM integration for incident management"
        organization: "{{ organization_name }}"
        credential_type: "ServiceNow"
        inputs:
          host: "{{ servicenow.instance }}.service-now.com"
          username: "{{ servicenow.username }}"
          password: "{{ servicenow.password }}"
        state: present
      when: servicenow is defined

    # ==========================================================================
    # NUTANIX CREDENTIALS
    # ==========================================================================
- name: Create Nutanix Credential
      awx.awx.credential:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "Nutanix Prism Central Production"
        description: "Nutanix Prism Central API access for dynamic inventory"
        organization: "{{ organization_name }}"
        credential_type: "Nutanix Prism Central"
        inputs:
          nutanix_host: "{{ nutanix.host }}"
          nutanix_port: "{{ nutanix.port | default('9440') }}"
          nutanix_username: "{{ nutanix.username }}"
          nutanix_password: "{{ nutanix.password }}"
        state: present
      when: nutanix is defined

    # ==========================================================================
    # SPLUNK CREDENTIALS
    # ==========================================================================
- name: Create Splunk HEC Credential
      awx.awx.credential:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "Splunk HEC Production"
        description: "Splunk HTTP Event Collector for log aggregation"
        organization: "{{ organization_name }}"
        credential_type: "Splunk HEC"
        inputs:
          splunk_url: "{{ splunk.url }}"
          splunk_token: "{{ splunk.token }}"
        state: present
      when: splunk is defined

    # ==========================================================================
    # GITHUB/SCM CREDENTIALS
    # ==========================================================================
- name: Create GitHub Credential
      awx.awx.credential:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "GitHub - LVM Automation"
        description: "GitHub access for project repository"
        organization: "{{ organization_name }}"
        credential_type: "Source Control"
        inputs:
          username: "{{ github.username | default('') }}"
          password: "{{ github.token | default('') }}"
        state: present
      when: github is defined and github.token is defined

    # ==========================================================================
    # PROJECT
    # ==========================================================================
- name: Create Project
      awx.awx.project:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "{{ project_name }}"
        description: "LVM Auto-Extension automation project"
        organization: "{{ organization_name }}"
        scm_type: git
        scm_url: "{{ project_scm_url }}"
        scm_branch: "{{ project_scm_branch }}"
        scm_clean: true
        scm_delete_on_update: false
        scm_update_on_launch: true
        scm_update_cache_timeout: 60
        credential: "{{ 'GitHub - LVM Automation' if github is defined and github.token is defined else omit }}"
        state: present
      register: project_result

    # ==========================================================================
    # INVENTORIES
    # ==========================================================================
- name: Create ServiceNow Inventory
      awx.awx.inventory:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "ServiceNow CMDB - Linux Servers"
        description: "Dynamic inventory from ServiceNow CMDB"
        organization: "{{ organization_name }}"
        state: present
      register: servicenow_inventory
      when: servicenow is defined

- name: Create ServiceNow Inventory Source
      awx.awx.inventory_source:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "ServiceNow CMDB Sync"
        description: "Sync Linux servers from ServiceNow CMDB"
        inventory: "ServiceNow CMDB - Linux Servers"
        source: servicenow
        credential: "ServiceNow Production"
        overwrite: true
        update_on_launch: true
        source_vars:
          table: cmdb_ci_linux_server
          fields:
            - name
            - ip_address
            - sys_class_name
            - u_environment
          filter: operational_status=1
          compose:
            ansible_host: ip_address
            environment: u_environment
        state: present
      when: servicenow_inventory is defined and not servicenow_inventory.failed

- name: Create Nutanix Inventory
      awx.awx.inventory:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "Nutanix VMs - Dynamic"
        description: "Dynamic inventory from Nutanix Prism Central"
        organization: "{{ organization_name }}"
        state: present
      register: nutanix_inventory
      when: nutanix is defined

- name: Create Nutanix Inventory Source
      awx.awx.inventory_source:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "Nutanix Prism Central Sync"
        description: "Sync VMs from Nutanix Prism Central"
        inventory: "Nutanix VMs - Dynamic"
        source: scm
        source_project: "{{ project_name }}"
        source_path: "inventory/nutanix_dynamic.py"
        credential: "Nutanix Prism Central Production"
        overwrite: true
        update_on_launch: true
        state: present
      when: nutanix_inventory is defined and not nutanix_inventory.failed

    # ==========================================================================
    # JOB TEMPLATES
    # ==========================================================================
- name: Create Job Template - Monitor Disk Usage
      awx.awx.job_template:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "Monitor Disk Usage"
        description: "Monitor disk usage across target servers"
        organization: "{{ organization_name }}"
        project: "{{ project_name }}"
        playbook: "playbooks/disk_usage_monitor.yml"
        inventory: "{{ servicenow_inventory.id | default(nutanix_inventory.id) }}"
        credentials:
          - "Linux Servers - SSH Key"
        extra_vars:
          threshold_percent: "{{ lvm.threshold_percent | default(80) }}"
        ask_limit_on_launch: true
        ask_variables_on_launch: true
        survey_enabled: true
        survey_spec:
- name: "Disk Usage Monitor Survey"
            description: "Configure disk usage monitoring parameters"
            spec:
              - question_name: "Target Host"
                question_description: "Hostname or IP to monitor (leave blank for all)"
                variable: "target_host"
                type: "text"
                required: false
              - question_name: "Threshold Percentage"
                question_description: "Disk usage percentage to trigger alerts"
                variable: "threshold_percent"
                type: "integer"
                default: 80
                min: 50
                max: 95
                required: true
        state: present
      when: project_result is succeeded

- name: Create Job Template - Extend LVM
      awx.awx.job_template:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "Extend LVM"
        description: "Extend LVM logical volume when disk space is low"
        organization: "{{ organization_name }}"
        project: "{{ project_name }}"
        playbook: "playbooks/extend_lvm.yml"
        inventory: "{{ servicenow_inventory.id | default(nutanix_inventory.id) }}"
        credentials:
          - "Linux Servers - SSH Key"
        extra_vars:
          lvm_extend_percent: "{{ lvm.extend_percent | default(20) }}"
        ask_limit_on_launch: true
        ask_variables_on_launch: true
        become_enabled: true
        survey_enabled: true
        survey_spec:
- name: "LVM Extension Survey"
            description: "Configure LVM extension parameters"
            spec:
              - question_name: "Target Host"
                question_description: "Hostname or IP to extend"
                variable: "target_host"
                type: "text"
                required: true
              - question_name: "Mount Point"
                question_description: "Mount point to extend (e.g., /, /var, /home)"
                variable: "mount_point"
                type: "text"
                default: "/"
                required: true
              - question_name: "Extension Size (GB)"
                question_description: "Size in GB to extend (0 for auto-calculate)"
                variable: "extend_gb"
                type: "integer"
                default: 0
                min: 0
                max: 500
                required: true
        state: present
      when: project_result is succeeded

- name: Create Job Template - Create ServiceNow Ticket
      awx.awx.job_template:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "Create ServiceNow Ticket"
        description: "Create incident ticket in ServiceNow for disk space issues"
        organization: "{{ organization_name }}"
        project: "{{ project_name }}"
        playbook: "playbooks/servicenow_create_ticket.yml"
        inventory: "{{ servicenow_inventory.id | default(nutanix_inventory.id) }}"
        credentials:
          - "Linux Servers - SSH Key"
          - "ServiceNow Production"
        ask_variables_on_launch: true
        survey_enabled: true
        survey_spec:
- name: "ServiceNow Ticket Survey"
            description: "Configure incident ticket parameters"
            spec:
              - question_name: "Hostname"
                question_description: "Server hostname"
                variable: "hostname"
                type: "text"
                required: true
              - question_name: "Disk Usage Percent"
                question_description: "Current disk usage percentage"
                variable: "disk_usage_percent"
                type: "integer"
                required: true
              - question_name: "Priority"
                question_description: "Incident priority (1=Critical, 2=High, 3=Moderate, 4=Low)"
                variable: "snow_priority"
                type: "multiplechoice"
                choices:
                  - "1"
                  - "2"
                  - "3"
                  - "4"
                default: "3"
                required: true
        state: present
      when: project_result is succeeded and servicenow is defined

    # ==========================================================================
    # WORKFLOW TEMPLATE
    # ==========================================================================
- name: Create Workflow Template
      awx.awx.workflow_job_template:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "LVM Auto-Extension Workflow"
        description: "Complete workflow for monitoring and extending LVM"
        organization: "{{ organization_name }}"
        inventory: "{{ servicenow_inventory.id | default(nutanix_inventory.id) }}"
        ask_variables_on_launch: true
        ask_inventory_on_launch: true
        ask_limit_on_launch: true
        extra_vars:
          workflow_type: "auto_extension"
        survey_enabled: true
        survey_spec:
- name: "LVM Workflow Survey"
            description: "Configure the LVM auto-extension workflow"
            spec:
              - question_name: "Target Server"
                question_description: "Server to monitor and extend"
                variable: "target_host"
                type: "text"
                required: true
              - question_name: "Mount Point"
                question_description: "Mount point to monitor (e.g., /, /var)"
                variable: "mount_point"
                type: "text"
                default: "/"
                required: true
              - question_name: "Auto-Extend Enabled"
                question_description: "Automatically extend if threshold exceeded?"
                variable: "auto_extend"
                type: "multiplechoice"
                choices:
                  - "yes"
                  - "no"
                default: "yes"
                required: true
        state: present
      register: workflow_template

    # ==========================================================================
    # WORKFLOW NODES
    # ==========================================================================
- name: Create Workflow Node - Sync Inventory
      awx.awx.workflow_job_template_node:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
        workflow_job_template: "LVM Auto-Extension Workflow"
        unified_job_template: "{{ servicenow_inventory.id | default(nutanix_inventory.id) }}"
        identifier: "sync_inventory"
        state: present
      when: workflow_template is succeeded

- name: Create Workflow Node - Monitor Disk Usage
      awx.awx.workflow_job_template_node:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
        workflow_job_template: "LVM Auto-Extension Workflow"
        unified_job_template: "Monitor Disk Usage"
        identifier: "monitor_usage"
        state: present
      when: workflow_template is succeeded

- name: Create Workflow Node - Extend LVM
      awx.awx.workflow_job_template_node:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
        workflow_job_template: "LVM Auto-Extension Workflow"
        unified_job_template: "Extend LVM"
        identifier: "extend_lvm"
        state: present
      when: workflow_template is succeeded

- name: Create Workflow Node - Create Ticket on Failure
      awx.awx.workflow_job_template_node:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
        workflow_job_template: "LVM Auto-Extension Workflow"
        unified_job_template: "Create ServiceNow Ticket"
        identifier: "create_ticket"
        state: present
      when: workflow_template is succeeded and servicenow is defined

- name: Link Workflow Nodes
      awx.awx.workflow_job_template_node:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
        workflow_job_template: "LVM Auto-Extension Workflow"
        identifier: "{{ item.identifier }}"
        success_nodes: "{{ item.success | default(omit) }}"
        failure_nodes: "{{ item.failure | default(omit) }}"
        state: present
      loop:
        - identifier: sync_inventory
          success:
            - monitor_usage
        - identifier: monitor_usage
          success:
            - extend_lvm
          failure:
            - create_ticket
        - identifier: extend_lvm
          failure:
            - create_ticket
      when: workflow_template is succeeded

    # ==========================================================================
    # EDA CONFIGURATION
    # ==========================================================================
- name: Configure EDA Controller Project
      ansible.eda.project:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "{{ project_name }}"
        description: "LVM Auto-Extension EDA project"
        scm_type: git
        scm_url: "{{ project_scm_url }}"
        scm_branch: "{{ project_scm_branch }}"
        credential: "{{ 'GitHub - LVM Automation' if github is defined and github.token is defined else omit }}"
        state: present
      register: eda_project
      when: aap.eda_enabled | default(false)

- name: Create EDA Rulebook Activation - Webhook
      ansible.eda.rulebook_activation:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "LVM Webhook Listener"
        description: "Listen for disk usage webhook alerts"
        project: "{{ project_name }}"
        rulebook: "rulebook.yml"
        decision_environment: "Default Decision Environment"
        enabled: true
        state: present
      when: eda_project is succeeded

- name: Create EDA Rulebook Activation - Splunk
      ansible.eda.rulebook_activation:
        controller_host: "{{ aap_controller_host }}"
        controller_username: "{{ aap_controller_username }}"
        controller_password: "{{ aap_controller_password }}"
        validate_certs: "{{ aap_validate_certs }}"
- name: "LVM Splunk Integration"
        description: "Process disk usage alerts from Splunk"
        project: "{{ project_name }}"
        rulebook: "rulebook_splunk.yml"
        decision_environment: "Default Decision Environment"
        credentials:
          - "Splunk HEC Production"
        enabled: true
        state: present
      when: eda_project is succeeded and splunk is defined

    # ==========================================================================
    # SUMMARY
    # ==========================================================================
- name: Display Configuration Summary
      debug:
        msg:
          - "╔═══════════════════════════════════════════════════════╗"
          - "║ AAP 2.5 Configuration Complete ║"
          - "╚═══════════════════════════════════════════════════════╝"
          - ""
          - "Credentials Created:"
          - " [OK] Machine Credential: Linux Servers - SSH Key"
          - " [OK] Machine Credential: Linux Servers - Password"
          - " {{ '[OK] ServiceNow: ServiceNow Production' if servicenow is defined else '[ERROR] ServiceNow: Not configured' }}"
          - " {{ '[OK] Nutanix: Nutanix Prism Central Production' if nutanix is defined else '[ERROR] Nutanix: Not configured' }}"
          - " {{ '[OK] Splunk: Splunk HEC Production' if splunk is defined else '[ERROR] Splunk: Not configured' }}"
          - " {{ '[OK] GitHub: GitHub - LVM Automation' if github is defined and github.token is defined else '[ERROR] GitHub: Not configured' }}"
          - ""
          - "Project: {{ project_name }}"
          - " Repository: {{ project_scm_url }}"
          - " Branch: {{ project_scm_branch }}"
          - ""
          - "Inventories:"
          - " {{ '[OK] ServiceNow CMDB - Linux Servers' if servicenow is defined else '[ERROR] ServiceNow inventory not created' }}"
          - " {{ '[OK] Nutanix VMs - Dynamic' if nutanix is defined else '[ERROR] Nutanix inventory not created' }}"
          - ""
          - "Job Templates:"
          - " [OK] Monitor Disk Usage"
          - " [OK] Extend LVM"
          - " {{ '[OK] Create ServiceNow Ticket' if servicenow is defined else '[ERROR] ServiceNow ticket template not created' }}"
          - ""
          - "Workflow Template:"
          - " [OK] LVM Auto-Extension Workflow"
          - ""
