---
- name: Setup Red Hat Satellite Integration
- hosts: all
  become: true
  gather_facts: true

  vars:
    satellite_server_url: "https://satellite.example.com"
    satellite_username: "admin"
    satellite_password: "password"
    satellite_organization: "Default_Org"

  tasks:
- name: Ensure python3 and required packages are installed
      ansible.builtin.package:
- name:
          - python3
          - python3-requests
        state: present

- name: Ensure ansible-collection for Satellite is installed (run on control node)
      delegate_to: localhost
      ansible.builtin.command: ansible-galaxy collection install theforeman.foreman
      changed_when: false

- name: Display Satellite integration info
      ansible.builtin.debug:
        msg: |
          Satellite integration variables:
          Server: {{ satellite_server_url }}
          Organization: {{ satellite_organization }}