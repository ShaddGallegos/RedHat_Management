---
- name: Handle Unsupported OS Version Alert
- hosts: all
  gather_facts: true
 collections:
 - community.general
 
  tasks:
- name: Get detailed OS information
 ansible.builtin.setup:
 gather_subset:
 - distribution
 register: os_details
 
- name: Check OS family
 ansible.builtin.set_fact:
 os_name: "{{ ansible_distribution }}"
 os_version_full: "{{ ansible_distribution_version }}"
 os_version_major: "{{ ansible_distribution_major_version }}"
 
- name: Get kernel version
 ansible.builtin.command: uname -r
 register: kernel_version
 changed_when: false
 
- name: Get filesystem information
 ansible.builtin.command: df -h
 register: fs_info
 changed_when: false
 
- name: Check if LVM is installed
 ansible.builtin.command: which lvs
 register: lvm_check
 changed_when: false
 ignore_errors: true
 
- name: Set LVM status
 ansible.builtin.set_fact:
 lvm_installed: "{{ lvm_check.rc == 0 }}"
 
- name: Log unsupported OS information
 ansible.builtin.debug:
 msg: |
 Unsupported OS alert for {{ inventory_hostname }}
 
 OS details:
 - Distribution: {{ os_name }}
 - Version: {{ os_version_full }} (Major: {{ os_version_major }})
 - Kernel: {{ kernel_version.stdout }}
 - LVM installed: {{ lvm_installed | default('Unknown') }}
 
 Current disk usage: {{ usage_percent }}%
 
 Filesystem information:
 {{ fs_info.stdout }}
 
 This OS version is not supported by the automated LVM extension system.
 Supported versions: Red Hat Enterprise Linux 8, 9
 
 A ServiceNow ticket has been created: {{ snow_ticket_created | default('No') }}
 
- name: Send alert email with details
 community.general.mail:
 to: "{{ item }}"
 subject: "MANUAL ACTION REQUIRED: Unsupported OS ({{ os_name }} {{ os_version_major }}) with high disk usage on {{ inventory_hostname }}"
 body: |
 A high disk usage alert has been detected on an unsupported OS:
 
 System: {{ inventory_hostname }}
 OS: {{ os_name }} {{ os_version_full }}
 Current usage: {{ usage_percent }}%
 
 Automated LVM extension is only supported on:
 - Red Hat Enterprise Linux 8
 - Red Hat Enterprise Linux 9
 
 A ServiceNow ticket has been created for manual intervention.
 
 Recommended actions:
 1. Manual disk space management required
 2. Consider OS upgrade if feasible
 3. If system information is incorrect, update inventory data
 
 Current filesystem information:
 {{ fs_info.stdout | truncate(500) }}
 
 This is an automated alert from the disk monitoring system.
 smtp_host: "{{ mail_smtp_host | default('localhost') }}"
 smtp_port: "{{ mail_smtp_port | default(25) }}"
 loop:
 - "{{ user_email | default('user@example.com') }}"
 - "{{ admin_email | default('admin@example.com') }}"
 - "{{ operations_email | default('operations@example.com') }}"
 ignore_errors: true
 when: send_notifications | default(true) | bool