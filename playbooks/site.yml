---
# RHIS Main Playbook (wrapper) - includes modular playbooks
- name: RHIS Main Playbook
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/defaults/global.yml"
  tasks:
    - name: Include setup framework
      ansible.builtin.include_tasks: "{{ playbook_dir }}/setup_framework.yml"
      tags: ["setup", "interactive"]

    - name: Include inventory generator
      ansible.builtin.include_tasks: "{{ playbook_dir }}/generate_inventory.yml"
      tags: ["inventory"]

    - name: Include orchestration
      ansible.builtin.include_tasks: "{{ playbook_dir }}/orchestration.yml"
      tags: ["orchestration"]
