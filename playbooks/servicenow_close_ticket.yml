---
- name: Close ServiceNow Ticket
- hosts: localhost
  gather_facts: false
 connection: local
 
  vars:
    snow_instance: "{{ lookup('env', 'SNOW_INSTANCE') | default('dev12345') }}"
    snow_username: "{{ lookup('env', 'SNOW_USER') | default('admin') }}"
    snow_password: "{{ lookup('env', 'SNOW_PASS') | default('changeme') }}"
 
  tasks:
- name: Resolve and close incident
 servicenow.itsm.incident:
 instance:
 host: "{{ snow_instance }}.service-now.com"
 username: "{{ snow_username }}"
 password: "{{ snow_password }}"
 state: resolved
 number: "{{ snow_ticket_number }}"
 close_code: "Solved (Permanently)"
 close_notes: |
 LVM Extension Completed Successfully
 
 Host: {{ hostname }}
 Volume Group: {{ vg_name }}
 Logical Volume: {{ lv_name }}
 Mount Point: {{ mount_point }}
 Space Added: {{ space_added_gb }}GB
 register: snow_close
