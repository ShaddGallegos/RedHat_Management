---
- name: Setup Libvirt on target host
- hosts: all
  become: true
  gather_facts: true

  vars:
    libvirt_default_pool: "default"
    libvirt_default_network: "default"
    libvirt_pool_path: "/var/lib/libvirt/images"

  tasks:
- name: Ensure libvirt and dependencies are installed
      ansible.builtin.package:
- name:
          - libvirt
          - python3-libvirt
          - virt-install
        state: present

- name: Ensure libvirtd service is enabled and running
      ansible.builtin.service:
- name: libvirtd
        state: started
        enabled: true

- name: Check if default storage pool exists
      ansible.builtin.command: virsh pool-info "{{ libvirt_default_pool }}"
      register: pool_info
      ignore_errors: true

- name: Create default storage pool if not present
      ansible.builtin.shell: |
        virsh pool-define-as "{{ libvirt_default_pool }}" dir --target "{{ libvirt_pool_path }}"
        virsh pool-build "{{ libvirt_default_pool }}"
        virsh pool-start "{{ libvirt_default_pool }}"
        virsh pool-autostart "{{ libvirt_default_pool }}"
      when: pool_info.rc != 0

- name: Check if default network exists
      ansible.builtin.command: virsh net-info "{{ libvirt_default_network }}"
      register: net_info
      ignore_errors: true

- name: Create default network if not present
      ansible.builtin.shell: |
        cat > /tmp/default_network.xml <<EOF
        <network>
          <name>{{ libvirt_default_network }}</name>
          <bridge name="virbr0" />
          <forward mode="nat"/>
          <ip address="192.168.122.1" netmask="255.255.255.0">
            <dhcp>
              <range start="192.168.122.2" end="192.168.122.254" />
            </dhcp>
          </ip>
        </network>
        EOF
        virsh net-define /tmp/default_network.xml
        virsh net-start "{{ libvirt_default_network }}"
        virsh net-autostart "{{ libvirt_default_network }}"
        rm -f /tmp/default_network.xml
      when: net_info.rc != 0

- name: Display libvirt setup summary
      ansible.builtin.debug:
        msg: |
          Libvirt setup complete.
          Storage pool: {{ libvirt_default_pool }} ({{ libvirt_pool_path }})
          Network: {{ libvirt_default_network }}