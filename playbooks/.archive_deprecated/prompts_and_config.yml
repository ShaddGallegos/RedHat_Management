---
# Prompts and Configuration Manager
# Best-practices approach for interactive scenario/platform selection
# Uses tags for conditional execution and modular structure
# Supports both interactive and CLI-based deployment selection

- name: "RHIS - Interactive Prompts and Configuration Manager"
  hosts: localhost
  gather_facts: yes
  
  # Load all variables from env.yml or vault
  vars_files:
    - "{{ lookup('first_found', params) }}"
  
  vars:
    # File discovery with fallback
    # NOTE: This archived playbook will only consider a user-local vaulted
    # env file at `~/.ansible/conf/env.yml`. It will NOT automatically load
    # a repository-root `env.yml` to avoid accidental commits of secrets.
    params:
      files:
        - "{{ ansible_user_dir }}/.ansible/conf/env.yml"
      skip: true
    
    # Scenario definitions - use tags for selective execution
    scenarios:
      satellite_only:
        name: "Satellite Only"
        description: "Systems management and platform_provisioning"
        components: ["scenario_satellite"]
        tags: ["scenario_satellite", "single-product"]
        min_resources: { cpu: 8, memory: 32, disk: 500 }
      
      aap_only:
        name: "AAP Only"
        description: "Automation platform and ansible_dev_node_orchestration"
        components: ["aap"]
        tags: ["aap", "single-product"]
        min_resources: { cpu: 8, memory: 16, disk: 100 }
      
      idm_only:
        name: "IdM Only"
        description: "Identity and access management"
        components: ["idm"]
        tags: ["idm", "single-product"]
        min_resources: { cpu: 4, memory: 8, disk: 50 }
      
      satellite_aap:
        name: "Satellite + AAP"
        description: "Inventory management + Automation"
        components: ["scenario_satellite", "aap"]
        tags: ["scenario_satellite", "aap", "integration_generic", "multi-product"]
        min_resources: { cpu: 16, memory: 48, disk: 600 }
      
      satellite_idm:
        name: "Satellite + IdM"
        description: "Inventory management + Authentication"
        components: ["scenario_satellite", "idm"]
        tags: ["scenario_satellite", "idm", "integration_generic", "multi-product"]
        min_resources: { cpu: 12, memory: 40, disk: 550 }
      
      aap_idm:
        name: "AAP + IdM"
        description: "Automation + Authentication"
        components: ["aap", "idm"]
        tags: ["aap", "idm", "integration_generic", "multi-product"]
        min_resources: { cpu: 12, memory: 24, disk: 150 }
      
      full_stack:
        name: "Full Stack (Satellite + AAP + IdM + OpenShift)"
        description: "Complete Red Hat management platform"
        components: ["scenario_satellite", "aap", "idm", "scenario_openshift"]
        tags: ["scenario_satellite", "aap", "idm", "scenario_openshift", "integration_generic", "full-stack"]
        min_resources: { cpu: 32, memory: 128, disk: 1000 }
    
    # Platform definitions - use tags for selective execution
    platforms:
      libvirt:
        name: "LibVirt (KVM)"
        description: "Local KVM virtualization (recommended for testing)"
        tags: ["libvirt", "local", "virtualized"]
        requires: ["kvm", "libvirt", "virt-manager"]
        default: true
      
      baremetal:
        name: "Bare Metal"
        description: "Direct installation on physical servers"
        tags: ["baremetal", "on-premises", "physical"]
        requires: ["pxe", "dhcp", "tftp"]
        default: false
      
      aws:
        name: "Amazon Web Services (AWS)"
        description: "Cloud deployment on AWS EC2"
        tags: ["aws", "cloud", "public-cloud"]
        requires: ["aws-cli", "boto3"]
        default: false
      
      azure:
        name: "Microsoft Azure"
        description: "Cloud deployment on Azure VMs"
        tags: ["azure", "cloud", "public-cloud"]
        requires: ["azure-cli", "azure-sdk"]
        default: false
      
      gcp:
        name: "Google Cloud Platform (GCP)"
        description: "Cloud deployment on Google Cloud"
        tags: ["gcp", "cloud", "public-cloud"]
        requires: ["gcloud", "google-cloud-sdk"]
        default: false
      
      platform_vmware:
        name: "VMware vSphere"
        description: "Deployment on VMware platform_infrastructure_core"
        tags: ["platform_vmware", "on-premises", "virtualized"]
        requires: ["pyvmomi"]
        default: false
      
      platform_nutanix:
        name: "Nutanix AHV"
        description: "Deployment on Nutanix platform_infrastructure_core"
        tags: ["platform_nutanix", "on-premises", "virtualized"]
        requires: ["platform_nutanix-sdk"]
        default: false
    
    # Operating system selections
    operating_systems:
      rhel_9:
        name: "RHEL 9"
        version: "9.x"
        tags: ["rhel", "rhel-9"]
        default: true
      
      rhel_10:
        name: "RHEL 10"
        version: "10.x"
        tags: ["rhel", "rhel-10"]
        default: false
  
  # Pre-task: Display welcome and check requirements
  pre_tasks:
    - name: "Display Welcome Banner"
      ansible.builtin.debug:
        msg: |
          
          ╔════════════════════════════════════════════════════════════════════════════════╗
          ║                                                                                ║
          ║            🔴 Red Hat Infrastructure Standard (RHIS) Deployment 🔴             ║
          ║                    Interactive Configuration Wizard                           ║
          ║                                                                                ║
          ║  Unified Platform: Satellite 6.18 | AAP 2.6 | IdM 3.0 | OpenShift 4.21       ║
          ║                                                                                ║
          ╚════════════════════════════════════════════════════════════════════════════════╝
          
      tags: ["always"]
    
    - name: "Verify System Requirements"
      block:
        - name: Check Ansible installation
          ansible.builtin.command: ansible --version
          register: ansible_check
          changed_when: false
        
        - name: Display Ansible version
          ansible.builtin.debug:
            msg: "✓ Ansible installed: {{ ansible_check.stdout_lines[0] }}"
      tags: ["always"]
  
  # Main tasks - organized by execution flow
  tasks:
    # STEP 1: Scenario Selection
    - name: "STEP 1 - Select Deployment Scenario"
      block:
        - name: "Display available scenarios"
          ansible.builtin.debug:
            msg: |
              
              Available Deployment Scenarios:
              {% for scenario_key, scenario_data in scenarios.items() %}
              
              [{{ loop.index }}] {{ scenario_data.name }}
                  {% if scenario_data.description %}{{ scenario_data.description }}{% endif %}
                  Components: {{ scenario_data.components | join(', ') }}
                  Resources: CPU {{ scenario_data.min_resources.cpu }}+, RAM {{ scenario_data.min_resources.memory }}GB+, Disk {{ scenario_data.min_resources.disk }}GB+
              {% endfor %}
          tags: ["prompt", "scenario"]
        
        - name: "Prompt for scenario selection"
          ansible.builtin.pause:
            prompt: |
              
              Select deployment scenario (enter number or name):
              [1] Satellite Only
              [2] AAP Only
              [3] IdM Only
              [4] Satellite + AAP
              [5] Satellite + IdM
              [6] AAP + IdM
              [7] Full Stack (All Products)
          register: scenario_selection
          tags: ["prompt", "scenario"]
        
        - name: "Set deployment scenario"
          ansible.builtin.set_fact:
            deployment_scenario: "{{ scenario_map[scenario_selection.user_input | lower] }}"
            scenario_details: "{{ scenarios[scenario_map[scenario_selection.user_input | lower]] }}"
          vars:
            scenario_map:
              "1": "satellite_only"
              "2": "aap_only"
              "3": "idm_only"
              "4": "satellite_aap"
              "5": "satellite_idm"
              "6": "aap_idm"
              "7": "full_stack"
              "scenario_satellite only": "satellite_only"
              "aap only": "aap_only"
              "idm only": "idm_only"
              "scenario_satellite + aap": "satellite_aap"
              "scenario_satellite + idm": "satellite_idm"
              "aap + idm": "aap_idm"
              "full stack": "full_stack"
          tags: ["prompt", "scenario"]
        
        - name: "Validate scenario selection"
          ansible.builtin.assert:
            that:
              - deployment_scenario is defined
              - deployment_scenario in scenarios
            fail_msg: "Invalid scenario selection. Please try again."
          tags: ["prompt", "scenario", "validate"]
        
        - name: "Display scenario confirmation"
          ansible.builtin.debug:
            msg: |
              
              ✓ Scenario selected: {{ scenario_details.name }}
              Components: {{ scenario_details.components | join(', ') }}
              Required tags: {{ scenario_details.tags | join(', ') }}
      
      tags: ["step1", "scenario", "prompt"]
    
    # STEP 2: Platform Selection
    - name: "STEP 2 - Select Deployment Platform"
      block:
        - name: "Display available platforms"
          ansible.builtin.debug:
            msg: |
              
              Available Deployment Platforms:
              {% for platform_key, platform_data in platforms.items() %}
              
              [{{ loop.index }}] {{ platform_data.name }}
                  {{ platform_data.description }}
              {% endfor %}
          tags: ["prompt", "platform"]
        
        - name: "Prompt for platform selection"
          ansible.builtin.pause:
            prompt: |
              
              Select deployment platform (enter number or name):
              [1] LibVirt (KVM) - Local virtualization (recommended)
              [2] Bare Metal - Physical servers
              [3] AWS - Amazon Web Services
              [4] Azure - Microsoft Azure
              [5] GCP - Google Cloud Platform
              [6] VMware - vSphere platform_infrastructure_core
              [7] Nutanix - AHV platform_infrastructure_core
          register: platform_selection
          tags: ["prompt", "platform"]
        
        - name: "Set deployment platform"
          ansible.builtin.set_fact:
            deployment_platform: "{{ platform_map[platform_selection.user_input | lower] }}"
            platform_details: "{{ platforms[platform_map[platform_selection.user_input | lower]] }}"
          vars:
            platform_map:
              "1": "libvirt"
              "2": "baremetal"
              "3": "aws"
              "4": "azure"
              "5": "gcp"
              "6": "platform_vmware"
              "7": "platform_nutanix"
              "libvirt": "libvirt"
              "baremetal": "baremetal"
              "aws": "aws"
              "azure": "azure"
              "gcp": "gcp"
              "platform_vmware": "platform_vmware"
              "platform_nutanix": "platform_nutanix"
          tags: ["prompt", "platform"]
        
        - name: "Validate platform selection"
          ansible.builtin.assert:
            that:
              - deployment_platform is defined
              - deployment_platform in platforms
            fail_msg: "Invalid platform selection. Please try again."
          tags: ["prompt", "platform", "validate"]
        
        - name: "Display platform confirmation"
          ansible.builtin.debug:
            msg: |
              
              ✓ Platform selected: {{ platform_details.name }}
              Description: {{ platform_details.description }}
              Required: {{ platform_details.requires | join(', ') }}
      
      tags: ["step2", "platform", "prompt"]
    
    # STEP 3: Operating System Selection
    - name: "STEP 3 - Select Operating System"
      block:
        - name: "Prompt for OS selection"
          ansible.builtin.pause:
            prompt: |
              
              Select Operating System:
              [1] RHEL 9 (Recommended)
              [2] RHEL 10
          register: os_selection
          tags: ["prompt", "os_generic"]
        
        - name: "Set deployment OS"
          ansible.builtin.set_fact:
            deployment_os: "{{ os_map[os_selection.user_input | lower] }}"
            os_details: "{{ operating_systems[os_map[os_selection.user_input | lower]] }}"
          vars:
            os_map:
              "1": "rhel_9"
              "2": "rhel_10"
              "rhel 9": "rhel_9"
              "rhel 10": "rhel_10"
          tags: ["prompt", "os_generic"]
        
        - name: "Display OS confirmation"
          ansible.builtin.debug:
            msg: |
              
              ✓ OS selected: {{ os_details.name }} ({{ os_details.version }})
      
      tags: ["step3", "os_generic", "prompt"]
    
    # STEP 4: Deployment Summary and Confirmation
    - name: "STEP 4 - Review Deployment Configuration"
      block:
        - name: "Display deployment configuration summary"
          ansible.builtin.debug:
            msg: |
              
              ╔════════════════════════════════════════════════════════════════════════════════╗
              ║                    DEPLOYMENT CONFIGURATION SUMMARY                          ║
              ╚════════════════════════════════════════════════════════════════════════════════╝
              
              Scenario:           {{ scenario_details.name }}
              Components:         {{ scenario_details.components | join(', ') | upper }}
              
              Platform:           {{ platform_details.name }}
              Requirements:       {{ platform_details.requires | join(', ') }}
              
              Operating System:   {{ os_details.name }}
              
              Minimum Resources:
              - CPU:      {{ scenario_details.min_resources.cpu }} cores
              - Memory:   {{ scenario_details.min_resources.memory }} GB
              - Disk:     {{ scenario_details.min_resources.disk }} GB
              
              Execution Tags:
              - Scenario:  {{ scenario_details.tags | join(', ') }}
              - Platform:  {{ platform_details.tags | join(', ') }}
              - OS:        {{ os_details.tags | join(', ') }}
              
              ╔════════════════════════════════════════════════════════════════════════════════╗
          tags: ["summary"]
        
        - name: "Confirm deployment"
          ansible.builtin.pause:
            prompt: |
              
              Ready to proceed with deployment? (yes/no)
          register: deployment_confirmation
          tags: ["confirm"]
        
        - name: "Validate confirmation"
          ansible.builtin.assert:
            that:
              - deployment_confirmation.user_input | lower == "yes"
            fail_msg: "Deployment cancelled by user."
          tags: ["confirm", "validate"]
      
      tags: ["step4", "summary", "confirm"]
    
    # STEP 5: Display deployment instructions
    - name: "STEP 5 - Display Deployment Instructions"
      block:
        - name: "Show next steps"
          ansible.builtin.debug:
            msg: |
              
              ╔════════════════════════════════════════════════════════════════════════════════╗
              ║                         DEPLOYMENT READY TO EXECUTE                          ║
              ╚════════════════════════════════════════════════════════════════════════════════╝
              
              To execute deployment with your selected configuration, run:
              
              ansible-playbook redhat_management-site.yml \
                --tags "{{ (scenario_details.tags + platform_details.tags + os_details.tags) | join(',') }}" \
                -e "deployment_scenario={{ deployment_scenario }}" \
                -e "deployment_platform={{ deployment_platform }}" \
                -e "deployment_os={{ deployment_os }}"
              
              Alternative: Include all components in single run
              
              ansible-playbook redhat_management-site.yml \
                -e "deployment_scenario={{ deployment_scenario }}" \
                -e "deployment_platform={{ deployment_platform }}" \
                -e "deployment_os={{ deployment_os }}"
              
              Documentation:
              - Scenario Details:  docs/deployment/OVERVIEW.md
              - Platform Guide:    docs/deployment/{{ deployment_platform | upper }}.md
              - Quick Reference:   docs/reference/QUICK_REFERENCE.md
              
              ╔════════════════════════════════════════════════════════════════════════════════╗
      
      tags: ["step5", "instructions"]
    
    # Save configuration to file for future reference
    - name: "Save Configuration to File"
      ansible.builtin.copy:
        content: |
          # RHIS Deployment Configuration
          # Generated: {{ ansible_date_time.iso8601 }}
          
          deployment_scenario: {{ deployment_scenario }}
          deployment_platform: {{ deployment_platform }}
          deployment_os: {{ deployment_os }}
          
          # Scenario Details
          scenario_name: {{ scenario_details.name }}
          scenario_components: {{ scenario_details.components | to_nice_yaml }}
          scenario_tags: {{ scenario_details.tags | to_nice_yaml }}
          
          # Platform Details
          platform_name: {{ platform_details.name }}
          platform_requires: {{ platform_details.requires | to_nice_yaml }}
          
          # OS Details
          os_name: {{ os_details.name }}
          os_version: {{ os_details.version }}
          
          # Command to execute deployment
          deployment_command: |
            ansible-playbook redhat_management-site.yml \
              --tags "{{ (scenario_details.tags + platform_details.tags + os_details.tags) | join(',') }}" \
              -e "deployment_scenario={{ deployment_scenario }}" \
              -e "deployment_platform={{ deployment_platform }}" \
              -e "deployment_os={{ deployment_os }}"
        dest: "{{ ansible_user_dir }}/.ansible/conf/deployment_config.yml"
        mode: '0600'
      tags: ["always"]
  
  # Handlers for reusable messaging
  handlers:
    - name: "show_success"
      ansible.builtin.debug:
        msg: "✓ Configuration completed successfully"
    
    - name: "show_error"
      ansible.builtin.debug:
        msg: "✗ Configuration encountered an error"

