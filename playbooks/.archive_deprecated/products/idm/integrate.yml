---
# Identity Management Integration Playbook
# Integrates IdM with other RHIS components

- name: "Identity Management | Integration"
  hosts: "idm"
  gather_facts: yes

  tasks:
    - name: "IdM | Configure AAP integration"
      ansible.builtin.include_tasks: "integrate_aap.yml"
      when: "'aap' in groups"
      tags: ["integration", "aap"]

    - name: "IdM | Configure Satellite integration"
      ansible.builtin.include_tasks: "integrate_satellite.yml"
      when: "'satellite' in groups"
      tags: ["integration", "satellite"]

    - name: "IdM | Configure OpenShift integration"
      ansible.builtin.include_tasks: "integrate_openshift.yml"
      when: "'openshift' in groups"
      tags: ["integration", "openshift"]

    - name: "IdM | Integration complete"
      ansible.builtin.debug:
        msg: "IdM integration tasks completed"
