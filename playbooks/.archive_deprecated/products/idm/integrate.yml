---
# Identity Management Integration Playbook
# Integrates IdM with other RHIS components

- name: "Identity Management | Integration"
  hosts: "idm"
  gather_facts: yes

  tasks:
    - name: "IdM | Configure AAP integration_generic"
      ansible.builtin.include_tasks: "integrate_aap.yml"
      when: "'aap' in groups"
      tags: ["integration_generic", "aap"]

    - name: "IdM | Configure Satellite integration_generic"
      ansible.builtin.include_tasks: "integrate_satellite.yml"
      when: "'scenario_satellite' in groups"
      tags: ["integration_generic", "scenario_satellite"]

    - name: "IdM | Configure OpenShift integration_generic"
      ansible.builtin.include_tasks: "integrate_openshift.yml"
      when: "'scenario_openshift' in groups"
      tags: ["integration_generic", "scenario_openshift"]

    - name: "IdM | Integration complete"
      ansible.builtin.debug:
        msg: "IdM integration_generic tasks completed"
