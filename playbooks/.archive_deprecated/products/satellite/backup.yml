---
# Satellite 6.18 Backup Playbook
# Creates backup of Satellite configuration, content, and database

- name: "Satellite 6.18 | Backup"
  hosts: "satellite"
  gather_facts: yes
  vars:
    backup_dir: "/var/backups/satellite"
    backup_retention_days: 7

  tasks:
    - name: "Satellite | Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: "directory"
        mode: "0700"
      tags: ["backup"]

    - name: "Satellite | Check satellite-backup exists"
      ansible.builtin.command: "which satellite-backup"
      register: satellite_backup_cmd
      ignore_errors: yes
      tags: ["backup"]

    - name: "Satellite | Run satellite-backup"
      ansible.builtin.command: |
        satellite-backup --disable-counts
        {{ backup_dir }}/satellite-backup_{{ ansible_date_time.date }}
      async: 3600
      poll: 30
      when: satellite_backup_cmd is succeeded
      tags: ["backup"]

    - name: "Satellite | Backup complete"
      ansible.builtin.debug:
        msg: "Satellite backup created: {{ backup_dir }}"
