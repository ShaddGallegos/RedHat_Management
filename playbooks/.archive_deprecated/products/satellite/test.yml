---
# Satellite 6.18 Test Playbook
# Validates Satellite installation and functionality

- name: "Satellite 6.18 | Testing"
  hosts: "scenario_satellite"
  gather_facts: yes

  tasks:
    - name: "Satellite | Check web UI"
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}/web/"
        validate_certs: no
      register: web_ui
      tags: ["test", "web"]

    - name: "Satellite | Check Foreman API"
      ansible.builtin.uri:
        url: "https://{{ inventory_hostname }}/api/v2/hosts"
        validate_certs: no
        user: "admin"
        password: "{{ satellite_admin_password | default('changeme') }}"
        force_basic_auth: yes
      register: foreman_api
      tags: ["test", "api"]
      ignore_errors: yes

    - name: "Satellite | Check services"
      service_facts:
      register: services
      tags: ["test", "services"]

    - name: "Satellite | Verify required services"
      ansible.builtin.assert:
        that:
          - "'foreman' in services.ansible_facts.services"
          - "'postgresql' in services.ansible_facts.services"
        fail_msg: "Required Satellite services not running"
      tags: ["test", "services"]

    - name: "Satellite | Test results"
      ansible.builtin.debug:
        msg: |
          Satellite 6.18 Test Summary
          ============================
          Web UI Status: {{ web_ui.status }}
          API Status: {{ foreman_api.status | default('skipped') }}
          All tests completed
