- name: Configure AAP 2.6 to Sync with Satellite 6.18 SOE
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ~/.ansible/conf/test-env.yml

  tasks:
    - name: Create Satellite Credential in AAP
      ansible.controller.credential:
        name: "Satellite_SOE_Credential"
        description: "Credential for Satellite 6.18 Inventory Sync"
        organization: "{{ foreman_initial_organization | default('RedHat') }}"
        credential_type: "Red Hat Satellite 6"
        inputs:
          host: "https://{{ satellite.satellite_hostname }}"
          username: "{{ satellite.satellite_admin_username }}"
          password: "{{ satellite.satellite_admin_password }}"
        state: present
        controller_host: "https://{{ satellite.satellite_hostname }}:443" # Adjust if AAP is on different host
        controller_username: "admin"
        controller_password: "{{ satellite.satellite_admin_password }}"
        validate_certs: false

    - name: Create SOE Inventory Container
      ansible.controller.inventory:
        name: "SOE_Satellite_Inventory"
        description: "Dynamic inventory synced from Satellite"
        organization: "{{ foreman_initial_organization | default('RedHat') }}"
        state: present

    - name: Configure Satellite Inventory Source
      ansible.controller.inventory_source:
        name: "Satellite_Sync_Source"
        description: "Pulls hosts from Satellite Hostgroups"
        inventory: "SOE_Satellite_Inventory"
        source: "satellite6"
        credential: "Satellite_SOE_Credential"
        overwrite: true
        overwrite_vars: true
        update_on_launch: true
        source_vars:
          use_hostgroups: true
          validate_certs: false
        state: present

    - name: Trigger Initial Inventory Sync
      ansible.controller.inventory_source_update:
        inventory_source: "Satellite_Sync_Source"
        inventory: "SOE_Satellite_Inventory"
        wait: true
