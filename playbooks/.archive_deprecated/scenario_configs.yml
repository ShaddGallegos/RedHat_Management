---
# Scenario Configurations for RHIS Deployment
# Defines product combinations and tags for all 15 deployment scenarios

# Single Product Scenarios
satellite_only:
  name: "Satellite Only"
  description: "Red Hat Satellite 6.18 for systems management and provisioning"
  products: ["satellite"]
  tags: ["satellite", "single-product"]
  min_resources:
    cpu: 8
    memory: 32
    disk: 500
  rhel_versions: ["rhel-9", "rhel-10"]

aap_only:
  name: "AAP Only"
  description: "Ansible Automation Platform 2.6 for automation and orchestration"
  products: ["aap"]
  tags: ["aap", "single-product"]
  min_resources:
    cpu: 8
    memory: 16
    disk: 100
  rhel_versions: ["rhel-9", "rhel-10"]

idm_only:
  name: "IdM Only"
  description: "Red Hat Identity Management 3.0 for identity and access management"
  products: ["idm"]
  tags: ["idm", "single-product"]
  min_resources:
    cpu: 4
    memory: 8
    disk: 50
  rhel_versions: ["rhel-9", "rhel-10"]

openshift_only:
  name: "OpenShift Only"
  description: "OpenShift 4.21+ for container orchestration"
  products: ["openshift"]
  tags: ["openshift", "single-product"]
  min_resources:
    cpu: 16
    memory: 64
    disk: 300
  rhel_versions: ["rhel-9", "rhel-10"]

# Dual Product Scenarios
satellite_aap:
  name: "Satellite + AAP"
  description: "Inventory management with automation platform"
  products: ["satellite", "aap"]
  integrations: ["satellite_aap"]
  tags: ["satellite", "aap", "multi-product", "integration"]
  min_resources:
    cpu: 16
    memory: 48
    disk: 600
  rhel_versions: ["rhel-9", "rhel-10"]

satellite_idm:
  name: "Satellite + IdM"
  description: "Inventory management with centralized identity"
  products: ["satellite", "idm"]
  integrations: ["satellite_idm"]
  tags: ["satellite", "idm", "multi-product", "integration"]
  min_resources:
    cpu: 12
    memory: 40
    disk: 550
  rhel_versions: ["rhel-9", "rhel-10"]

satellite_openshift:
  name: "Satellite + OpenShift"
  description: "Inventory management with container platform"
  products: ["satellite", "openshift"]
  integrations: ["satellite_openshift"]
  tags: ["satellite", "openshift", "multi-product", "integration"]
  min_resources:
    cpu: 24
    memory: 96
    disk: 800
  rhel_versions: ["rhel-9", "rhel-10"]

aap_idm:
  name: "AAP + IdM"
  description: "Automation platform with centralized identity"
  products: ["aap", "idm"]
  integrations: ["aap_idm"]
  tags: ["aap", "idm", "multi-product", "integration"]
  min_resources:
    cpu: 12
    memory: 24
    disk: 150
  rhel_versions: ["rhel-9", "rhel-10"]

aap_openshift:
  name: "AAP + OpenShift"
  description: "Automation platform with container orchestration"
  products: ["aap", "openshift"]
  integrations: ["aap_openshift"]
  tags: ["aap", "openshift", "multi-product", "integration"]
  min_resources:
    cpu: 24
    memory: 80
    disk: 400
  rhel_versions: ["rhel-9", "rhel-10"]

idm_openshift:
  name: "IdM + OpenShift"
  description: "Centralized identity with container platform"
  products: ["idm", "openshift"]
  integrations: ["idm_openshift"]
  tags: ["idm", "openshift", "multi-product", "integration"]
  min_resources:
    cpu: 20
    memory: 72
    disk: 350
  rhel_versions: ["rhel-9", "rhel-10"]

# Triple Product Scenarios
satellite_aap_idm:
  name: "Satellite + AAP + IdM"
  description: "Complete management stack with inventory, automation, and identity"
  products: ["satellite", "aap", "idm"]
  integrations: ["satellite_aap", "satellite_idm", "aap_idm"]
  tags: ["satellite", "aap", "idm", "multi-product", "integration", "management_stack"]
  min_resources:
    cpu: 20
    memory: 56
    disk: 650
  rhel_versions: ["rhel-9", "rhel-10"]

satellite_aap_openshift:
  name: "Satellite + AAP + OpenShift"
  description: "Inventory, automation, and container platform"
  products: ["satellite", "aap", "openshift"]
  integrations: ["satellite_aap", "satellite_openshift", "aap_openshift"]
  tags: ["satellite", "aap", "openshift", "multi-product", "integration"]
  min_resources:
    cpu: 32
    memory: 112
    disk: 900
  rhel_versions: ["rhel-9", "rhel-10"]

satellite_idm_openshift:
  name: "Satellite + IdM + OpenShift"
  description: "Inventory, identity, and container platform"
  products: ["satellite", "idm", "openshift"]
  integrations: ["satellite_idm", "satellite_openshift", "idm_openshift"]
  tags: ["satellite", "idm", "openshift", "multi-product", "integration"]
  min_resources:
    cpu: 28
    memory: 104
    disk: 850
  rhel_versions: ["rhel-9", "rhel-10"]

aap_idm_openshift:
  name: "AAP + IdM + OpenShift"
  description: "Automation, identity, and container platform"
  products: ["aap", "idm", "openshift"]
  integrations: ["aap_idm", "aap_openshift", "idm_openshift"]
  tags: ["aap", "idm", "openshift", "multi-product", "integration"]
  min_resources:
    cpu: 28
    memory: 88
    disk: 450
  rhel_versions: ["rhel-9", "rhel-10"]

# Full Stack (Default)
full_stack:
  name: "FULL STACK"
  description: "All products integrated - Satellite + AAP + IdM + OpenShift"
  products: ["satellite", "aap", "idm", "openshift"]
  integrations: ["satellite_aap", "satellite_idm", "satellite_openshift", "aap_idm", "aap_openshift", "idm_openshift"]
  tags: ["satellite", "aap", "idm", "openshift", "full-stack", "integration", "cmdb"]
  min_resources:
    cpu: 40
    memory: 120
    disk: 1000
  rhel_versions: ["rhel-9", "rhel-10"]
  features:
    - "unified_authentication"
    - "centralized_inventory"
    - "complete_automation"
    - "container_management"
    - "infrastructure_visibility"
  repositories:
    enable:
      - "rhel-server-rhscl"
      - "satellite-tools"
      - "rhel-server-optional"
      - "rhel-fast-datapath"
    optional:
      - "rhel-server-devtools"
      - "rhel-server-debug"

# Platform configurations
libvirt_config:
  name: "LibVirt (KVM)"
  description: "Local KVM virtualization for development and testing"
  provisioning_type: "local"
  networking: "libvirt-network"
  storage: "local-disk"
  features:
    - "fast_provisioning"
    - "local_storage"
    - "network_isolation"
  requirements:
    - "libvirt-daemon"
    - "qemu-kvm"
    - "virt-manager"
  tags: ["libvirt", "local", "development"]

baremetal_config:
  name: "Bare Metal"
  description: "Physical servers with PXE and DHCP provisioning"
  provisioning_type: "pxe"
  networking: "physical-network"
  storage: "direct-attached"
  features:
    - "bare_metal"
    - "high_performance"
    - "direct_storage"
  requirements:
    - "dhcp-server"
    - "tftp-server"
    - "pxe-bootloader"
  tags: ["baremetal", "enterprise", "production"]

aws_config:
  name: "Amazon Web Services"
  description: "AWS EC2 instances with auto-scaling"
  provisioning_type: "cloud_api"
  networking: "vpc"
  storage: "ebs"
  features:
    - "auto_scaling"
    - "elastic_ips"
    - "security_groups"
    - "cloud_monitoring"
  requirements:
    - "aws-cli"
    - "boto3"
    - "aws_credentials"
  tags: ["aws", "cloud", "production"]

azure_config:
  name: "Microsoft Azure"
  description: "Azure VMs with managed disks"
  provisioning_type: "cloud_api"
  networking: "vnet"
  storage: "managed-disk"
  features:
    - "load_balancing"
    - "availability_sets"
    - "network_security_groups"
    - "azure_monitor"
  requirements:
    - "azure-cli"
    - "azure-sdk"
    - "azure_credentials"
  tags: ["azure", "cloud", "production"]

gcp_config:
  name: "Google Cloud Platform"
  description: "GCP Compute Engine instances"
  provisioning_type: "cloud_api"
  networking: "vpc"
  storage: "persistent-disk"
  features:
    - "load_balancing"
    - "instance_groups"
    - "firewall_rules"
    - "cloud_monitoring"
  requirements:
    - "gcloud"
    - "google-cloud-sdk"
    - "gcp_credentials"
  tags: ["gcp", "cloud", "production"]

vmware_config:
  name: "VMware vSphere"
  description: "VMware VMs with vSAN storage"
  provisioning_type: "cloud_api"
  networking: "vsphere-network"
  storage: "vsan"
  features:
    - "vm_templates"
    - "snapshots"
    - "resource_pools"
    - "vsphere_ha"
  requirements:
    - "pyvmomi"
    - "vmware-credentials"
  tags: ["vmware", "enterprise", "production"]

nutanix_config:
  name: "Nutanix HCI"
  description: "Nutanix hyperconverged infrastructure"
  provisioning_type: "cloud_api"
  networking: "nutanix-network"
  storage: "nutanix-storage"
  features:
    - "vm_templates"
    - "protection_domains"
    - "high_availability"
    - "capacity_planning"
  requirements:
    - "nutanix-sdk"
    - "nutanix-credentials"
  tags: ["nutanix", "enterprise", "production"]
