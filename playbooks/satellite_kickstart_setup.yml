---
# Satellite kickstart repository wrapper playbook
# Delegates kickstart repo creation and sync setup to `satellite_os_configuration` role.

- name: "Satellite kickstart repository setup"
  hosts: satellite
  gather_facts: yes

  roles:
    - role: satellite_os_configuration
      vars:
        satellite_os_config_enabled: true
        create_operatingsystems: false
        create_install_media: false
        create_kickstart_repo: true
        configure_sync_job: true

# End of playbook — role handles repository creation and syncs
