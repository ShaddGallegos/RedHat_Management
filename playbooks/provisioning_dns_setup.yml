---
# DNS Server Only Setup Playbook
# Configures BIND DNS service on secondary ethernet for 10.168.0.0/16

- name: Configure DNS Server
  hosts: scenario_satellite
  gather_facts: true
  become: true
  
  vars:
    provisioning_secondary_interface: "eth1"
    provisioning_interface_ip: "10.168.0.1"
    setup_dns_only: true
  
  roles:
    - role: platform_services_provisioning_stack
      tags: dns

  post_tasks:
    - name: Verify DNS configuration
      block:
        - name: Check DNS service status
          systemd:
            name: named
            state: started
          register: dns_status

        - name: Validate BIND configuration
          command: named-checkconf /etc/named.conf
          changed_when: false

        - name: Show DNS status
          debug:
            msg: |
              DNS Server Status:
              • Service: {{ dns_status.status.ActiveState }}
              • Resolver IP: 10.168.0.1:53
              • Zones: example.com, prod.example.com
              • Options: rotate, timeout:2, attempts:3

    - name: Test DNS resolution
      command: "dig @10.168.0.1 scenario_satellite.prod.spg.example.com"
      register: dns_test
      changed_when: false
      failed_when: dns_test.rc != 0
