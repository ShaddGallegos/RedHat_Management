---
- name: Test Rulebook for Development
- hosts: localhost
 sources:
 - ansible.eda.webhook:
 host: 0.0.0.0
 port: 5000
 
 rules:
- name: Echo all webhook events
 condition: event.payload is defined
 action:
 debug:
 msg: "Received event: {{ event }}"
 
- name: Test high usage threshold
 condition: event.payload.usage_percent is defined and event.payload.usage_percent > 80
 action:
 debug:
 msg: "HIGH USAGE ALERT: {{ event.payload.hostname }} - {{ event.payload.mount_point }} at {{ event.payload.usage_percent }}%"
