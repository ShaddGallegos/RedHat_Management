---
- name: Complete AAP and EDA Setup for LVM Automation
- hosts: localhost
  gather_facts: true
  connection: local

  vars_files:
    - ../vars/master_defaults.yml
    - ../group_vars/all/vault.yml

  roles:
    - role: credential_manager
      tags: ['credentials', 'setup']

    - role: aap_credentials
      tags: ['aap', 'credentials']

    - role: aap_inventory_sources
      tags: ['aap', 'inventory']

    - role: aap_project_setup
      tags: ['aap', 'project']

    - role: eda_configuration
      tags: ['eda', 'setup']

  post_tasks:
- name: Display setup summary
      ansible.builtin.debug:
        msg: |
          ================================
          AAP & EDA Setup Complete!
          ================================

          AAP Controller: {{ aap_controller_host }}
          EDA Controller: {{ eda_controller_host }}

          Created Components:
          [OK] Custom credential types
          [OK] Credentials (ServiceNow, Nutanix, Splunk)
          [OK] Dynamic inventories
          [OK] Project: {{ project_name }}
          [OK] Job templates
          [OK] Workflow template
          [OK] EDA rulebook activation

          Next Steps:
          1. Verify credentials in AAP UI
          2. Sync inventories
          3. Test job templates
          4. Monitor EDA controller

          ================================
