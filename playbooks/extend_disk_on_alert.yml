---
- name: Extend disk on critical usage alert
- hosts: "{{ event.host | default('all') }}"
  become: true
  gather_facts: true

  vars:
    vg_name: "vg_data"
    lv_name: "lv_data"
    disk_img_path: "/var/lib/libvirt/images/extra_disk.img"
    disk_device: "/dev/vdb"  # Adjust as needed for your environment

  tasks:
- name: Gather before report (CPU, memory, disk)
      ansible.builtin.shell: |
        echo "CPU:"; lscpu
        echo "Memory:"; free -h
        echo "Disk:"; df -h
      register: before_report

- name: Show before report
      ansible.builtin.debug:
        var: before_report.stdout

- name: Calculate 20% of total disk space
      ansible.builtin.set_fact:
        extend_size_gb: "{{ (ansible_facts['devices']['sda']['size'] | float * 0.2) | round(0) }}"

- name: Create new disk image for libvirt
      ansible.builtin.shell: |
        dd if=/dev/zero of={{ disk_img_path }} bs=1G count={{ extend_size_gb }}
      args:
        creates: "{{ disk_img_path }}"

- name: Attach new disk to VM
      community.libvirt.libvirt_domain:
- name: "{{ inventory_hostname }}"
        disks:
- name: "{{ disk_img_path | basename }}"
            type: file
            device: disk
            size: "{{ extend_size_gb }}G"
            bus: virtio

- name: Wait for new disk device to appear
      ansible.builtin.wait_for:
        path: "{{ disk_device }}"
        timeout: 60

- name: Create physical volume on new disk
      ansible.builtin.command: pvcreate "{{ disk_device }}"
      register: pvcreate_result
      changed_when: "'successfully created' in pvcreate_result.stdout"

- name: Extend volume group with new PV
      ansible.builtin.command: vgextend "{{ vg_name }}" "{{ disk_device }}"
      register: vgextend_result
      changed_when: "'successfully extended' in vgextend_result.stdout"

- name: Extend logical volume with all available extents
      ansible.builtin.command: lvextend -l +100%FREE "/dev/{{ vg_name }}/{{ lv_name }}"
      register: lvextend_result
      changed_when: "'successfully resized' in lvextend_result.stdout"

- name: Resize filesystem
      ansible.builtin.command: resize2fs "/dev/{{ vg_name }}/{{ lv_name }}"

- name: Tune filesystem after resize
      ansible.builtin.command: tune2fs -l "/dev/{{ vg_name }}/{{ lv_name }}"
      register: tune2fs_result

- name: Show tune2fs output
      ansible.builtin.debug:
        var: tune2fs_result.stdout

- name: Gather after report (CPU, memory, disk)
      ansible.builtin.shell: |
        echo "CPU:"; lscpu
        echo "Memory:"; free -h
        echo "Disk:"; df -h
      register: after_report

- name: Show after report
      ansible.builtin.debug:
        var: after_report.stdout