---
- name: Update ServiceNow Ticket
- hosts: localhost
  gather_facts: false
 connection: local
 
  vars:
    snow_instance: "{{ lookup('env', 'SNOW_INSTANCE') | default('dev12345') }}"
    snow_username: "{{ lookup('env', 'SNOW_USER') | default('admin') }}"
    snow_password: "{{ lookup('env', 'SNOW_PASS') | default('changeme') }}"
 
  tasks:
- name: Update incident with progress
 servicenow.itsm.incident:
 instance:
 host: "{{ snow_instance }}.service-now.com"
 username: "{{ snow_username }}"
 password: "{{ snow_password }}"
 state: "{{ state | default('in_progress') }}"
 number: "{{ snow_ticket_number }}"
 work_notes: "{{ work_notes | default(update_message) }}"
 register: snow_update
 
- name: Display update confirmation
 debug:
 msg: "ServiceNow ticket {{ snow_ticket_number }} updated"
