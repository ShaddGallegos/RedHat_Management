---
- name: Setup Credentials Collection
- hosts: localhost
  gather_facts: false
 
  vars:
    vault_file: "../vault/credentials.yml"
 
  tasks:
- name: Ensure vault directory exists
 file:
 path: "../vault"
 state: directory
 mode: '0755'
 
- name: Display Setup Instructions
 debug:
 msg:
 - "╔═══════════════════════════════════════════════════════╗"
 - "║ Credential Collection Setup ║"
 - "╚═══════════════════════════════════════════════════════╝"
 - ""
 - "This playbook will collect and encrypt credentials for:"
 - " • Machine/SSH access (SSH keys or passwords)"
 - " • ServiceNow ITSM"
 - " • Nutanix Prism Central"
 - " • Ansible Automation Platform"
 - " • Splunk HEC"
 - " • LVM thresholds"
 - ""
 - "All credentials will be encrypted with Ansible Vault."
 - ""
 
- name: Pause for acknowledgment
 pause:
 prompt: "Press Enter to continue or Ctrl+C to cancel"
 
 # ==========================================================================
 # MACHINE CREDENTIALS
 # ==========================================================================
 
- name: Collect Machine Credential Information
 block:
- name: Display Machine Credential Instructions
 debug:
 msg:
 - ""
 - "━━━ Machine/SSH Credentials ━━━"
 - ""
 - "These credentials are used to connect to target Linux servers."
 - "You can use either SSH keys (recommended) or passwords."
 - ""
 
- name: Prompt for SSH username
 pause:
 prompt: "SSH Username [ansible]"
 register: ssh_username_input
 
- name: Set SSH username
 set_fact:
 ssh_username: "{{ ssh_username_input.user_input | default('ansible', true) }}"
 
- name: Choose authentication method
 pause:
 prompt: |
 Authentication method:
 1) SSH Key (recommended)
 2) Password
 Enter choice [1]
 register: auth_method_input
 
- name: Set authentication method
 set_fact:
 auth_method: "{{ auth_method_input.user_input | default('1', true) }}"
 
- name: Collect SSH key information
 block:
- name: Prompt for SSH key path
 pause:
 prompt: "SSH private key path [~/.ssh/id_rsa]"
 register: ssh_key_path_input
 
- name: Set SSH key path
 set_fact:
 ssh_key_path: "{{ ssh_key_path_input.user_input | default('~/.ssh/id_rsa', true) }}"
 
- name: Check if SSH key exists
 stat:
 path: "{{ ssh_key_path | expanduser }}"
 register: ssh_key_stat
 
- name: Display SSH key status
 debug:
 msg: "{{ '[OK] SSH key found' if ssh_key_stat.stat.exists else '[ERROR] SSH key not found - will need to create or specify correct path' }}"
 
- name: Prompt for SSH key passphrase (if encrypted)
 pause:
 prompt: "SSH key passphrase (leave blank if not encrypted)"
 echo: false
 register: ssh_key_unlock_input
 when: ssh_key_stat.stat.exists
 
- name: Set SSH key unlock
 set_fact:
 ssh_key_unlock: "{{ ssh_key_unlock_input.user_input | default('', true) }}"
 when: ssh_key_stat.stat.exists
 when: auth_method == '1'
 
- name: Collect password information
 block:
- name: Prompt for SSH password
 pause:
 prompt: "SSH password"
 echo: false
 register: ssh_password_input
 
- name: Set SSH password
 set_fact:
 ssh_password: "{{ ssh_password_input.user_input }}"
 when: auth_method == '2'
 
- name: Collect privilege escalation settings
 block:
- name: Prompt for become method
 pause:
 prompt: "Privilege escalation method [sudo]"
 register: become_method_input
 
- name: Set become method
 set_fact:
 become_method: "{{ become_method_input.user_input | default('sudo', true) }}"
 
- name: Prompt for become username
 pause:
 prompt: "Become username [root]"
 register: become_username_input
 
- name: Set become username
 set_fact:
 become_username: "{{ become_username_input.user_input | default('root', true) }}"
 
- name: Prompt for become password
 pause:
 prompt: "Become password (leave blank if not required or same as SSH password)"
 echo: false
 register: become_password_input
 
- name: Set become password
 set_fact:
 become_password: "{{ become_password_input.user_input | default('', true) }}"
 
 # ==========================================================================
 # SERVICENOW CREDENTIALS
 # ==========================================================================
 
- name: Collect ServiceNow Credentials
 block:
- name: Display ServiceNow Instructions
 debug:
 msg:
 - ""
 - "━━━ ServiceNow Configuration ━━━"
 - ""
 - "ServiceNow integration is used for:"
 - " • Creating incident tickets"
 - " • Dynamic inventory from CMDB"
 - " • Ticket status updates"
 - ""
 
- name: Prompt for ServiceNow instance
 pause:
 prompt: "ServiceNow instance (e.g., dev12345) [skip to omit ServiceNow]"
 register: snow_instance_input
 
- name: Collect ServiceNow credentials
 block:
- name: Prompt for ServiceNow username
 pause:
 prompt: "ServiceNow username"
 register: snow_username_input
 
- name: Prompt for ServiceNow password
 pause:
 prompt: "ServiceNow password"
 echo: false
 register: snow_password_input
 
- name: Set ServiceNow credentials
 set_fact:
 servicenow:
 instance: "{{ snow_instance_input.user_input }}"
 username: "{{ snow_username_input.user_input }}"
 password: "{{ snow_password_input.user_input }}"
 when: snow_instance_input.user_input | length > 0
 
 # ==========================================================================
 # NUTANIX CREDENTIALS
 # ==========================================================================
 
- name: Collect Nutanix Credentials
 block:
- name: Display Nutanix Instructions
 debug:
 msg:
 - ""
 - "━━━ Nutanix Prism Central Configuration ━━━"
 - ""
 - "Nutanix integration is used for:"
 - " • VM discovery (dynamic inventory)"
 - " • Disk provisioning"
 - " • VM information gathering"
 - ""
 
- name: Prompt for Nutanix host
 pause:
 prompt: "Nutanix Prism Central host/IP [skip to omit Nutanix]"
 register: nutanix_host_input
 
- name: Collect Nutanix credentials
 block:
- name: Prompt for Nutanix port
 pause:
 prompt: "Nutanix port [9440]"
 register: nutanix_port_input
 
- name: Prompt for Nutanix username
 pause:
 prompt: "Nutanix username"
 register: nutanix_username_input
 
- name: Prompt for Nutanix password
 pause:
 prompt: "Nutanix password"
 echo: false
 register: nutanix_password_input
 
- name: Set Nutanix credentials
 set_fact:
 nutanix:
 host: "{{ nutanix_host_input.user_input }}"
 port: "{{ nutanix_port_input.user_input | default('9440', true) }}"
 username: "{{ nutanix_username_input.user_input }}"
 password: "{{ nutanix_password_input.user_input }}"
 when: nutanix_host_input.user_input | length > 0
 
 # ==========================================================================
 # AAP CREDENTIALS
 # ==========================================================================
 
- name: Collect AAP Credentials
 block:
- name: Display AAP Instructions
 debug:
 msg:
 - ""
 - "━━━ Ansible Automation Platform Configuration ━━━"
 - ""
 - "AAP credentials are used for:"
 - " • Configuring AAP via API"
 - " • Creating job templates"
 - " • Managing workflows"
 - ""
 
- name: Prompt for AAP Controller URL
 pause:
 prompt: "AAP Controller URL (e.g., https://aap.example.com)"
 register: aap_url_input
 
- name: Prompt for AAP username
 pause:
 prompt: "AAP username [admin]"
 register: aap_username_input
 
- name: Prompt for AAP password
 pause:
 prompt: "AAP password"
 echo: false
 register: aap_password_input
 
- name: Prompt for EDA enabled
 pause:
 prompt: "Enable Event-Driven Ansible? (yes/no) [yes]"
 register: aap_eda_input
 
- name: Set AAP credentials
 set_fact:
 aap:
 controller_url: "{{ aap_url_input.user_input }}"
 username: "{{ aap_username_input.user_input | default('admin', true) }}"
 password: "{{ aap_password_input.user_input }}"
 eda_enabled: "{{ (aap_eda_input.user_input | default('yes', true) | lower) in ['yes', 'y', 'true'] }}"
 
 # ==========================================================================
 # SPLUNK CREDENTIALS
 # ==========================================================================
 
- name: Collect Splunk Credentials
 block:
- name: Display Splunk Instructions
 debug:
 msg:
 - ""
 - "━━━ Splunk HEC Configuration ━━━"
 - ""
 - "Splunk integration is used for:"
 - " • Receiving disk usage alerts"
 - " • Event-driven automation triggers"
 - " • Log aggregation"
 - ""
 
- name: Prompt for Splunk HEC URL
 pause:
 prompt: "Splunk HEC URL (e.g., https://splunk.example.com:8088) [skip to omit Splunk]"
 register: splunk_url_input
 
- name: Collect Splunk credentials
 block:
- name: Prompt for Splunk HEC token
 pause:
 prompt: "Splunk HEC token"
 echo: false
 register: splunk_token_input
 
- name: Set Splunk credentials
 set_fact:
 splunk:
 url: "{{ splunk_url_input.user_input }}"
 token: "{{ splunk_token_input.user_input }}"
 when: splunk_url_input.user_input | length > 0
 
 # ==========================================================================
 # GITHUB CREDENTIALS (optional)
 # ==========================================================================
 
- name: Collect GitHub Credentials
 block:
- name: Display GitHub Instructions
 debug:
 msg:
 - ""
 - "━━━ GitHub Configuration (Optional) ━━━"
 - ""
 - "GitHub integration is used for:"
 - " • Private repository access"
 - " • SCM project sync in AAP"
 - ""
 
- name: Prompt for GitHub username
 pause:
 prompt: "GitHub username [skip to omit GitHub]"
 register: github_username_input
 
- name: Collect GitHub credentials
 block:
- name: Prompt for GitHub token
 pause:
 prompt: "GitHub Personal Access Token (with repo scope)"
 echo: false
 register: github_token_input
 
- name: Set GitHub credentials
 set_fact:
 github:
 username: "{{ github_username_input.user_input }}"
 token: "{{ github_token_input.user_input }}"
 when: github_username_input.user_input | length > 0
 
 # ==========================================================================
 # LVM THRESHOLDS
 # ==========================================================================
 
- name: Collect LVM Thresholds
 block:
- name: Display LVM Threshold Instructions
 debug:
 msg:
 - ""
 - "━━━ LVM Threshold Configuration ━━━"
 - ""
 - "Configure disk usage thresholds and extension settings."
 - ""
 
- name: Prompt for threshold percentage
 pause:
 prompt: "Warning threshold percentage [80]"
 register: threshold_input
 
- name: Prompt for critical threshold
 pause:
 prompt: "Critical threshold percentage [90]"
 register: critical_input
 
- name: Prompt for extension percentage
 pause:
 prompt: "Extension percentage (how much to extend) [20]"
 register: extend_input
 
- name: Prompt for minimum extension size
 pause:
 prompt: "Minimum extension size in GB [10]"
 register: min_extend_input
 
- name: Prompt for maximum extension size
 pause:
 prompt: "Maximum extension size in GB [100]"
 register: max_extend_input
 
- name: Set LVM thresholds
 set_fact:
 lvm:
 threshold_percent: "{{ threshold_input.user_input | default('80', true) | int }}"
 critical_threshold: "{{ critical_input.user_input | default('90', true) | int }}"
 extend_percent: "{{ extend_input.user_input | default('20', true) | int }}"
 min_extend_gb: "{{ min_extend_input.user_input | default('10', true) | int }}"
 max_extend_gb: "{{ max_extend_input.user_input | default('100', true) | int }}"
 
 # ==========================================================================
 # SAVE CREDENTIALS
 # ==========================================================================
 
- name: Build credentials structure
 set_fact:
 credentials_data:
 machine_credentials:
 ssh_username: "{{ ssh_username }}"
 ssh_key_path: "{{ ssh_key_path | default('') }}"
 ssh_key_unlock: "{{ ssh_key_unlock | default('') }}"
 ssh_password: "{{ ssh_password | default('') }}"
 become_method: "{{ become_method }}"
 become_username: "{{ become_username }}"
 become_password: "{{ become_password }}"
 servicenow: "{{ servicenow | default({}) }}"
 nutanix: "{{ nutanix | default({}) }}"
 aap: "{{ aap }}"
 splunk: "{{ splunk | default({}) }}"
 github: "{{ github | default({}) }}"
 lvm: "{{ lvm }}"
 
- name: Save credentials to vault file
 copy:
 content: "{{ credentials_data | to_nice_yaml }}"
 dest: "{{ vault_file }}"
 mode: '0600'
 
- name: Encrypt vault file
 command: "ansible-vault encrypt {{ vault_file }}"
 args:
 creates: "{{ vault_file }}"
 when: false # Will be encrypted by --ask-vault-pass on run
 
- name: Display completion message
 debug:
 msg:
 - ""
 - "╔═══════════════════════════════════════════════════════╗"
 - "║ Credentials Collection Complete ║"
 - "╚═══════════════════════════════════════════════════════╝"
 - ""
 - "Credentials saved to: {{ vault_file }}"
 - ""
 - "Machine Credentials:"
 - " Username: {{ ssh_username }}"
 - " {{ 'Auth: SSH Key (' + ssh_key_path + ')' if auth_method == '1' else 'Auth: Password' }}"
 - " Become: {{ become_method }} ({{ become_username }})"
 - ""
 - "{{ 'ServiceNow: [OK] Configured' if servicenow is defined else 'ServiceNow: [ERROR] Not configured' }}"
 - "{{ 'Nutanix: [OK] Configured' if nutanix is defined else 'Nutanix: [ERROR] Not configured' }}"
 - "AAP: [OK] Configured"
 - "{{ 'Splunk: [OK] Configured' if splunk is defined else 'Splunk: [ERROR] Not configured' }}"
 - "{{ 'GitHub: [OK] Configured' if github is defined else 'GitHub: [ERROR] Not configured' }}"
 - ""
 - "LVM Thresholds:"
 - " Warning: {{ lvm.threshold_percent }}%"
 - " Critical: {{ lvm.critical_threshold }}%"
 - " Extension: {{ lvm.extend_percent }}%"
 - ""
 - "[WARNING] IMPORTANT: Keep your vault password secure!"
 - ""
 - "Next steps:"
 - " 1. Save your vault password to.vault_pass (chmod 600)"
 - " 2. Run: ansible-playbook playbooks/configure_aap.yml --ask-vault-pass"
 - ""
