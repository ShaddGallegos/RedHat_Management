---
# extend_lvm.yml - Main entry point for LVM extension logic
---
- name: LVM Auto Extension for Nutanix-hosted RHEL Systems
- hosts: all
  gather_facts: true
  become: true
 
  vars:
    extend_percent: "{{ extend_percent | default(20) }}"
    disk_usage_threshold: "{{ disk_usage_threshold | default(90) }}"
    notify_email: "{{ admin_email | default('admin@example.com') }}"
 
    pre_tasks:
- name: Verify target is running RHEL 8 or 9
 assert:
 that:
 - ansible_distribution == "RedHat"
 - ansible_distribution_major_version in ["8", "9"]
 fail_msg: "This playbook requires RHEL 8 or 9"
 success_msg: "Valid target system: {{ ansible_distribution }} {{ ansible_distribution_version }}"
 
- name: Verify sudo access
 command: whoami
 changed_when: false
 
- name: Gather mount information
 ansible.builtin.setup:
 gather_subset:
 - mounts
 
  roles:
 - role: lvm_system_inspection
  vars:
    target_vg: "{{ vg_name | default('rhel') }}"
    target_lv: "{{ lv_name | default('root') }}"
    required_growth_percent: "{{ extend_percent }}"
 
 - role: lvm_smart_extend
  vars:
    target_vg: "{{ vg_name | default('rhel') }}"
    target_lv: "{{ lv_name | default('root') }}"
    target_mount: "{{ mount_point | default('/') }}"
    required_growth_percent: "{{ extend_percent }}"
    when: sufficient_space is defined and sufficient_space | bool
 
  tasks:
- name: Create Nutanix disk if insufficient space
 block:
- name: Set API parameters
 set_fact:
 api_endpoint: "https://{{ nutanix_host }}/api/nutanix/v3"
 vm_uuid: ""
 disk_size_bytes: "{{ (vg_size_gb | default(20) | int * 1073741824 * 0.2) | int }}"
 
- name: Get VM UUID from Prism Central
 uri:
 url: "{{ api_endpoint }}/vms/list"
 method: POST
 body_format: json
 body:
 kind: vm
 filter: "vm_name=={{ vm_name }}"
 status_code: 200
 validate_certs: false
 headers:
 Content-Type: "application/json"
 Accept: "application/json"
 url_username: "{{ nutanix_username }}"
 url_password: "{{ nutanix_password }}"
 register: vm_search_results
 delegate_to: localhost
 when: not sufficient_space
 
- name: Extract VM UUID
 set_fact:
 vm_uuid: "{{ vm_search_results.json.entities[0].metadata.uuid }}"
 when: 
 - not sufficient_space
 - vm_search_results.json.entities | length > 0
 
- name: Create disk for VM
 uri:
 url: "{{ api_endpoint }}/vms/{{ vm_uuid }}/disks"
 method: POST
 body_format: json
 body:
 disk_address:
 device_index: -1
 adapter_type: "SCSI"
 disk_size_bytes: "{{ disk_size_bytes }}"
 status_code: 202
 validate_certs: false
 headers:
 Content-Type: "application/json"
 Accept: "application/json"
 url_username: "{{ nutanix_username }}"
 url_password: "{{ nutanix_password }}"
 register: disk_create_results
 delegate_to: localhost
 when:
 - not sufficient_space
 - vm_uuid!= ""
 
- name: Wait for new disk to become available
 pause:
 seconds: 20
 when:
 - not sufficient_space
 - vm_uuid!= ""
 - disk_create_results is defined
 - disk_create_results.status == 202
 
- name: Scan for new SCSI devices
 command: rescan-scsi-bus.sh
 changed_when: true
 when:
 - not sufficient_space
 - vm_uuid!= ""
 - disk_create_results is defined
 - disk_create_results.status == 202
 
- name: Find new disk
 shell: lsblk -d -n -p -o NAME | grep -v "$(pvs --noheadings -o pv_name)" | grep -v '/dev/sr' | sort | tail -1
 register: new_disk
 changed_when: false
 when:
 - not sufficient_space
 - vm_uuid!= ""
 - disk_create_results is defined
 
- name: Create physical volume
 command: "pvcreate {{ new_disk.stdout }}"
 when: 
 - not sufficient_space
 - vm_uuid!= ""
 - new_disk is defined 
 - new_disk.stdout!= ""
 
- name: Extend volume group
 command: "vgextend {{ target_vg }} {{ new_disk.stdout }}"
 when:
 - not sufficient_space
 - vm_uuid!= ""
 - new_disk is defined
 - new_disk.stdout!= ""
 
- name: Extend logical volume
 command: "lvextend -l +{{ extend_percent }}%FREE /dev/{{ target_vg }}/{{ target_lv }}"
 when:
 - not sufficient_space
 - vm_uuid!= ""
 - new_disk is defined
 - new_disk.stdout!= ""
 
- name: Resize XFS filesystem
 command: "xfs_growfs {{ target_mount }}"
 when: 
 - not sufficient_space
 - vm_uuid!= ""
 - new_disk is defined
 - new_disk.stdout!= ""
 - ansible_mounts | selectattr('mount', 'equalto', target_mount) | map(attribute='fstype') | list | first == "xfs"
 
- name: Resize EXT4 filesystem
 command: "resize2fs /dev/{{ target_vg }}/{{ target_lv }}"
 when: 
 - not sufficient_space 
 - vm_uuid!= ""
 - new_disk is defined
 - new_disk.stdout!= ""
 - ansible_mounts | selectattr('mount', 'equalto', target_mount) | map(attribute='fstype') | list | first == "ext4"
 
 when: not sufficient_space
 
- name: Send email notification
 mail:
 host: "{{ mail_smtp_host | default('localhost') }}"
 port: "{{ mail_smtp_port | default(25) }}"
 subject: "LVM extension completed on {{ inventory_hostname }}"
 body: |
 LVM extension has been completed on {{ inventory_hostname }}
 
 Volume Group: {{ target_vg }}
 Logical Volume: {{ target_lv }}
 Mount Point: {{ target_mount }}
 
 {% if sufficient_space %}
 Extension performed using existing space in the volume group.
 {% else %}
 New disk added via Nutanix API and integrated with the volume group.
 {% endif %}
 
 Current disk usage: {{ (ansible_mounts | selectattr('mount', 'equalto', target_mount) | map(attribute='size_available') | list | first / ansible_mounts | selectattr('mount', 'equalto', target_mount) | map(attribute='size_total') | list | first * 100) | round(1) }}%
 Total size: {{ (ansible_mounts | selectattr('mount', 'equalto', target_mount) | map(attribute='size_total') | list | first / 1024 / 1024 / 1024) | round(1) }} GB
 Available space: {{ (ansible_mounts | selectattr('mount', 'equalto', target_mount) | map(attribute='size_available') | list | first / 1024 / 1024 / 1024) | round(1) }} GB
 
 This is an automated message from the LVM Auto Extension system.
 to: "{{ notify_email }}"
 delegate_to: localhost
 ignore_errors: true
 