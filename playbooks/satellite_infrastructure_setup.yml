---
# Satellite infrastructure wrapper playbook
# Delegates work to existing roles; keep variables in group_vars.

- name: "Satellite infrastructure setup"
  hosts: satellite
  gather_facts: yes
  vars_files:
    - "group_vars/all.yml"
    - "group_vars/satellite.yml"

  roles:
    - role: satellite_os_configuration
      when: (setup_os | default(true)) or (setup_install_media | default(true)) or (setup_kickstart_repo | default(false)) or (setup_sync_jobs | default(false))
      vars:
        satellite_os_config_enabled: "{{ setup_os | default(true) }}"
        create_operatingsystems: "{{ setup_os | default(true) }}"
        create_install_media: "{{ setup_install_media | default(true) }}"
        create_kickstart_repo: "{{ setup_kickstart_repo | default(false) }}"
        configure_sync_job: "{{ setup_sync_jobs | default(false) }}"

    - role: network_infrastructure_config
      when: (setup_network | default(false))
      vars:
        network_config_enabled: "{{ setup_network | default(false) }}"

# End of playbook — role implementations perform the real work
