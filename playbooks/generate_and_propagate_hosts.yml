---
- name: Generate hosts and inventory from ansible_dev_node_prompts
  hosts: localhost
  connection: local
  gather_facts: no
  vars_prompt:
    - name: scenario
      prompt: "Choose scenario (lab/prod/custom)"
      private: no
    - name: installer
      prompt: "Enter installer host as hostname:ip (this node must be included) (e.g., installer.example.com:10.0.0.5)"
      private: no
    - name: host_list
      prompt: "Enter hosts as hostname:ip:type separated by commas (e.g., sat.example.com:10.0.0.10:scenario_satellite,dhcp1:10.0.0.11:dhcp)"
      private: no
    - name: github_user
      prompt: "(optional) GitHub username for repo operations (leave blank if not needed)"
      private: no
    - name: github_repo
      prompt: "(optional) GitHub repo name (owner/repo) for workflow integration_generic (leave blank if not needed)"
      private: no
    - name: github_pat
      prompt: "(optional) GitHub Personal Access Token (PAT) with 'repo' and 'workflow' scopes (leave blank if not needed)"
      private: yes
  tasks:
    - name: Parse installer into parts
      set_fact:
        installer_parts: "{{ installer.split(':') }}"

    - name: Build installer_entry
      set_fact:
        installer_entry: "{{ {'name': (installer_parts[0])|trim, 'ip': (installer_parts[1])|trim, 'type': 'installer'} }}"

    - name: Build hosts_entries list
      vars:
        parts: "{{ item.split(':') }}"
      set_fact:
        hosts_entries: "{{ hosts_entries | default([]) + [ {'name': (parts[0])|trim, 'ip': (parts[1])|trim, 'type': (parts|length > 2) | ternary((parts[2])|trim, 'unknown') } ] }}"
      loop: "{{ host_list.split(',') }}"

    - name: Show parsed hosts (for verification)
      ansible.builtin.debug:
        var: hosts_entries

    - name: Ensure installer is included in hosts_entries
      set_fact:
        hosts_entries: "{{ (hosts_entries | default([])) + [ installer_entry ] }}"
      when: "(hosts_entries | default([]) | selectattr('name','equalto', installer_entry.name) | list | length) == 0"

    - name: Validate no duplicate hostnames or IPs
      assert:
        that:
          - "(hosts_entries | map(attribute='name') | list | length) == (hosts_entries | map(attribute='name') | list | unique | length)"
          - "(hosts_entries | map(attribute='ip') | list | length) == (hosts_entries | map(attribute='ip') | list | unique | length)"
        fail_msg: "Duplicate hostnames or IP addresses found in host list. Please correct and re-run."

    - name: Validate IPv4 format for all hosts
      vars:
        ipv4_regex: '^(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]?[0-9])){3}$'
      assert:
        that:
          - "item.ip is match(ipv4_regex)"
        fail_msg: "Invalid IPv4 address '{{ item.ip }}' for host '{{ item.name }}'"
      loop: "{{ hosts_entries }}"

    - name: (optional) Reverse-DNS validation per host (run lookup and fail if mismatch)
      ansible.builtin.command: getent hosts {{ item.ip }}
      register: rdns_single
      failed_when: rdns_single.stdout == '' or (item.name not in rdns_single.stdout.split())
      changed_when: false
      loop: "{{ hosts_entries }}"
      loop_control:
        label: "{{ item.name }}"
      when: reverse_dns_check | default(false) | bool

    # NOTE: Do NOT automatically load a user-level ~/.ansible/conf/env.yml here.
    # Values from a personal env.yml must be applied explicitly by the operator
    # (e.g., by setting variables or invoking a helper). Proceed using prompted values.

    - name: Render /etc/hosts template to files/generated_hosts
      ansible.builtin.template:
        src: ../templates/hosts.j2
        dest: ../files/generated_hosts

    - name: Render inventory to inventory/hosts
      ansible.builtin.template:
        src: ../templates/inventory_hosts.j2
        dest: ../inventory/hosts

    - name: Ensure generated_hosts is readable
      ansible.builtin.file:
        path: ../files/generated_hosts
        mode: '0644'

    - name: Set installer and scenario_satellite nameserver variables (controller)
      set_fact:
        installer_ns: "{{ (hosts_entries | selectattr('type','equalto','installer') | map(attribute='ip') | list)[0] | default(installer_entry.ip) }}"
        satellite_ns: "{{ (hosts_entries | selectattr('type','equalto','scenario_satellite') | map(attribute='ip') | list)[0] | default((hosts_entries | selectattr('ip','match','^10\\.168\\.') | map(attribute='ip') | list)[0] | default('')) }}"

    - name: Render resolv.conf on controller for verification
      ansible.builtin.template:
        src: ../templates/resolv.conf.j2
        dest: ../files/generated_resolv.conf
      vars:
        nameservers: "{{ ([installer_ns] + ([satellite_ns] if satellite_ns != '' else [])) | unique }}"

    - name: Render env.conf with GitHub credentials (controller)
      ansible.builtin.template:
        src: ../templates/env.conf.j2
        dest: ../files/env.conf
      vars:
        github_user: "{{ github_user | default('') }}"
        github_repo: "{{ github_repo | default('') }}"
        github_pat: "{{ github_pat | default('') }}"

- name: Propagate hosts and inventory to all machines
  hosts: all
  become: yes
  gather_facts: no
  tasks:
    - name: (controller) Optionally wait until all hosts are reachable (runs on localhost)
      when: wait_until_all | default(false) | bool
      delegate_to: localhost
      block:
        - name: Wait for SSH port on each host
          ansible.builtin.wait_for:
            host: "{{ item.ip }}"
            port: 22
            timeout: "{{ per_host_wait_timeout | default(total_wait_timeout | default(1800)) }}"
          register: wait_host_res
          failed_when: false
          loop: "{{ hosts_entries }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Show reachability report
          ansible.builtin.debug:
            msg: "{{ item.item.name }} ({{ item.item.ip }}) reachable={{ not item.failed }} elapsed={{ item.elapsed | default('n/a') }}"
          loop: "{{ wait_host_res.results }}"

    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: "{{ wait_timeout | default(300) }}"
      register: wait_res
      retries: "{{ wait_retries | default(12) }}"
      delay: "{{ wait_delay | default(10) }}"
      until: wait_res is succeeded
      ignore_errors: yes
      when: propagate | default(true) | bool

    - name: Set installer and scenario_satellite nameserver variables
      set_fact:
        installer_ns: "{{ (hosts_entries | selectattr('type','equalto','installer') | map(attribute='ip') | list)[0] | default(installer_entry.ip) }}"
        satellite_ns: "{{ (hosts_entries | selectattr('type','equalto','scenario_satellite') | map(attribute='ip') | list)[0] | default((hosts_entries | selectattr('ip','match','^10\\.168\\.') | map(attribute='ip') | list)[0] | default('')) }}"

    - name: Render resolv.conf with both nameservers and rotate option
      ansible.builtin.template:
        src: ../templates/resolv.conf.j2
        dest: ../files/generated_resolv.conf
      vars:
        nameservers: "{{ ([installer_ns] + ([satellite_ns] if satellite_ns != '' else [])) | unique }}"

    - name: Copy files to remote machines (hosts, resolv.conf, inventory) honoring dry-run
      block:
        - name: Show files to copy (dry-run)
          ansible.builtin.debug:
            msg: |
              DRY-RUN: would copy these files to {{ inventory_hostname }}:\n  - ../files/generated_hosts -> /etc/hosts\n  - ../files/generated_resolv.conf -> /etc/resolv.conf\n  - ../inventory/hosts -> /etc/ansible_hosts
          when: dry_run | default(false) | bool

        - name: (dry-run) Show diff for /etc/hosts
          ansible.builtin.shell: diff -u - /etc/hosts || true
          register: diff_hosts
          failed_when: false
          changed_when: false
          args:
            stdin: "{{ lookup('file','../files/generated_hosts') }}"
          when: dry_run | default(false) | bool

        - name: Display /etc/hosts diff (dry-run)
          ansible.builtin.debug:
            msg: "{{ diff_hosts.stdout if diff_hosts.stdout != '' else 'No differences for /etc/hosts' }}"
          when: dry_run | default(false) | bool

        - name: (dry-run) Show diff for /etc/resolv.conf
          ansible.builtin.shell: diff -u - /etc/resolv.conf || true
          register: diff_resolv
          failed_when: false
          changed_when: false
          args:
            stdin: "{{ lookup('file','../files/generated_resolv.conf') }}"
          when: dry_run | default(false) | bool

        - name: Display /etc/resolv.conf diff (dry-run)
          ansible.builtin.debug:
            msg: "{{ diff_resolv.stdout if diff_resolv.stdout != '' else 'No differences for /etc/resolv.conf' }}"
          when: dry_run | default(false) | bool

        - name: Copy generated /etc/hosts to remote machine
          ansible.builtin.copy:
            src: ../files/generated_hosts
            dest: /etc/hosts
            owner: root
            group: root
            mode: '0644'
          when: not (dry_run | default(false) | bool)

        - name: Copy generated resolv.conf to remote machine
          ansible.builtin.copy:
            src: ../files/generated_resolv.conf
            dest: /etc/resolv.conf
            owner: root
            group: root
            mode: '0644'
          when: not (dry_run | default(false) | bool)

        - name: Copy inventory hosts to remote machine
          ansible.builtin.copy:
            src: ../inventory/hosts
            dest: /etc/ansible_hosts
            owner: root
            group: root
            mode: '0644'
          when: not (dry_run | default(false) | bool)
      when: propagate | default(true) and wait_res is defined and wait_res is succeeded
