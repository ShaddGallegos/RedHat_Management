---
- name: Create New Disk in Nutanix with ServiceNow Integration
- hosts: localhost
  gather_facts: true
 collections:
 - community.general
 
  vars:
    nutanix_api_version: "v3"
 
  tasks:
- name: Validate required variables
 ansible.builtin.assert:
 that:
 - vm_name is defined
 - new_disk_size_gb is defined
 - nutanix_cluster_ip is defined
 - nutanix_user is defined
 - nutanix_pass is defined
 fail_msg: "Required Nutanix API variables not provided"
 
- name: Update ServiceNow ticket - Starting Nutanix disk creation
 uri:
 url: "https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident"
 method: GET
 user: "{{ servicenow_username }}"
 password: "{{ servicenow_password }}"
 body_format: json
 headers:
 Content-Type: "application/json"
 Accept: "application/json"
 status_code: 200
 validate_certs: false
 query:
 sysparm_query: "number={{ snow_ticket_number }}"
 sysparm_fields: "sys_id,number,state"
 register: ticket_info
 when: snow_ticket_number is defined
 ignore_errors: true
 
- name: Update ServiceNow with disk creation start
 uri:
 url: "https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident/{{ ticket_info.json.result[0].sys_id }}"
 method: PATCH
 user: "{{ servicenow_username }}"
 password: "{{ servicenow_password }}"
 body_format: json
 headers:
 Content-Type: "application/json"
 Accept: "application/json"
 body:
 work_notes: |
 {{ ansible_date_time.iso8601 }} - Starting Nutanix disk creation process
 
 Operation details:
 - VM Name: {{ vm_name }}
 - New Disk Size: {{ new_disk_size_gb }}GB
 - Target VG: {{ vg_name }}
 - Target LV: {{ lv_name }}
 - Mount Point: {{ mount_point }}
 status_code: 200
 validate_certs: false
 when: 
 - snow_ticket_number is defined
 - ticket_info.json.result | length > 0
 ignore_errors: true
 
- name: Get VM UUID from Nutanix Cluster
 uri:
 url: "https://{{ nutanix_cluster_ip }}:9440/api/{{ nutanix_api_version }}/vms/list"
 method: POST
 user: "{{ nutanix_user }}"
 password: "{{ nutanix_pass }}"
 body_format: json
 body:
 kind: vm
 filter: "vm_name=={{ vm_name }}"
 status_code: 200
 validate_certs: false
 headers:
 Content-Type: "application/json"
 Accept: "application/json"
 register: vm_list_result
 failed_when: false
 
- name: Check if VM exists
 ansible.builtin.fail:
 msg: "VM with name {{ vm_name }} not found in Nutanix cluster"
 when: vm_list_result.status!= 200 or vm_list_result.json.entities | length == 0
 
- name: Set VM UUID
 ansible.builtin.set_fact:
 vm_uuid: "{{ vm_list_result.json.entities[0].metadata.uuid }}"
 when: vm_list_result.json.entities | length > 0
 
- name: Get VM details
 uri:
 url: "https://{{ nutanix_cluster_ip }}:9440/api/{{ nutanix_api_version }}/vms/{{ vm_uuid }}"
 method: GET
 user: "{{ nutanix_user }}"
 password: "{{ nutanix_pass }}"
 status_code: 200
 validate_certs: false
 headers:
 Content-Type: "application/json"
 Accept: "application/json"
 register: vm_details
 
- name: Create new disk spec
 ansible.builtin.set_fact:
 disk_spec:
 disk_address:
 device_index: "{{ vm_details.json.spec.resources.disk_list | length }}"
 adapter_type: "SCSI"
 data_source_reference:
 kind: "image"
 disk_size_mib: "{{ new_disk_size_gb | int * 1024 }}"
 
- name: Update VM with new disk
 uri:
 url: "https://{{ nutanix_cluster_ip }}:9440/api/{{ nutanix_api_version }}/vms/{{ vm_uuid }}"
 method: PUT
 user: "{{ nutanix_user }}"
 password: "{{ nutanix_pass }}"
 body_format: json
 body:
 spec:
 resources:
 disk_list: "{{ vm_details.json.spec.resources.disk_list + [disk_spec] }}"
 status_code: 202
 validate_certs: false
 headers:
 Content-Type: "application/json"
 Accept: "application/json"
 register: update_result
 failed_when: update_result.status!= 202
 
- name: Update ServiceNow with disk creation completion
 uri:
 url: "https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident/{{ ticket_info.json.result[0].sys_id }}"
 method: PATCH
 user: "{{ servicenow_username }}"
 password: "{{ servicenow_password }}"
 body_format: json
 headers:
 Content-Type: "application/json"
 Accept: "application/json"
 body:
 work_notes: |
 {{ ansible_date_time.iso8601 }} - Nutanix disk creation completed successfully
 
 Operation details:
 - VM UUID: {{ vm_uuid }}
 - Disk Size: {{ new_disk_size_gb }}GB
 - Disk Index: {{ vm_details.json.spec.resources.disk_list | length }}
 
 Next step: Disk will be integrated into the LVM configuration
 status_code: 200
 validate_certs: false
 when: 
 - snow_ticket_number is defined
 - ticket_info.json.result | length > 0
 - update_result is success
 ignore_errors: true
 
- name: Trigger disk integration webhook
 uri:
 url: "http://localhost:5002/integrate-disk"
 method: POST
 body_format: json
 body:
 action: "integrate_new_disk"
 hostname: "{{ target_hostname }}"
 disk_created: true
 new_disk_size_gb: "{{ new_disk_size_gb }}"
 vg_name: "{{ vg_name }}"
 lv_name: "{{ lv_name }}"
 mount_point: "{{ mount_point }}"
 snow_ticket_number: "{{ snow_ticket_number }}"
 user_email: "{{ user_email | default('user@example.com') }}"
 admin_email: "{{ admin_email | default('admin@example.com') }}"
 operations_email: "{{ operations_email | default('operations@example.com') }}"
 when: update_result is success
 ignore_errors: true
 
- name: Send notification email about disk creation
 community.general.mail:
 to: "{{ item }}"
 subject: "Nutanix Disk Created for {{ vm_name }} - ServiceNow {{ snow_ticket_number | default('N/A') }}"
 body: |
 A new disk has been successfully created in Nutanix for {{ vm_name }}:
 
 Disk Details:
 - Size: {{ new_disk_size_gb }}GB
 - VM UUID: {{ vm_uuid }}
 
 The disk will now be integrated into the LVM configuration.
 ServiceNow ticket: {{ snow_ticket_number | default('Not available') }}
 
 This is an automated notification from the LVM automation system.
 smtp_host: "{{ mail_smtp_host | default('localhost') }}"
 smtp_port: "{{ mail_smtp_port | default(25) }}"
 loop:
 - "{{ user_email | default('user@example.com') }}"
 - "{{ admin_email | default('admin@example.com') }}"
 - "{{ operations_email | default('operations@example.com') }}"
 when: update_result is success
 ignore_errors: true
 
- name: Log completion status
 ansible.builtin.debug:
 msg: "Nutanix disk creation process completed for {{ vm_name }}. Disk will now be integrated."