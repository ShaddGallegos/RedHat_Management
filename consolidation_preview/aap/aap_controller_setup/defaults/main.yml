---
# Default variables for aap_controller role

# Controller connection settings
aap_controller_host: "{{ ansible_host | default('controller.example.com') }}"
aap_controller_username: "{{ aap_admin_user | default('admin') }}"
aap_controller_password: "{{ aap_admin_password | default('') }}"
aap_controller_validate_certs: false

# Manifest settings
aap_manifest_source_path: "/tmp/rhis_aap_manifest.zip"
aap_manifest_force: true

# Authentication settings (can be overridden per deployment)
aap_settings: []
  # Example:
  # - name: "AUTHENTICATION_BACKENDS"
  #   value: "django.contrib.auth.backends.ModelBackend"

# Certificate settings
aap_service_cert_path: ""
aap_service_key_path: ""

# Tag for manifest refresh
rhis_controller_manifest_refresh_tag: "rhis_manifest_refresh"
