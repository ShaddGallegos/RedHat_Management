- name: Ensure sshd_config has required settings
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^{{ item.key }}'
    line: '{{ item.key }} {{ item.value }}'
    state: present
    create: true
    backup: true
  loop:
    - { key: 'StrictHostKeyChecking', value: 'no' }
    - { key: 'PermitRootLogin', value: 'yes' }
    - { key: 'PubkeyAuthentication', value: 'yes' }
    - { key: 'AuthorizedKeysFile', value: '.ssh/authorized_keys' }
    - { key: 'Subsystem', value: 'sftp /usr/libexec/openssh/sftp-server' }
  notify: Restart sshd

- name: Ensure sshd is enabled and running
  ansible.builtin.systemd:
    name: sshd
    state: started
    enabled: true
