---
# OS (Operating System) Role
# Handles OS-specific configuration and setup tasks
# Performs foundational system configuration for deployed hosts

- name: "OPERATING SYSTEM CONFIGURATION - Initialize"
  debug:
    msg: |
      Operating System Configuration
      ================================
      OS: {{ deployment_os | default('rhel-9') }}
      Platform: {{ deployment_platform | default('undefined') }}
      Version: {{ ansible_distribution_version | default('detected at runtime') }}
  tags: ["os", "config"]

- name: "Validate OS selection"
  assert:
    that:
      - deployment_os is defined
      - deployment_os in ["rhel-9", "rhel-10"]
    fail_msg: "Invalid OS '{{ deployment_os }}'. Valid options: rhel-9, rhel-10"
  tags: ["os", "validate"]

- name: "Configure OS base components"
  block:
    - name: "Update system repositories and packages"
      block:
        - name: "Update dnf/yum cache"
          ansible.builtin.package:
            name: "*"
            state: latest
          when: update_system_packages | default(true)

        - name: "Install core system packages"
          ansible.builtin.package:
            name: "{{ os_core_packages | default([]) }}"
            state: present
          when: os_core_packages is defined

      rescue:
        - name: "Package update failed - continuing"
          debug:
            msg: "Package installation encountered issues. Continuing with configuration."

    - name: "Configure system settings"
      debug:
        msg: "OS-specific configuration completed"

  rescue:
    - name: "OS configuration failed"
      fail:
        msg: "Operating system configuration failed. Check logs above for details."
  tags: ["os"]

- name: "OS configuration completed"
  debug:
    msg: "Operating system {{ deployment_os }} configured successfully."
  tags: ["os", "info"]
