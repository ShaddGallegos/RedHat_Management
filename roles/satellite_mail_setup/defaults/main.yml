---
# Default variables for satellite_mail_setup
satellite_mail_targets:
  - satellite
  - aap
  - openshift

satellite_mail_master_vars_dest: ./master_vars.yml
satellite_mail_inventory_dest: ./installer_inventory.yml

# Satellite specifics
satellite_fqdn: satellite.example.com
satellite_org: Default_Org
satellite_location: Default_Location
satellite_admin_user: admin
satellite_admin_password: ''
satellite_mail_relay: ''
satellite_mail_relay_credentials: ''

# Libvirt / VM
libvirt_host: kaso.prod.spg
libvirt_user: root
satellite_vm_name: satellite-poc
satellite_vm_hostname: satellite-poc.example.com
satellite_vm_memory_mb: 16384
satellite_vm_vcpus: 4
satellite_vm_disk_size_gb: 200
satellite_vm_disk_name: satellite-poc.qcow2
satellite_vm_pool: default
satellite_vm_network: default
satellite_vm_root_pubkey: 'ssh-rsa AAAA...rootkey'
satellite_admin_pubkey: 'ssh-rsa AAAA...adminkey'
satellite_root_pubkey: 'ssh-rsa AAAA...rootkey'

satellite_base_packages:
  - vim
  - git
  - firewalld

# Hosts/resolver data
satellite_hosts_entries:
  - { ip: '10.168.151.125', fqdn: 'idm.prod.spg', short: 'idm' }
  - { ip: '10.168.151.127', fqdn: 'satellite.prod.spg', short: 'satellite' }
  - { ip: '10.168.151.126', fqdn: 'ansible.prod.spg', short: 'ansible' }
  - { ip: '10.168.0.1', fqdn: 'kaso.prod.spg', short: 'kaso' }

satellite_nameservers:
  - 192.168.122.1
  - 10.168.0.1
  - 192.168.100.1

satellite_search_domain: prod.spg

# AAP
aap_inventory_path: /tmp/aap_inventory.yml
aap_admin_user: admin
aap_admin_password: ''

# Insights
insights_account: '000000'
insights_username: insights-user
insights_password: ''
