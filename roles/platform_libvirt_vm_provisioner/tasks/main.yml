---
- name: Build vm list in role
  hosts: localhost
  gather_facts: false
  become: false

- name: Check for persistent marker for libvirt VM provisioner
  ansible.builtin.stat:
    path: /var/lib/rhm/platform_libvirt_vm_provisioner_done
  register: vmprov_marker_stat

- name: Set platform_libvirt_vm_provisioner_done fact
  ansible.builtin.set_fact:
    platform_libvirt_vm_provisioner_done: "{{ vmprov_marker_stat.stat.exists | default(false) }}"

- name: Check for survey file on controller
  ansible.builtin.stat:
    path: files/cache/survey.yml
  delegate_to: localhost
  run_once: true
  register: survey_file

- name: Load survey variables from controller when present
  include_vars:
    ansible.builtin.file: files/cache/survey.yml
    name: survey
  when: survey_file.stat.exists
  delegate_to: localhost
  run_once: true

- name: Use surveyed vm_list when available
  ansible.builtin.set_fact:
    vm_list: "{{ hostvars['localhost']['survey']['vm_list'] }}"
  when: survey_file.stat.exists

# Fallback: build vm_list from existing node_* variables when no survey file
- name: Build vm list in role
  ansible.builtin.set_fact:
    vm_list:
      - name: "{{ node_ansibledev_fqdn }}"
        memory: 8192
        vcpus: 4
        disk: /var/lib/libvirt/images/ansibledev.qcow2
        network: default
      - name: "{{ node_satellite_fqdn }}"
        memory: 8192
        vcpus: 4
        disk: /var/lib/libvirt/images/scenario_satellite.qcow2
        network: default
      - name: "{{ node_aap_fqdn }}"
        memory: 4096
        vcpus: 2
        disk: /var/lib/libvirt/images/aap.qcow2
        network: internal
      - name: "{{ node_idm_fqdn }}"
        memory: 4096
        vcpus: 2
        disk: /var/lib/libvirt/images/idm.qcow2
        network: internal
  when: not survey_file.stat.exists

- name: Assign deterministic MAC addresses to VMs when not provided
  ansible.builtin.set_fact:
    vm_list: >-
      {{ (vm_list_updated | default([]))
         + [ item | combine({
           'mac': (item.mac | default(
             '52:54:00:' + (item.name | hash('sha1'))[0:2] + ':' +
             (item.name | hash('sha1'))[2:4] + ':' +
             (item.name | hash('sha1'))[4:6]
           ))
         }) ] }}
  loop: "{{ vm_list }}"
  loop_control:
    loop_var: item

- name: Ensure image directory exists on libvirt host
  ansible.builtin.file:
    path: /var/lib/libvirt/images
    state: directory
    owner: root
    group: root
    mode: '0755'
  delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
  become: true

- name: Provision base images and cloud-init seeds for each VM
  block:
    - name: Ensure local files cache exists
      ansible.builtin.file:
        path: files/cache
        state: directory
        mode: '0755'

    - name: Fetch base image to controller `files/` when provided
      ansible.builtin.get_url:
        url: "{{ (item.base_image_url | default(libvirt_base_image_url | default(''))) }}"
        dest: "files/{{ item.name }}-base.qcow2"
        mode: '0644'
      when: (item.base_image_url is defined and item.base_image_url != '') or (libvirt_base_image_url is defined and libvirt_base_image_url != '')

    - name: Copy base image from controller to libvirt host
      ansible.builtin.copy:
        src: "files/{{ item.name }}-base.qcow2"
        dest: "/var/lib/libvirt/images/{{ item.name }}-base.qcow2"
        mode: '0644'
      when: (item.base_image_url is defined and item.base_image_url != '') or (libvirt_base_image_url is defined and libvirt_base_image_url != '')
      delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
      become: true

    - name: Create VM disk from base (thin clone) if not present on libvirt host
      ansible.builtin.command: >-
        qemu-img create -f qcow2 -b /var/lib/libvirt/images/{{ item.name }}-base.qcow2 {{ item.disk }}
      args:
        creates: "{{ item.disk }}"
      delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
      become: true
      when: (item.base_image_url is defined and item.base_image_url != '') or (libvirt_base_image_url is defined and libvirt_base_image_url != '')
    - name: Ensure local cloud-init cache directory exists
      ansible.builtin.file:
        path: files/cache
        state: directory
        mode: '0755'

    - name: Create cloud-init user-data on controller (prefers SSH key injection)
      ansible.builtin.copy:
        dest: "files/cache/{{ item.name }}-user-data"
        mode: '0600'
        content: |
          #cloud-config
          hostname: {{ item.name }}
          fqdn: {{ item.name }}
          users:
          - name: {{ inventory_admin_user | default('admin') }}
            sudo: ALL=(ALL) NOPASSWD:ALL
            lock_passwd: false
          {% if platform_libvirt_vm_provisioner_ssh_public_key is defined and platform_libvirt_vm_provisioner_ssh_public_key != '' %}
            ssh-authorized-keys:
            - "{{ platform_libvirt_vm_provisioner_ssh_public_key }}"
          {% elif platform_libvirt_vm_provisioner_cloud_init_allow_password_auth | default(false) | bool %}
            plain_text_passwd: "{{ inventory_admin_password | default('changeme') }}"
          {% endif %}
          {% if platform_libvirt_vm_provisioner_cloud_init_allow_password_auth | default(false) | bool %}
          chpasswd:
            list: |
              {{ inventory_admin_user | default('admin') }}:{{ inventory_admin_password | default('changeme') }}
            expire: false
          {% endif %}
          ssh_pwauth: {{ platform_libvirt_vm_provisioner_cloud_init_allow_password_auth | default(false) | ternary('true', 'false') }}

    - name: Create cloud-init meta-data on controller
      ansible.builtin.copy:
        dest: "files/cache/{{ item.name }}-meta-data"
        mode: '0600'
        content: |
          instance-id: {{ item.name }}
          local-hostname: {{ item.name }}

    - name: Copy cloud-init user-data to libvirt host
      ansible.builtin.copy:
        src: "files/cache/{{ item.name }}-user-data"
        dest: "/tmp/{{ item.name }}-user-data"
        mode: '0600'
      delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
      become: true

    - name: Copy cloud-init meta-data to libvirt host
      ansible.builtin.copy:
        src: "files/cache/{{ item.name }}-meta-data"
        dest: "/tmp/{{ item.name }}-meta-data"
        mode: '0600'
      delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
      become: true

    - name: Create cloud-init persistent seed disk for VM (optional)
      block:
        - name: Create seed image file (raw)
          ansible.builtin.command: dd if=/dev/zero of=/var/lib/libvirt/images/{{ item.name }}-seed.img bs=1M count={{ platform_libvirt_vm_provisioner_seed_disk_size_mb | default(64) }}
          args:
            creates: "/var/lib/libvirt/images/{{ item.name }}-seed.img"
          delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
          become: true

        - name: Make ext4 filesystem on seed image
          ansible.builtin.command: mkfs.ext4 -F /var/lib/libvirt/images/{{ item.name }}-seed.img
          delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
          become: true

        - name: Mount seed image on libvirt host
          ansible.builtin.command: >-
            mkdir -p /mnt/{{ item.name }}-seed && mount -o loop /var/lib/libvirt/images/{{ item.name }}-seed.img /mnt/{{ item.name }}-seed
          args:
            warn: false
          delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
          become: true

        - name: Ensure cloud-init path exists on mounted image
          ansible.builtin.file:
            path: "/mnt/{{ item.name }}-seed/openstack/latest"
            state: directory
            mode: '0755'
          delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
          become: true

        - name: Copy user-data into mounted seed image
          ansible.builtin.copy:
            src: "files/cache/{{ item.name }}-user-data"
            dest: "/mnt/{{ item.name }}-seed/openstack/latest/user_data"
            mode: '0600'
          delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
          become: true

        - name: Copy meta-data into mounted seed image
          ansible.builtin.copy:
            src: "files/cache/{{ item.name }}-meta-data"
            dest: "/mnt/{{ item.name }}-seed/openstack/latest/meta_data.json"
            mode: '0600'
          delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
          become: true

        - name: Sync and unmount seed image
          ansible.builtin.command: >-
            sync && umount /mnt/{{ item.name }}-seed && rmdir /mnt/{{ item.name }}-seed
          delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
          become: true
      when: platform_libvirt_vm_provisioner_use_cloud_init_disk | default(false) | bool

    - name: Create cloud-init seed ISO for VM (optional fallback)
      ansible.builtin.command: >-
        cloud-localds /var/lib/libvirt/images/{{ item.name }}-seed.iso /tmp/{{ item.name }}-user-data /tmp/{{ item.name }}-meta-data
      args:
        creates: "/var/lib/libvirt/images/{{ item.name }}-seed.iso"
      delegate_to: "{{ libvirt_host_fqdn | default(libvirt_host_ip) }}"
      become: true
      when: platform_libvirt_vm_provisioner_use_cloud_init_iso | default(true) | bool
  loop: "{{ vm_list }}"
  loop_control:
    loop_var: item
  when: not (platform_libvirt_vm_provisioner_done | default(false))

- name: Create marker directory for VM provisioner
  ansible.builtin.file:
    path: /var/lib/rhm
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Touch platform_libvirt_vm_provisioner marker
  ansible.builtin.file:
    path: /var/lib/rhm/platform_libvirt_vm_provisioner_done
    state: touch
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Write facts file for libvirt vm provisioner
  ansible.builtin.copy:
    dest: /etc/ansible/facts.d/rhm_vmprov.fact
    content: '{"platform_libvirt_vm_provisioner_done": true}'
    mode: '0644'
  become: true
  when: not (platform_libvirt_vm_provisioner_done | default(false))
