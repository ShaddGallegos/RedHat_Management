---
# Default variables for ansible_dev_node_deployment_setup role
deployment_setup_enabled: true
deployment_setup_version: "1.0"

# Directory structure
deployment_setup_directories:
  - "/opt/rhis"
  - "/opt/rhis/reports"
  - "/opt/rhis/inventory"
  - "/var/log/rhis"

# Feature toggles
deployment_setup_validate_environment: true
