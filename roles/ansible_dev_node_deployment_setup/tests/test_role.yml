---
# Test: ansible_dev_node_deployment_setup role basic functionality
- name: Test ansible_dev_node_deployment_setup role
  hosts: localhost
  gather_facts: false
  vars:
    ansible_dev_node_deployment_setup_deployment_setup_enabled: true
  tasks:
    - name: Verify role variables
      ansible.builtin.assert:
        that:
          - ansible_dev_node_deployment_setup_deployment_setup_enabled is defined
