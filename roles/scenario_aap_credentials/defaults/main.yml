---
# Default variables for scenario_aap_credentials role
scenario_aap_credentials_aap_credentials_config_enabled: true
scenario_aap_credentials_aap_credentials_config_version: "1.0"
scenario_aap_credentials_aap_credentials_config_timeout: 600

# AAP Connection
scenario_aap_credentials_aap_url: "https://aap.example.com"
scenario_aap_credentials_aap_username: "admin"
# aap_password: use vault!
scenario_aap_credentials_aap_verify_ssl: true

# Credentials Organization
scenario_aap_credentials_aap_credentials_organization: "Default"

# Machine Credentials
scenario_aap_credentials_create_machine_credentials: true
scenario_aap_credentials_machine_credentials:
  - name: "RHIS_SSH_Key"
    description: "SSH key for RHIS deployments"
    username: "ansible"
    ssh_key_data: "~/.ssh/id_rsa"
    become_method: "sudo"
    tags: ["rhis", "machine"]

  - name: "RHIS_Root_SSH"
    description: "Root SSH key for privileged operations"
    username: "root"
    ssh_key_data: "~/.ssh/id_rsa"
    tags: ["rhis", "machine", "root"]

# Cloud Credentials
scenario_aap_credentials_create_cloud_credentials: false
scenario_aap_credentials_cloud_credentials: []

# Network Credentials
scenario_aap_credentials_create_network_credentials: false
scenario_aap_credentials_network_credentials: []

# Vault Credentials
scenario_aap_credentials_create_vault_credentials: true
scenario_aap_credentials_vault_credentials:
  - name: "RHIS_Vault"
    description: "Vault for RHIS sensitive data"
    vault_password: "{{ vault_aap_vault_password }}"
    tags: ["rhis", "vault"]

# Registry Credentials
scenario_aap_credentials_create_registry_credentials: true
scenario_aap_credentials_registry_credentials:
  - name: "RedHat_Registry"
    description: "Red Hat container registry"
    host: "registry.redhat.io"
    username: "{{ rhel_subscription_username }}"
    password: "{{ vault_rhel_subscription_password }}"
    tags: ["rhis", "registry"]

# Satellite Credentials
scenario_aap_credentials_create_satellite_credentials: true
scenario_aap_credentials_satellite_credentials:
  - name: "Satellite_API"
    description: "Satellite API credentials"
    host: "scenario_satellite.example.com"
    username: "admin"
    password: "{{ vault_satellite_api_password }}"
    tags: ["rhis", "scenario_satellite"]

# IdM Credentials
scenario_aap_credentials_create_idm_credentials: false
scenario_aap_credentials_idm_credentials: []

# Feature toggles
scenario_aap_credentials_aap_credentials_validate_connectivity: true
scenario_aap_credentials_aap_credentials_test_connections: true
