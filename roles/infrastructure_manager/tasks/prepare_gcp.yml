---
# Platform Preparation: Google Cloud Platform (GCP)
# Prepares GCP environment for Compute Engine instance provisioning

- name: "Prepare GCP Infrastructure"
  debug:
    msg: |
      Google Cloud Platform Infrastructure Preparation
      ================================================
      Platform: gcp
      Target: GCP Compute Engine VM provisioning
  tags: ["infrastructure", "gcp", "prepare"]

- name: "Validate GCP prerequisites"
  block:
    - name: "Check Google Cloud SDK installation"
      shell: gcloud --version
      register: gcloud_check
      changed_when: false
      failed_when: false

    - name: "Check GCP authentication"
      shell: gcloud auth list
      register: gcloud_auth_check
      changed_when: false
      failed_when: false

    - name: "Assert GCP is configured"
      assert:
        that:
          - "gcloud_check.rc == 0"
          - "gcloud_auth_check.rc == 0"
        fail_msg: "Google Cloud SDK not installed or authentication failed. Install gcloud SDK and run 'gcloud auth login'."
      ignore_errors: true

  tags: ["infrastructure", "gcp", "validate"]

- name: "GCP infrastructure ready for provisioning"
  debug:
    msg: "GCP infrastructure prepared successfully"
  tags: ["infrastructure", "gcp", "info"]
