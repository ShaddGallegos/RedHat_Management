---
# Platform Preparation: Amazon Web Services (AWS)
# Prepares AWS environment for EC2 instance provisioning

- name: "Prepare AWS Infrastructure"
  debug:
    msg: |
      AWS Infrastructure Preparation
      ================================
      Platform: aws
      Target: EC2 instance provisioning
  tags: ["infrastructure", "aws", "prepare"]

- name: "Validate AWS prerequisites"
  block:
    - name: "Check AWS CLI installation"
      shell: aws --version
      register: aws_cli_check
      changed_when: false
      failed_when: false

    - name: "Check AWS credentials"
      shell: aws sts get-caller-identity
      register: aws_creds_check
      changed_when: false
      failed_when: false

    - name: "Assert AWS is configured"
      assert:
        that:
          - "aws_cli_check.rc == 0"
          - "aws_creds_check.rc == 0"
        fail_msg: "AWS CLI not configured or credentials not available. Configure AWS credentials and ensure AWS CLI is installed."
      ignore_errors: true

  tags: ["infrastructure", "aws", "validate"]

- name: "AWS infrastructure ready for provisioning"
  debug:
    msg: "AWS infrastructure prepared successfully"
  tags: ["infrastructure", "aws", "info"]
