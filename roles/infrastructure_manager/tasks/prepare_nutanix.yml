---
# Platform Preparation: Nutanix
# Prepares Nutanix HCI environment for VM provisioning

- name: "Prepare Nutanix Infrastructure"
  debug:
    msg: |
      Nutanix HCI Infrastructure Preparation
      =======================================
      Platform: nutanix
      Target: Nutanix HCI VM provisioning
  tags: ["infrastructure", "nutanix", "prepare"]

- name: "Validate Nutanix prerequisites"
  block:
    - name: "Check Nutanix Prism connectivity"
      debug:
        msg: "Validating Nutanix Prism credentials and connectivity"

    - name: "Verify Nutanix environment configuration"
      assert:
        that:
          - "nutanix_prism_host is defined or lookup('env', 'NUTANIX_PRISM_HOST') != ''"
          - "nutanix_prism_username is defined or lookup('env', 'NUTANIX_USERNAME') != ''"
        fail_msg: "Nutanix Prism credentials not configured. Set nutanix_prism_host and nutanix_prism_username."
      ignore_errors: true

  tags: ["infrastructure", "nutanix", "validate"]

- name: "Nutanix infrastructure ready for provisioning"
  debug:
    msg: "Nutanix infrastructure prepared successfully"
  tags: ["infrastructure", "nutanix", "info"]
