---
# Platform Preparation: LibVirt (KVM)
# Prepares KVM/LibVirt environment for virtual machine provisioning

- name: "Prepare LibVirt Infrastructure"
  debug:
    msg: |
      LibVirt Infrastructure Preparation
      ==================================
      Platform: libvirt
      Target: KVM-based virtualization
  tags: ["infrastructure", "libvirt", "prepare"]

- name: "Validate LibVirt prerequisites"
  block:
    - name: "Check LibVirt daemon"
      shell: systemctl is-active libvirtd
      register: libvirt_status
      changed_when: false
      failed_when: false

    - name: "Verify LibVirt tools"
      ansible.builtin.package_facts:
        manager: auto
      register: package_facts

    - name: "Assert LibVirt is installed and running"
      assert:
        that:
          - "'libvirt-daemon' in package_facts.ansible_facts.packages or libvirt_status.rc == 0"
        fail_msg: "LibVirt daemon is not installed or running. Install libvirt-daemon and start the service."
      ignore_errors: true

  tags: ["infrastructure", "libvirt", "validate"]

- name: "LibVirt infrastructure ready for provisioning"
  debug:
    msg: "LibVirt infrastructure prepared successfully"
  tags: ["infrastructure", "libvirt", "info"]
