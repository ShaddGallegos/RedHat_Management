---
# Infrastructure Preparation Role
# Consolidated from deploy_libvirt.yml and related playbooks
# Handles Libvirt network, storage, and VM platform_provisioning

- name: Display Libvirt platform_infrastructure_core header
  ansible.builtin.debug:
    msg: |

                 Preparing Libvirt Infrastructure


- name: Verify Libvirt prerequisites
  block:
    - name: Check libvirtd service
      ansible.builtin.systemd:
        name: libvirtd
        state: started
        enabled: true

    - name: Verify virt-manager
      ansible.builtin.package:
        name: virt-manager
        state: present

    - name: Verify qemu packages
      ansible.builtin.package:
        name:
          - qemu-kvm
          - libvirt-daemon-kvm
        state: present

- name: Create Libvirt virtual network
  block:
    - name: Define network XML
      ansible.builtin.set_fact:
        libvirt_network_xml: |
          <network>
            <name>rhmanagement</name>
            <forward mode='nat'/>
            <bridge name='virbr-rhm' stp='on' delay='0'/>
            <ip address='{{ libvirt_network_cidr | regex_replace('\.0/24', '.1') }}' netmask='255.255.255.0'>
              <dhcp>
                <range start='{{ libvirt_network_cidr | regex_replace('\.0/24', '.10') }}' end='{{ libvirt_network_cidr | regex_replace('\.0/24', '.200') }}'/>
              </dhcp>
            </ip>
          </network>

    - name: Create network definition file
      ansible.builtin.copy:
        dest: /tmp/rhmanagement-network.xml
        content: "{{ libvirt_network_xml }}"

    - name: Define Libvirt network
      ansible.builtin.shell: |
        virsh net-list | grep -q rhmanagement || virsh net-define /tmp/rhmanagement-network.xml

    - name: Start Libvirt network
      ansible.builtin.shell: |
        virsh net-list | grep -q "rhmanagement.*active" || virsh net-start rhmanagement

- name: Create Libvirt storage pool
  block:
    - name: Create storage directory
      ansible.builtin.file:
        path: "{{ libvirt_storage_path }}"
        state: directory
        mode: '0755'

    - name: Create storage pool definition
      ansible.builtin.set_fact:
        libvirt_pool_xml: |
          <pool type='dir'>
            <name>rhmanagement</name>
            <target>
              <path>{{ libvirt_storage_path }}</path>
            </target>
          </pool>

    - name: Define storage pool
      ansible.builtin.copy:
        dest: /tmp/rhmanagement-pool.xml
        content: "{{ libvirt_pool_xml }}"

    - name: Define Libvirt storage pool
      ansible.builtin.shell: |
        virsh pool-list | grep -q rhmanagement || virsh pool-define /tmp/rhmanagement-pool.xml

    - name: Start storage pool
      ansible.builtin.shell: |
        virsh pool-list | grep -q "rhmanagement.*active" || virsh pool-start rhmanagement

- name: Create VM volumes
  block:
    - name: Create volume for each VM
      ansible.builtin.shell: |
        virsh vol-list rhmanagement | grep -q {{ item.name }}.qcow2 || \
        virsh vol-create-as rhmanagement {{ item.name }}.qcow2 {{ item.disk }}G --format qcow2
      loop: "{{ libvirt_vms }}"

- name: Create virtual machines
  block:
    - name: Create VM definition for each VM
      ansible.builtin.set_fact:
        vm_configs: "{{ vm_configs | default({}) | combine({ item.name: lookup('template', 'vm-template.xml.j2') }) }}"
      loop: "{{ libvirt_vms }}"

    - name: Define virtual machines
      ansible.builtin.shell: |
        virsh list --all | grep -q {{ item.name }} || \
        virsh define /tmp/{{ item.name }}-vm.xml
      loop: "{{ libvirt_vms }}"

    - name: Start virtual machines
      ansible.builtin.shell: |
        virsh list | grep -q {{ item.name }} || virsh start {{ item.name }}
      loop: "{{ libvirt_vms }}"

    - name: Display platform_infrastructure_core summary
      ansible.builtin.debug:
        msg: |
          Libvirt Infrastructure Ready

          Network: rhmanagement ({{ libvirt_network_cidr }})
          Bridge: virbr-rhm
          Storage: {{ libvirt_storage_path }}
          VMs: {{ libvirt_vms | length }}

          Ready for component deployment
