---
# Role: rhis_inventory_integration
# Purpose: Provide RHIS inventory configuration reference and custom tasks
# This role demonstrates the inventory structure for RHIS deployments

# Include any custom external tasks
- name: "Include custom external tasks"
  ansible.builtin.include_tasks: "{{ item }}"
  loop: "{{ lookup('fileglob', role_path + '/tasks/custom_*.yml', wantlist=True) }}"
  ignore_errors: true
  tags:
    - rhis_custom_tasks

# Display inventory structure information
- name: "Display RHIS inventory structure information"
  ansible.builtin.debug:
    msg:
      - "RHIS Inventory Integration Role Loaded"
      - "Available templates in templates/rhis/"
      - "  - Provisioning: ~25 satellite provisioning templates"
      - "  - Configs: ~10 configuration templates"
      - "  - Inventory: 8 topology inventory templates"
      - "  - Execution-env: Execution environment templates"
      - "Available files in files/rhis/"
      - "  - OpenSCAP content files (RHEL 7, 8, 9)"
      - "  - Supporting scripts and RPMs"
      - "  - Configuration examples"
  tags:
    - always
