---
- delegate_to: localhost
  ignore_errors: true
- name: Update ServiceNow with integration start
  register: ticket_info
  uri:
    body_format: json
    headers:
      Accept: application/json
      Content-Type: application/json
    method: GET
    password: '{{ servicenow_password }}'
    query:
      sysparm_fields: sys_id,number,state
      sysparm_query: number={{ snow_ticket_number }}
    status_code: 200
    url: https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident
    user: '{{ servicenow_username }}'
    validate_certs: false
  when: snow_ticket_number is defined
- delegate_to: localhost
  ignore_errors: true
- name: Update ServiceNow with disk integration start
  uri:
    body:
      work_notes: '{{ ansible_date_time.iso8601 }} - Starting disk integration process

        Operation: Integrate new disk into LVM configuration

        Target: {{ vg_name }}/{{ lv_name }} ({{ mount_point }})

        '
    body_format: json
    method: PATCH
    password: '{{ servicenow_password }}'
    status_code: 200
    url: https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident/{{
      ticket_info.json.result[0].sys_id }}
    user: '{{ servicenow_username }}'
    validate_certs: false
  when:
  - snow_ticket_number is defined
  - ticket_info.json.result | length > 0
- ansible.builtin.setup:
    gather_subset:
    - mounts
- name: Gather initial mount information
  register: initial_mount_info
- block:
  - ansible.builtin.command: rescan-scsi-bus.sh
    changed_when: true
    ignore_errors: true
- name: Scan for new disks
  - ansible.builtin.command: lsblk -rn -o NAME,TYPE,SIZE,MOUNTPOINT
    changed_when: false
- name: Get list of available disks
    register: disk_list
  - ansible.builtin.shell: lsblk -rn -o NAME,TYPE,MOUNTPOINT | grep -v -e '[[:space:]]/[[:space:]]'
      | grep disk | grep -v -e '[[:space:]]/boot' | awk '{print $1}'
    changed_when: false
- name: Find unpartitioned/unused disks
    register: unused_disks
  - ansible.builtin.set_fact:
      new_disk: /dev/{{ unused_disks.stdout_lines[-1] }}
- name: Select new disk (assuming the last one added)
    when: unused_disks.stdout_lines | length > 0
  - ansible.builtin.fail:
      msg: No unused disk found to integrate
- name: Fail if no unused disk found
    when: unused_disks.stdout_lines | length == 0
  - ansible.builtin.command: pvcreate {{ new_disk }}
- name: Create physical volume
    register: pvcreate_result
  - ansible.builtin.command: vgextend {{ vg_name }} {{ new_disk }}
- name: Extend volume group
    register: vgextend_result
  - ansible.builtin.shell: vgs {{ vg_name }} --noheadings --units g -o vg_free
    changed_when: false
- name: Get volume group free space
    register: vg_free
  - ansible.builtin.set_fact:
      vg_free_gb: '{{ (vg_free.stdout | trim | regex_replace(''G$'', '''') | float)
        | round(2) }}'
- name: Calculate available space
  - ansible.builtin.command: lvextend -l +100%FREE /dev/{{ vg_name }}/{{ lv_name }}
- name: Extend logical volume using new space
    register: lvextend_result
  - ansible.builtin.set_fact:
      fs_type: '{{ initial_mount_info.ansible_facts.ansible_mounts | selectattr(''mount'',
        ''equalto'', mount_point) | map(attribute=''fstype'') | list | first }}'
- name: Get filesystem type
  - ansible.builtin.command: xfs_growfs {{ mount_point }}
- name: Resize XFS filesystem
    register: fs_resize
    when: fs_type == "xfs"
  - ansible.builtin.command: resize2fs /dev/{{ vg_name }}/{{ lv_name }}
- name: Resize EXT4 filesystem
    register: fs_resize
    when: fs_type == "ext4"
  - delegate_to: localhost
    ignore_errors: true
- name: Update ServiceNow with disk integration progress
    uri:
      body:
        work_notes: '{{ ansible_date_time.iso8601 }} - Disk integration progress

          - New disk detected: {{ new_disk }}

          - Physical volume created: Success

          - Volume group extended: {{ vg_name }}

          - Space added to volume group: {{ vg_free_gb }}GB

          - Logical volume extended: /dev/{{ vg_name }}/{{ lv_name }}

          - Filesystem resized: {{ fs_type }}

          '
      body_format: json
      method: PATCH
      password: '{{ servicenow_password }}'
      status_code: 200
      url: https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident/{{
        ticket_info.json.result[0].sys_id }}
      user: '{{ servicenow_username }}'
      validate_certs: false
    when:
    - ticket_info.json.result | length > 0
  when: is_new_disk | bool
- ansible.builtin.setup:
    gather_subset:
    - mounts
- name: Get final mount information
  register: final_mount_info
- ansible.builtin.set_fact:
    final_avail_gb: '{{ (final_mount_info.ansible_facts.ansible_mounts | selectattr(''mount'',
      ''equalto'', mount_point) | map(attribute=''size_available'') | list | first
      / 1024 / 1024 / 1024) | round(2) }}'
    final_size_gb: '{{ (final_mount_info.ansible_facts.ansible_mounts | selectattr(''mount'',
      ''equalto'', mount_point) | map(attribute=''size_total'') | list | first / 1024
      / 1024 / 1024) | round(2) }}'
    final_used_pct: '{{ ((final_mount_info.ansible_facts.ansible_mounts | selectattr(''mount'',
      ''equalto'', mount_point) | map(attribute=''size_total'') | list | first - final_mount_info.ansible_facts.ansible_mounts
      | selectattr(''mount'', ''equalto'', mount_point) | map(attribute=''size_available'')
      | list | first) / final_mount_info.ansible_facts.ansible_mounts | selectattr(''mount'',
      ''equalto'', mount_point) | map(attribute=''size_total'') | list | first * 100)
      | round(1) }}'
- name: Calculate new size information
- ansible.builtin.set_fact:
    space_added_gb: '{{ new_disk_size_gb | default(vg_free_gb) }}'
- name: Calculate space added
- delegate_to: localhost
  ignore_errors: true
- name: Update ServiceNow with final results
  uri:
    body:
      work_notes: '{{ ansible_date_time.iso8601 }} - Disk integration completed successfully


        Final system status:

        - Mount point: {{ mount_point }}

        - Total size: {{ final_size_gb }}GB

        - Available space: {{ final_avail_gb }}GB

        - Current usage: {{ final_used_pct }}%

        - Space added: {{ space_added_gb }}GB


        The system now has sufficient disk space and the issue is resolved.

        '
    body_format: json
    method: PATCH
    password: '{{ servicenow_password }}'
    status_code: 200
    url: https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident/{{
      ticket_info.json.result[0].sys_id }}
    user: '{{ servicenow_username }}'
    validate_certs: false
  when:
  - ticket_info.json.result | length > 0
- ansible.builtin.include_role:
- name: servicenow_ticket_management
    tasks_from: close_ticket.yml
- name: Trigger ServiceNow ticket closure
  vars:
    close_code: Solved (Permanently)
    close_notes: Disk space issue resolved automatically by Ansible automation.
    final_usage_info: '{{ final_mount_info.ansible_facts.ansible_mounts | selectattr(''mount'',
      ''equalto'', mount_point) | first }}'
    snow_instance: '{{ servicenow_instance | default(''dev12345'') }}'
    snow_ticket_number: '{{ snow_ticket_number }}'
    space_added_gb: '{{ space_added_gb }}'
    when: snow_ticket_number is defined
