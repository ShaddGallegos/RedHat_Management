---
# Satellite and Insights integration
# Configures Insights client registration and remediation automation in Satellite
- name: Configure Satellite-Insights integration
  when: satellite_fqdn is defined
  block:
    - name: Install Insights client
      ansible.builtin.package:
        name:
          - insights-client
          - python3-insights-client
        state: present

    - name: Register systems with Insights
      ansible.builtin.command: insights-client --register
      changed_when: false
      failed_when: false

    - name: Enable auto-remediation in Satellite
      ansible.builtin.debug:
        msg: "Enabling Insights-guided remediation in Satellite"
