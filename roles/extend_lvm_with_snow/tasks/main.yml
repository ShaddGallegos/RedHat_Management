---
- ansible.builtin.include_vars:
    file: /tmp/snow_ticket_{{ hostname }}.yml
- name: Load ServiceNow ticket information
- ansible.builtin.debug:
    var: ticket_info
  delegate_to: localhost
  ignore_errors: true
- name: Show loaded ticket info
- delegate_to: localhost
  ignore_errors: true
- name: Update ServiceNow ticket - Starting LVM extension
  uri:
    body:
      state: '2'
      work_notes: '{{ ansible_date_time.iso8601 }} - Starting LVM extension process
        on {{ inventory_hostname }}'
    body_format: json
    headers:
      Accept: application/json
      Content-Type: application/json
    method: PATCH
    password: '{{ servicenow_password }}'
    status_code: 200
    url: https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident/{{
      ticket_info.snow_ticket_sys_id }}
    user: '{{ servicenow_username }}'
    validate_certs: false
  when: ticket_info.snow_ticket_sys_id is defined
- block:
  - ansible.builtin.assert:
      fail_msg: Required LVM variables not provided
      that:
      - vg_name is defined
      - lv_name is defined
      - mount_point is defined
- name: Validate required variables
  - delegate_to: localhost
    ignore_errors: true
- name: Update ServiceNow - Variables validated
    uri:
      body:
        work_notes: '{{ ansible_date_time.iso8601 }} - LVM variables validated. Target:
          {{ vg_name }}/{{ lv_name }} at {{ mount_point }}'
      body_format: json
      method: PATCH
      password: '{{ servicenow_password }}'
      url: https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident/{{
        ticket_info.snow_ticket_sys_id }}
      user: '{{ servicenow_username }}'
      validate_certs: false
    when: ticket_info.snow_ticket_sys_id is defined
  - ansible.builtin.include_role:
- name: lvm_system_inspection
- name: Perform system inspection using role
  vars:
    required_growth_percent: '{{ extend_percent }}'
    target_lv: '{{ lv_name }}'
    target_vg: '{{ vg_name }}'
  - delegate_to: localhost
    ignore_errors: true
- name: Update ServiceNow - System inspection complete
    uri:
      body:
        work_notes: "{{ ansible_date_time.iso8601 }} - System inspection completed\n\
          - Current VG Size: {{ vg_size_gb | default('Unknown') }}GB\n- Current LV\
          \ Size: {{ lv_size_gb | default('Unknown') }}GB \n- Required Space: {{ required_space_gb\
          \ | default('Unknown') }}GB\n- Sufficient Space: {{ sufficient_space | default('Unknown')\
          \ }}\n"
      body_format: json
      method: PATCH
      password: '{{ servicenow_password }}'
      url: https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident/{{
        ticket_info.snow_ticket_sys_id }}
      user: '{{ servicenow_username }}'
      validate_certs: false
    when: ticket_info.snow_ticket_sys_id is defined
  - ansible.builtin.include_role:
- name: lvm_smart_extend
- name: Perform smart LVM extension using role
  vars:
    required_growth_percent: '{{ extend_percent }}'
    target_lv: '{{ lv_name }}'
    target_mount: '{{ mount_point }}'
    target_vg: '{{ vg_name }}'
    when: sufficient_space is defined and sufficient_space | bool
  - delegate_to: localhost
    ignore_errors: true
- name: Update ServiceNow - LVM extension complete
    uri:
      body:
        work_notes: '{{ ansible_date_time.iso8601 }} - LVM extension completed using
          existing space. Volume extended by {{ extend_percent }}%'
      body_format: json
      method: PATCH
      password: '{{ servicenow_password }}'
      url: https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident/{{
        ticket_info.snow_ticket_sys_id }}
      user: '{{ servicenow_username }}'
      validate_certs: false
    when:
    - sufficient_space is defined and sufficient_space | bool
    - ticket_info.snow_ticket_sys_id is defined
- name: Execute LVM Extension Process with ServiceNow Updates
  rescue:
  - ansible.builtin.debug:
      msg: 'LVM extension failed: {{ ansible_failed_result.msg }}'
- name: Log failure details
  - delegate_to: localhost
    ignore_errors: true
- name: Update ServiceNow with failure information
    uri:
      body:
        state: '2'
        work_notes: '{{ ansible_date_time.iso8601 }} - LVM extension FAILED

          Error: {{ ansible_failed_result.msg | default(''Unknown error'') }}


          {% if not sufficient_space %}

          Insufficient space available in volume group.

          New disk creation will be attempted via Nutanix API.

          {% endif %}

          '
      body_format: json
      method: PATCH
      password: '{{ servicenow_password }}'
      url: https://{{ servicenow_instance | default('dev12345') }}.service-now.com/api/now/table/incident/{{
        ticket_info.snow_ticket_sys_id }}
      user: '{{ servicenow_username }}'
      validate_certs: false
    when: ticket_info.snow_ticket_sys_id is defined
  - community.general.mail:
      body: 'LVM extension encountered an issue on {{ inventory_hostname }}


        {% if not sufficient_space %}

        Issue: Insufficient space in volume group {{ vg_name }}

        Solution: New disk will be created via Nutanix API

        {% else %}

        Error: {{ ansible_failed_result.msg | default(''Unknown error'') }}

        {% endif %}


        ServiceNow ticket: {{ ticket_info.snow_ticket_number | default(''Not available'')
        }}


        {% if not sufficient_space %}

        The automation will continue with new disk creation.

        {% else %}

        Manual intervention may be required.

        {% endif %}

        '
      smtp_host: '{{ mail_smtp_host | default(''localhost'') }}'
      smtp_port: '{{ mail_smtp_port | default(25) }}'
      subject: LVM Extension Issue - {{ inventory_hostname }} - ServiceNow {{ ticket_info.snow_ticket_number
        | default('N/A') }}
      to: '{{ item }}'
    ignore_errors: true
    loop:
    - '{{ user_email }}'
    - '{{ admin_email }}'
    - '{{ operations_email }}'
- name: Send failure notification email
  - ansible.builtin.uri:
      body:
        action: create_new_disk
        hostname: '{{ inventory_hostname }}'
        lv_name: '{{ lv_name }}'
        mount_point: '{{ mount_point }}'
        new_disk_size_gb: '{{ new_disk_size_gb | default(math.ceil((vg_size_gb | default(20))
          * 0.2)) }}'
        snow_ticket_number: '{{ ticket_info.snow_ticket_number | default('''') }}'
        vg_name: '{{ vg_name }}'
      body_format: json
      method: POST
      url: http://localhost:5001/create-disk
    delegate_to: localhost
    ignore_errors: true
- name: Trigger new disk creation if insufficient space
    when: sufficient_space is defined and not sufficient_space | bool
- ansible.builtin.uri:
    body:
      action: integrate_new_disk
      admin_email: '{{ admin_email }}'
      disk_created: false
      hostname: '{{ inventory_hostname }}'
      lv_name: '{{ lv_name }}'
      mount_point: '{{ mount_point }}'
      operations_email: '{{ operations_email }}'
      snow_ticket_number: '{{ ticket_info.snow_ticket_number | default('''') }}'
      space_added_gb: '{{ extend_percent }}% of original'
      user_email: '{{ user_email }}'
      vg_name: '{{ vg_name }}'
    body_format: json
    method: POST
    url: http://localhost:5002/integrate-disk
  delegate_to: localhost
  ignore_errors: true
- name: Trigger ServiceNow closure if extension successful
  when:
  - sufficient_space is defined and sufficient_space | bool
  - ticket_info.snow_ticket_number is defined
- ansible.builtin.debug:
    msg: LVM extension process completed for {{ inventory_hostname }}. ServiceNow
      ticket {{ ticket_info.snow_ticket_number | default('N/A') }} will be updated.
- name: Log completion status
