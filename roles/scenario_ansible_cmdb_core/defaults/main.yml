scenario_ansible_cmdb_core_cmdb_enabled: true
scenario_ansible_cmdb_core_cmdb_version: "1.0"
scenario_ansible_cmdb_core_cmdb_timeout: 300

# CMDB configuration
scenario_ansible_cmdb_core_cmdb_database: "scenario_ansible_cmdb_core"
