---
# Test: aap_templates role
- name: Test aap_templates role
  hosts: localhost
  gather_facts: false
  vars:
    aap_templates_config_enabled: true
    aap_url: "https://aap.example.com"
    aap_username: "admin"
  tasks:
    - name: Verify role variables
      assert:
        that:
          - aap_templates_config_enabled is defined
          - aap_url is defined
