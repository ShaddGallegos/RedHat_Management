---
# Tasks for platform_provisioning services configuration

- name: Ensure platform_provisioning services directory exists
  block:
    - name: Create backup directory for configurations
      ansible.builtin.file:
        path: "{{ platform_services_provisioning_stack_backup_directory }}"
        state: directory
        mode: "0755"
      when: platform_services_provisioning_stack_backup_enabled

- name: Configure Primary Network Interface (External Network - libvirt NAT)
  block:
    - name: "Configure primary ethernet interface ({{ platform_services_provisioning_stack_provisioning_primary_interface }})"
      community.general.nmcli:
        conn_name: "{{ platform_services_provisioning_stack_provisioning_primary_interface }}"
        ifname: "{{ platform_services_provisioning_stack_provisioning_primary_interface }}"
        type: ethernet
        method4: auto
        autoconnect: true
        state: present
      notify: restart network service

    - name: Bring up primary interface
      ansible.builtin.command: "nmcli connection up {{ platform_services_provisioning_stack_provisioning_primary_interface }}"
      changed_when: false

    - name: Display primary interface configuration
      ansible.builtin.command: "ip addr show {{ platform_services_provisioning_stack_provisioning_primary_interface }}"
      register: primary_interface_config
      changed_when: false

    - name: Show primary interface
      ansible.builtin.debug:
        msg: |
          Primary Interface (External - libvirt NAT):
          {{ primary_interface_config.stdout_lines }}

- name: Configure Secondary Network Interface (Private Network - 10.168.0.0/16)
  block:
    - name: "Configure secondary ethernet interface ({{ platform_services_provisioning_stack_provisioning_secondary_interface }})"
      community.general.nmcli:
        conn_name: "{{ platform_services_provisioning_stack_provisioning_secondary_interface }}"
        ifname: "{{ platform_services_provisioning_stack_provisioning_secondary_interface }}"
        type: ethernet
        ip4: "{{ platform_services_provisioning_stack_provisioning_interface_ip }}/16"
        gw4: "{{ platform_services_provisioning_stack_provisioning_interface_gateway }}"
        method4: manual
        autoconnect: true
        state: present
      notify: restart network service

    - name: Bring up secondary interface
      ansible.builtin.command: "nmcli connection up {{ platform_services_provisioning_stack_provisioning_secondary_interface }}"
      changed_when: false

    - name: Display secondary interface configuration
      ansible.builtin.command: "ip addr show {{ platform_services_provisioning_stack_provisioning_secondary_interface }}"
      register: secondary_interface_config
      changed_when: false

    - name: Show secondary interface
      ansible.builtin.debug:
        msg: |
          Secondary Interface (Private - 10.168.0.0/16 Provisioning):
          {{ secondary_interface_config.stdout_lines }}

- name: Configure Resolv.conf with Nameserver
  block:
    - name: Backup original resolv.conf
      ansible.builtin.copy:
        src: "{{ platform_services_provisioning_stack_resolv_conf_path }}"
        dest: "{{ platform_services_provisioning_stack_resolv_conf_path }}.bak.{{ ansible_date_time.iso8601_basic }}"
        remote_src: true
      when: platform_services_provisioning_stack_backup_enabled
      ignore_errors: true

    - name: Configure resolv.conf with nameserver and options
      ansible.builtin.lineinfile:
        path: "{{ platform_services_provisioning_stack_resolv_conf_path }}"
        create: true
        state: present
        line: "{{ item }}"
        regexp: "^{{ item | split('\\s+') | first }}"
      loop:
        - "nameserver 10.168.0.1"
        - "search example.com prod.spg lab.example.com"
        - "options rotate timeout:2 attempts:3"
      notify: update resolv.conf

    - name: Verify resolv.conf contents
      ansible.builtin.command: "cat {{ platform_services_provisioning_stack_resolv_conf_path }}"
      register: resolv_conf_contents
      changed_when: false

    - name: Display resolv.conf contents
      ansible.builtin.debug:
        msg: "{{ resolv_conf_contents.stdout_lines }}"

- name: Install and Configure DHCP Server
  block:
    - name: Install DHCP server package
      ansible.builtin.package:
        name: "{{ platform_services_provisioning_stack_dhcp_package }}"
        state: present

    - name: Create DHCP configuration
      ansible.builtin.template:
        src: dhcpd.conf.j2
        dest: "{{ platform_services_provisioning_stack_dhcp_config_file }}"
        backup: true
        owner: root
        group: root
        mode: "0644"
      notify: restart dhcp service
      register: dhcp_config_result

    - name: Initialize DHCP leases file
      ansible.builtin.file:
        path: "{{ platform_services_provisioning_stack_dhcp_leases_file }}"
        state: touch
        owner: dhcpd
        group: dhcpd
        mode: "0640"

    - name: Enable DHCP service on boot
      ansible.builtin.systemd:
        name: "{{ platform_services_provisioning_stack_dhcp_service }}"
        enabled: true
        daemon_reload: true
      when: platform_services_provisioning_stack_service_enable_on_boot

    - name: Start DHCP service
      ansible.builtin.systemd:
        name: "{{ platform_services_provisioning_stack_dhcp_service }}"
        state: started
      when: platform_services_provisioning_stack_service_restart_enabled

- name: Install and Configure DNS Server
  block:
    - name: Install BIND DNS package
      ansible.builtin.package:
        name: "{{ platform_services_provisioning_stack_dns_package }}"
        state: present

    - name: Create DNS zones directory
      ansible.builtin.file:
        path: "{{ platform_services_provisioning_stack_dns_zones_dir }}"
        state: directory
        owner: named
        group: named
        mode: "0750"

    - name: Create BIND configuration
      ansible.builtin.template:
        src: named.conf.j2
        dest: "{{ platform_services_provisioning_stack_dns_config_file }}"
        backup: true
        owner: root
        group: named
        mode: "0644"
      notify: restart dns service

    - name: Create zone configuration
      ansible.builtin.template:
        src: named.zones.j2
        dest: "{{ platform_services_provisioning_stack_dns_zones_dir }}/named.zones"
        owner: named
        group: named
        mode: "0644"
      notify: restart dns service

    - name: Create DNS zone files
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ platform_services_provisioning_stack_dns_zones_dir }}/{{ item }}"
        owner: named
        group: named
        mode: "0644"
      loop:
        - "named.example.com"
        - "named.prod.spg"
      notify: restart dns service

    - name: Enable DNS service on boot
      ansible.builtin.systemd:
        name: "{{ platform_services_provisioning_stack_dns_service }}"
        enabled: true
        daemon_reload: true
      when: platform_services_provisioning_stack_service_enable_on_boot

    - name: Start DNS service
      ansible.builtin.systemd:
        name: "{{ platform_services_provisioning_stack_dns_service }}"
        state: started
      when: platform_services_provisioning_stack_service_restart_enabled

    - name: Validate BIND configuration
      ansible.builtin.command: "named-checkconf {{ platform_services_provisioning_stack_dns_config_file }}"
      changed_when: false
      register: bind_check
      failed_when: bind_check.rc != 0

- name: Install and Configure TFTP Server
  block:
    - name: Install TFTP server packages
      ansible.builtin.package:
        name:
          - "{{ platform_services_provisioning_stack_tftp_package }}"
          - "xinetd"
        state: present

    - name: Create TFTP root directory
      ansible.builtin.file:
        path: "{{ platform_services_provisioning_stack_tftp_root }}"
        state: directory
        owner: "{{ platform_services_provisioning_stack_tftp_user }}"
        group: "{{ platform_services_provisioning_stack_tftp_group }}"
        mode: "{{ platform_services_provisioning_stack_tftp_permissions }}"

    - name: Download PXE bootloader
      block:
        - name: Ensure syslinux package is installed
          ansible.builtin.package:
            name: "syslinux-tftpboot"
            state: present

        - name: Copy PXE bootloader to TFTP root
          ansible.builtin.copy:
            src: "/tftpboot/{{ platform_services_provisioning_stack_pxe_bootloader }}"
            dest: "{{ platform_services_provisioning_stack_tftp_root }}/{{ platform_services_provisioning_stack_pxe_bootloader }}"
            owner: "{{ platform_services_provisioning_stack_tftp_user }}"
            group: "{{ platform_services_provisioning_stack_tftp_group }}"
            mode: "{{ platform_services_provisioning_stack_tftp_file_permissions }}"
            remote_src: true
          ignore_errors: true

    - name: Create PXE menu directory
      ansible.builtin.file:
        path: "{{ platform_services_provisioning_stack_tftp_root }}/pxelinux.cfg"
        state: directory
        owner: "{{ platform_services_provisioning_stack_tftp_user }}"
        group: "{{ platform_services_provisioning_stack_tftp_group }}"
        mode: "{{ platform_services_provisioning_stack_tftp_permissions }}"

    - name: Create PXE boot menu
      ansible.builtin.template:
        src: pxelinux.cfg.default.j2
        dest: "{{ platform_services_provisioning_stack_tftp_root }}/pxelinux.cfg/default"
        owner: "{{ platform_services_provisioning_stack_tftp_user }}"
        group: "{{ platform_services_provisioning_stack_tftp_group }}"
        mode: "{{ platform_services_provisioning_stack_tftp_file_permissions }}"

    - name: Configure TFTP via xinetd
      ansible.builtin.template:
        src: xinetd.tftp.j2
        dest: "/etc/xinetd.d/tftp"
        owner: root
        group: root
        mode: "0644"
      notify: restart xinetd service

    - name: Enable xinetd on boot
      ansible.builtin.systemd:
        name: xinetd
        enabled: true
        daemon_reload: true
      when: platform_services_provisioning_stack_service_enable_on_boot

    - name: Start xinetd service
      ansible.builtin.systemd:
        name: xinetd
        state: started
      when: platform_services_provisioning_stack_service_restart_enabled

- name: Configure Firewall Rules
  block:
    - name: Ensure firewalld is installed and running
      ansible.builtin.package:
        name: firewalld
        state: present

    - name: Start and enable firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    - name: Configure firewall for DHCP
      ansible.posix.firewalld:
        ansible.builtin.service: dhcp
        permanent: true
        state: enabled
        immediate: true
      when: platform_services_provisioning_stack_firewall_enabled and platform_services_provisioning_stack_dhcp_enabled

    - name: Configure firewall for DNS
      ansible.posix.firewalld:
        ansible.builtin.service: dns
        permanent: true
        state: enabled
        immediate: true
      when: platform_services_provisioning_stack_firewall_enabled and platform_services_provisioning_stack_dns_enabled

    - name: Configure firewall for TFTP
      ansible.posix.firewalld:
        ansible.builtin.service: tftp
        permanent: true
        state: enabled
        immediate: true
      when: platform_services_provisioning_stack_firewall_enabled and platform_services_provisioning_stack_tftp_enabled

    - name: Configure firewall for PXE boot
      ansible.posix.firewalld:
        rich_rule: "rule family='ipv4' destination address='10.168.0.1' port='4011' protocol='udp' accept"
        permanent: true
        state: enabled
        immediate: true
      when: platform_services_provisioning_stack_firewall_enabled and platform_services_provisioning_stack_pxe_enabled

- name: Validate Provisioning Services
  block:
    - name: Verify secondary interface is up
      ansible.builtin.command: "ip addr show {{ platform_services_provisioning_stack_provisioning_secondary_interface }}"
      register: interface_check
      changed_when: false
      failed_when: "platform_services_provisioning_stack_provisioning_interface_ip not in interface_check.stdout"

    - name: Verify DHCP service is running
      ansible.builtin.systemd:
        name: "{{ platform_services_provisioning_stack_dhcp_service }}"
        state: started
      register: dhcp_status
      when: platform_services_provisioning_stack_dhcp_enabled

    - name: Verify DNS service is running
      ansible.builtin.systemd:
        name: "{{ platform_services_provisioning_stack_dns_service }}"
        state: started
      register: dns_status
      when: platform_services_provisioning_stack_dns_enabled

    - name: Verify xinetd service is running
      ansible.builtin.systemd:
        name: xinetd
        state: started
      register: tftp_status
      when: platform_services_provisioning_stack_tftp_enabled

    - name: Test DNS resolution
      ansible.builtin.command: "dig @10.168.0.1 scenario_satellite.prod.spg"
      register: dns_test
      changed_when: false
      failed_when: dns_test.rc != 0

    - name: Display DNS test results
      ansible.builtin.debug:
        msg: "{{ dns_test.stdout_lines }}"

- name: Handlers for Service Restart
  ansible.builtin.include_tasks: handlers.yml
