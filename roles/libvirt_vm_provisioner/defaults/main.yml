---
# Libvirt VM Provisioner - Default Variables

# VM Configuration
libvirt_vm_name: "rhel10-vm"
libvirt_vm_cpus: 2
libvirt_vm_memory: 2048  # MB
libvirt_vm_disk: 50      # GB
libvirt_vm_network: "default"

# File Paths
libvirt_iso_file: "files/rhel-10.iso"
libvirt_kickstart_file: "files/oem.cfg"

# HTTP Server Configuration
libvirt_kickstart_port: 8888
libvirt_kickstart_http_dir: "/tmp/rhel-kickstart-{{ ansible_date_time.iso8601_basic_short }}"

# Installation Monitoring
libvirt_monitor_timeout: 300  # seconds
libvirt_monitor_interval: 5   # seconds

# Optional Network Configuration
libvirt_bridge_device: null
libvirt_mac_address: null
libvirt_static_ip: null
libvirt_gateway: null
libvirt_nameserver: null

# Kickstart Template Variables
libvirt_root_password: "$1$salt$N6vxIwfYxSXXPw8jg2Qz5/"  # Change this!
libvirt_ansible_user: "ansible"
libvirt_packages:
  - "@core"
  - "@standard"
  - "vim"
  - "curl"
  - "wget"
  - "git"
  - "python3"
  - "python3-devel"

# Post-Installation Tasks
libvirt_install_ansible: true
libvirt_enable_selinux: true
libvirt_enable_firewall: true
libvirt_firewall_services:
  - "ssh"

# Cleanup Options
libvirt_cleanup_http_server: true
libvirt_cleanup_temp_files: true

# Logging
libvirt_log_level: "info"  # debug, info, warning, error
libvirt_save_logs: true
libvirt_logs_dir: "/tmp/libvirt-provisioner-logs"
