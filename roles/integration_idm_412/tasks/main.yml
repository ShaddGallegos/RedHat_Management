---
# Red Hat Identity Management (IdM) Integration Role
# Deploys FreeIPA-based IdM for centralized authentication
# Provides Kerberos realm, LDAP directory, DNS, NTP, and certificate authority

- name: "IdM: Verify Prerequisites"
  block:
    - name: Check hostname is FQDN
      ansible.builtin.debug:
        msg: |
          Required Setup:
          - Hostname must be FQDN: {{ ansible_fqdn }}
          - Domain: {{ domain_name | default('example.com') }}
          - IP Address: {{ ansible_default_ipv4.address }}

          Note: Hostname will be set during IdM deployment

    - name: Check DNS resolution
      ansible.builtin.shell: |
        echo "Testing DNS resolution for {{ idm_fqdn | default('idm.example.com') }}"
        nslookup {{ idm_fqdn | default('idm.example.com') }} 2>/dev/null || echo "DNS not yet configured"
      changed_when: false

- name: "IdM: Install Required Packages"
  block:
    - name: Install IdM server packages
      ansible.builtin.yum:
        name:
          - freeipa-server
          - freeipa-server-trust-ad
          - bind-dyndb-ldap
          - ipa-client
          - python3-ipalib
        state: present
      become: true

    - name: Install optional IdM packages
      ansible.builtin.yum:
        name:
          - freeipa-healthcheck
          - krb5-workstation
          - sssd
          - sudo
        state: present
      become: true

- name: "IdM: Configure Network and Hostname"
  block:
    - name: Set system hostname to FQDN
      hostname:
        name: "{{ idm_fqdn | default('idm.' + domain_name | default('example.com')) }}"
      become: true

    - name: Configure /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^{{ ansible_default_ipv4.address }}"
        line: "{{ ansible_default_ipv4.address }} {{ idm_fqdn | default('idm.' + domain_name | default('example.com')) }} idm"
        state: present
      become: true

    - name: Configure firewall for IdM services
      ansible.posix.firewalld:
        ansible.builtin.service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      become: true
      loop:
        - freeipa-4
        - dns
        - ntp
      ignore_errors: true

    - name: Configure firewall for specific ports
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      become: true
      loop:
        - 88      # Kerberos
        - 389     # LDAP
        - 636     # LDAPS
        - 5985    # WinRM (for AD trust)
        - 5986    # WinRM secure
      ignore_errors: true

- name: "IdM: Prepare Installation Variables"
  block:
    - name: Create IdM configuration directory
      ansible.builtin.file:
        path: /etc/ipa
        state: directory
        mode: '0755'
        owner: root
        group: root
      become: true

    - name: Create IdM installation response file
      ansible.builtin.copy:
        dest: /etc/ipa/ipa-install-vars.yml
        content: |
          ---
          # Red Hat Identity Management Installation Variables

          # Domain and realm configuration
          domain_name: "{{ domain_name | default('example.com') }}"
          realm_name: "{{ domain_name | default('EXAMPLE.COM') | upper }}"
          kdc_admin_password: "{{ idm_admin_password | default('') }}"

          # IdM server configuration
          idm_server_fqdn: "{{ idm_fqdn | default('idm.' + domain_name | default('example.com')) }}"
          idm_server_ip: "{{ idm_ip | default(ansible_default_ipv4.address) }}"

          # Directory Manager settings
          directory_manager_dn: "cn=Directory Manager"
          directory_manager_password: "{{ ldap_admin_password | default('') }}"

          # IdM admin user
          admin_user: "{{ idm_admin_user | default('admin') }}"
          admin_password: "{{ idm_admin_password | default('') }}"

          # Certificate authority
          ca_subject: "cn=Certificate Authority,o={{ domain_name | default('example.com') }}"
          certificate_validity_days: 3650

          # DNS configuration
          enable_dns: true
          dns_forwarder: "{{ dns_forwarder | default('8.8.8.8') }}"

          # NTP configuration
          enable_ntp: true
          ntp_server: "{{ ntp_server | default('pool.ntp.org') }}"
        owner: root
        group: root
        mode: '0600'
      become: true

- name: "IdM: Configure Kerberos Realm"
  block:
    - name: Create krb5.conf configuration
      ansible.builtin.copy:
        dest: /etc/krb5.conf
        content: |
          [libdefaults]
              default_realm = {{ domain_name | default('EXAMPLE.COM') | upper }}
              kdc_timesync = 1
              ccache_type = 4
              forwardable = true
              proxiable = true
              fqdn = false

          [realms]
              {{ domain_name | default('EXAMPLE.COM') | upper }} = {
                  kdc = {{ idm_fqdn | default('idm.' + domain_name | default('example.com')) }}:88
                  admin_server = {{ idm_fqdn | default('idm.' + domain_name | default('example.com')) }}:749
                  default_domain = {{ domain_name | default('example.com') }}
              }

          [domain_realm]
              .{{ domain_name | default('example.com') }} = {{ domain_name | default('EXAMPLE.COM') | upper }}
              {{ domain_name | default('example.com') }} = {{ domain_name | default('EXAMPLE.COM') | upper }}

          [kdc]
              profile = /var/kerberos/krb5kdc/kdc.conf

          [appdefaults]
              pam = {
                  debug = false
                  ticket_lifetime = 36000
                  renew_lifetime = 36000
                  forwardable = true
                  krb4_convert = false
              }
        owner: root
        group: root
        mode: '0644'
      become: true

- name: "IdM: Configure SSSD Integration"
  block:
    - name: Create SSSD configuration
      ansible.builtin.copy:
        dest: /etc/sssd/sssd.conf
        content: |
          [sssd]
          config_file_version = 2
          services = nss, pam, ssh, sudo
          domains = {{ domain_name | default('example.com') }}

          [domain/{{ domain_name | default('example.com') }}]
          cache_credentials = True
          id_provider = ipa
          auth_provider = ipa
          access_provider = ipa
          chpass_provider = ipa

          ipa_server = {{ idm_fqdn | default('idm.' + domain_name | default('example.com')) }}
          ipa_server_mode = false
          ipa_domain = {{ domain_name | default('example.com') }}

          krb5_server = {{ idm_fqdn | default('idm.' + domain_name | default('example.com')) }}
          krb5_realm = {{ domain_name | default('EXAMPLE.COM') | upper }}

          ldap_uri = ldap://{{ idm_fqdn | default('idm.' + domain_name | default('example.com')) }}
          ldap_search_base = cn=accounts,dc={{ domain_name | default('example.com') | replace('.', ',dc=') }}

          # Performance tuning
          enum_cache_timeout = 3600
          entry_cache_timeout = 3600

          # SSH integration_generic
          services = nss, pam, ssh, sudo

          [nss]
          homedir_substring = /home

          [pam]
          pam_verbosity = 2

          [ssh]
          [sudo]
          sudo_provider = ipa
        owner: root
        group: root
        mode: '0600'
      become: true

    - name: Set SSSD file permissions
      ansible.builtin.file:
        path: /etc/sssd/sssd.conf
        mode: '0600'
        owner: root
        group: root
      become: true

- name: "IdM: Create Service Accounts"
  block:
    - name: Create Satellite service account configuration
      ansible.builtin.debug:
        msg: |
          Service Accounts for IdM Integration:

          Satellite:
            User: scenario_satellite-service
            Groups: admin
            Permissions: System registration, subscription management

          AAP:
            User: aap-service
            Groups: admin
            Permissions: Automation execution, credential access

          These will be created after IdM deployment

- name: "IdM: Display Installation Instructions"
  block:
    - name: "Display IdM Setup Summary"
      ansible.builtin.debug:
        msg: |

                   Red Hat Identity Management Ready for Deployment


           IdM Configuration:
             Server FQDN: {{ idm_fqdn | default('idm.' + domain_name | default('example.com')) }}
             Server IP: {{ idm_ip | default(ansible_default_ipv4.address) }}
             Domain: {{ domain_name | default('example.com') }}
             Realm: {{ domain_name | default('EXAMPLE.COM') | upper }}

           Credentials:
             Admin User: {{ idm_admin_user | default('admin') }}
             Directory Manager: cn=Directory Manager

           Services Configured:
             - Kerberos (port 88)
             - LDAP (port 389, 636)
             - DNS (port 53)
             - NTP (port 123)
             - HTTP (port 80, 443)
             - Certificate Authority

           SSSD Configured For:
             - NSS (user/group lookups)
             - PAM (authentication)
             - SSH (public key authentication)
             - SUDO (privilege escalation)

           Configuration Files:
             Kerberos: /etc/krb5.conf
             SSSD: /etc/sssd/sssd.conf
             IdM Vars: /etc/ipa/ipa-install-vars.yml

            To Complete Installation:
             1. ipa-server-install --no-host-dns --setup-dns
                Or manually with: ipa-server-install

             2. Create service users:
                ipa user-add scenario_satellite-service --first Satellite --last Service
                ipa user-add aap-service --first AAP --last Service

             3. Create groups and assign permissions

             4. Configure client systems to use IdM for authentication

          ℹ  Expected Services After Installation:
             - KDC (Key Distribution Center)
             - LDAP Directory
             - DNS Server
             - NTP Server
             - Certificate Authority
             - Web UI on https://{{ idm_fqdn | default('idm.' + domain_name | default('example.com')) }}

handlers:
  - name: restart sssd
    ansible.builtin.systemd:
      name: sssd
      state: restarted
    become: true

  - name: restart krb5
    ansible.builtin.systemd:
      name: krb5kdc
      state: restarted
    become: true
