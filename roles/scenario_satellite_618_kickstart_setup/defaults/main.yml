---
# Default variables for satellite_kickstart_config role
satellite_kickstart_config_enabled: true
satellite_kickstart_config_version: "1.0"
satellite_kickstart_config_timeout: 1200

# Satellite Connection
satellite_url: "https://scenario_satellite.example.com"
satellite_username: "admin"
# satellite_password: use vault!
satellite_validate_ssl: true
satellite_organization: "Default Organization"

# Feature toggles
create_provisioning_templates: true
upload_kickstart_files: true

# Kickstart Template Configuration
kickstart_templates:
  # RHEL 9 BaseOS Template
  - name: "RHEL 9 BaseOS Kickstart (Minimal)"
    description: "RHEL 9 BaseOS minimal installation template for RHIS"
    os_generic: "RHEL 9"
    template_type: "provision"
    snippet: false
    locked: false
    organization: "{{ satellite_organization }}"
    tags: ["rhis", "rhel9", "baseos", "provision"]

  # RHEL 10 BaseOS Template
  - name: "RHEL 10 BaseOS Kickstart (Minimal)"
    description: "RHEL 10 BaseOS minimal installation template for RHIS"
    os_generic: "RHEL 10"
    template_type: "provision"
    snippet: false
    locked: false
    organization: "{{ satellite_organization }}"
    tags: ["rhis", "rhel10", "baseos", "provision"]

  # RHEL 9 BaseOS with AppStream
  - name: "RHEL 9 Full Stack Kickstart"
    description: "RHEL 9 BaseOS + AppStream installation template for RHIS"
    os_generic: "RHEL 9"
    template_type: "provision"
    snippet: false
    locked: false
    organization: "{{ satellite_organization }}"
    tags: ["rhis", "rhel9", "appstack", "provision"]

  # RHEL 10 BaseOS with AppStream
  - name: "RHEL 10 Full Stack Kickstart"
    description: "RHEL 10 BaseOS + AppStream installation template for RHIS"
    os_generic: "RHEL 10"
    template_type: "provision"
    snippet: false
    locked: false
    organization: "{{ satellite_organization }}"
    tags: ["rhis", "rhel10", "appstack", "provision"]

# Kickstart File Storage
kickstart_files_path: "/var/lib/foreman/public/kickstarts"
kickstart_web_url: "{{ satellite_url }}/pub/kickstarts"

# RHEL 9 BaseOS Kickstart Content
rhel9_baseos_minimal_ks: |
  # RHEL 9 BaseOS Minimal Installation Kickstart for RHIS
  # Generated by: Satellite Kickstart Configuration Role
  # Purpose: Minimal RHEL 9 BaseOS installation with Satellite subscription management
  
  # Localization
  lang en_US.UTF-8
  keyboard us
  timezone UTC
  selinux --enforcing
  skipx
  
  # Network Configuration
  # Network device will be determined by anaconda
  network --onboot=yes --bootproto=dhcp --noipv6 --hostname=localhost.localdomain
  
  # Firewall and Services
  firewall --enabled --service=ssh
  authselect --useshadow --passalgo=sha512 --kickstart
  services --enabled=NetworkManager,sshd,chronyd --disabled=cups,postfix,avahi-daemon
  
  # Boot Configuration
  bootloader --location=mbr --timeout=0 --append="quiet"
  
  # Disk Partitioning - Basic LVM configuration
  zerombr
  clearpart --initlabel --all --drives=sda
  
  # Boot partition
  part /boot --fstype=ext4 --size=1024 --ondisk=sda
  
  # EFI partition for UEFI systems
  part /boot/efi --fstype=efi --size=256 --ondisk=sda
  
  # LVM configuration for remaining space
  part pv.01 --fstype=lvmpv --size=1 --grow --ondisk=sda
  volgroup vg_rhel pv.01
  
  # Logical volumes
  logvol swap --vgname=vg_rhel --size=4096 --name=lv_swap
  logvol / --vgname=vg_rhel --size=10240 --name=lv_root --fstype=xfs
  logvol /home --vgname=vg_rhel --size=2048 --name=lv_home --fstype=xfs
  logvol /tmp --vgname=vg_rhel --size=2048 --name=lv_tmp --fstype=xfs
  logvol /var --vgname=vg_rhel --size=5120 --name=lv_var --fstype=xfs
  logvol /var/log --vgname=vg_rhel --size=2048 --name=lv_var_log --fstype=xfs
  logvol /var/log/audit --vgname=vg_rhel --size=1024 --name=lv_audit --fstype=xfs
  
  # User Configuration
  rootpw --lock
  user --name=rhis --groups=wheel --lock
  
  # Installation mode and reboot
  text
  reboot --eject
  
  # Repository configuration - Use Satellite activation key
  # Repositories will be configured via activation key on first boot
  
  # Package Installation
  %packages
  @core
  @base
  @container-management
  
  # Essential utilities
  bash-completion
  net-tools
  tmux
  vim
  chrony
  wget
  curl
  git
  subscription-manager
  insights-client
  
  # System administration
  sudo
  tar
  gzip
  bzip2
  xz
  unzip
  man-pages
  
  # Excludes
  -ntp
  -postfix
  -cups
  -bluez
  %end
  
  # Pre-installation script
  %pre
  # Clear SSH keys to ensure fresh key generation
  rm -rf /etc/ssh/ssh_host_* 2>/dev/null || true
  %end
  
  # Post-installation script
  %post --nochroot
  exec < /dev/tty3 > /dev/tty3
  chvt 3
  (
  echo "Preparing system for Satellite integration_generic..."
  ) 2>&1 | tee /mnt/sysimage/root/install.post.nochroot.log
  chvt 1
  %end
  
  # Post-installation script (in chroot)
  %post
  exec < /dev/tty3 > /dev/tty3
  chvt 3
  (
  # Enable Satellite for updates
  echo "Configuring Satellite for subscription management..."
  
  # System hardening
  echo "Hardening system..."
  /usr/sbin/useradd --create-home --shell /sbin/nologin --uid 174 --comment "Red Hat Insights" insights || true
  
  # Enable chronyd for time synchronization
  systemctl enable --now chronyd
  
  # Configure SSH security
  sed -i 's/^#PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config
  
  # Generate SSH host keys
  ssh-keygen -A
  systemctl enable sshd
  
  # Configure cloud-init for Satellite platform_provisioning
  systemctl enable cloud-init
  systemctl enable cloud-final
  
  # Disable SELinux permissive log spam
  echo "1" > /etc/audit/rules.d/audit.rules
  
  echo "RHEL 9 BaseOS installation completed successfully"
  ) 2>&1 | tee /root/install.post.log
  chvt 1
  %end

