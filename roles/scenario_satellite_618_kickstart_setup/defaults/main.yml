  logvol /home --vgname=vg_rhel --size=2048 --name=lv_home --fstype=xfs
  logvol /tmp --vgname=vg_rhel --size=2048 --name=lv_tmp --fstype=xfs
  logvol /var --vgname=vg_rhel --size=8192 --name=lv_var --fstype=xfs
  logvol /var/log --vgname=vg_rhel --size=2048 --name=lv_var_log --fstype=xfs
  logvol /var/log/audit --vgname=vg_rhel --size=1024 --name=lv_audit --fstype=xfs
  logvol /var/lib/containers --vgname=vg_rhel --size=5120 --name=lv_containers --fstype=xfs
  
  # User Configuration
  rootpw --lock
  user --name=rhis --groups=wheel --lock
  
  # Installation mode and reboot
  text
  reboot --eject
  
  # Package Installation - Full Stack
  %packages
  @core
  @base
  @container-management
  @development-tools
  @system-tools
  @network-tools
  
  # Essential utilities
  bash-completion
  net-tools
  tmux
  vim
  chrony
  wget
  curl
  git
  subscription-manager
  insights-client
  
  # Development and build tools
  gcc
  gcc-c++
  make
  kernel-devel
  perl-devel
  python3-devel
  systemd-devel
  
  # System administration
  sudo
  tar
  gzip
  bzip2
  xz
  unzip
  man-pages
  bind-utils
  nmap-ncat
  tcpdump
  telnet
  
  # Container tools
  podman
  podman-compose
  buildah
  skopeo
  
  # Ansible and automation
  ansible-core
  ansible-runner
  
  # Monitoring and logging
  rsyslog
  systemd-devel
  
  # Excludes
  -ntp
  -postfix
  -cups
  -bluez
  %end
  
  # Pre-installation script
  %pre
  rm -rf /etc/ssh/ssh_host_* 2>/dev/null || true
  %end
  
  # Post-installation script
  %post --nochroot
  exec < /dev/tty3 > /dev/tty3
  chvt 3
  (
  echo "Preparing system for Satellite integration_generic and development..."
  ) 2>&1 | tee /mnt/sysimage/root/install.post.nochroot.log
  chvt 1
  %end
  
  # Post-installation script (in chroot)
  %post
  exec < /dev/tty3 > /dev/tty3
  chvt 3
  (
  echo "Configuring RHEL 9 Full Stack system..."
  
  # Enable services
  systemctl enable --now chronyd
  systemctl enable sshd
  systemctl enable podman
  systemctl enable crond
  
  # Configure SSH
  sed -i 's/^#PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config
  ssh-keygen -A
  
  # Create Insights user
  /usr/sbin/useradd --create-home --shell /sbin/nologin --uid 174 --comment "Red Hat Insights" insights || true
  
  # Enable RHEL repositories
  echo "RHEL 9 Full Stack configuration completed successfully"
  ) 2>&1 | tee /root/install.post.log
  chvt 1
  %end

