---
# IdM (Red Hat Identity Management) Product Role - Wrapper
# Orchestrates all IdM 3.0 deployment and configuration tasks
# Coordinates base, replica, and integration_generic components

- name: "RED HAT IDENTITY MANAGEMENT (IdM) - Initialize"
  ansible.builtin.debug:
    msg: |
      Red Hat Identity Management Deployment
      ========================================
      Version: IdM 3.0+
      Scenario: {{ deployment_scenario | default('undefined') }}
      Platform: {{ deployment_platform | default('undefined') }}
  tags: ["idm", "products"]

- name: "Validate IdM configuration"
  ansible.builtin.assert:
    that:
      - deployment_scenario is defined
      - scenario_config.products is defined
      - "'idm' in scenario_config.products"
    fail_msg: "IdM deployment requires 'idm' in scenario products"
  tags: ["idm", "validate"]

- name: "Execute IdM installation workflow"
  block:
    - name: "Deploy IdM base components"
      ansible.builtin.include_role:
        name: "ansible_dev_node_redhat_products/idm"
        tasks_from: "idm_base/main.yml"
        apply:
          tags: ["idm", "base"]
      tags: ["idm"]

    - name: "Configure IdM replicas (if applicable)"
      ansible.builtin.include_role:
        name: "ansible_dev_node_redhat_products/idm"
        tasks_from: "idm_replica/main.yml"
        apply:
          tags: ["idm", "replica"]
      when: deploy_idm_replicas | default(false)
      tags: ["idm"]

    - name: "Configure IdM integrations"
      ansible.builtin.include_role:
        name: "ansible_dev_node_redhat_products/idm"
        tasks_from: "idm_integration/main.yml"
        apply:
          tags: ["idm", "integration_generic"]
      when: configure_idm_integration | default(true)
      tags: ["idm"]

  rescue:
    - name: "Capture IdM deployment error"
      ansible.builtin.debug:
        msg: |
          IdM deployment encountered an error.
          Review logs for specific failure information.
      tags: ["idm", "error"]

    - name: "IdM deployment failed - detailed error"
      ansible.builtin.fail:
        msg: |
          ❌ IdM DEPLOYMENT FAILED

          Common causes:
          1. DNS/domain configuration issues
          2. Network connectivity problems
          3. Insufficient system resources
          4. Port conflicts (389, 636, 88, 464, etc.)
          5. Directory corruption or conflicts
          6. Kerberos/LDAP protocol issues

          Recovery steps:
          1. Verify DNS resolution: nslookup $(hostname -f)
          2. Confirm network connectivity to all hosts
          3. Check system resources and disk space
          4. Verify ports are available: netstat -tuln
          5. Check for conflicting LDAP/Kerberos services
          6. Review Kerberos configuration

          Check logs above for detailed error information.
  tags: ["idm"]

- name: "IdM deployment completed"
  ansible.builtin.debug:
    msg: "Red Hat Identity Management deployment complete."
  tags: ["idm", "info"]
