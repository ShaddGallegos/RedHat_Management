---
# Default variables for scenario_aap_templates role
scenario_aap_templates_aap_templates_config_enabled: true
scenario_aap_templates_aap_templates_config_version: "1.0"
scenario_aap_templates_aap_templates_config_timeout: 600

# AAP Connection
scenario_aap_templates_aap_url: "https://aap.example.com"
scenario_aap_templates_aap_username: "admin"
# aap_password: use vault!
scenario_aap_templates_aap_password: "{{ aap_password | default('') }}"
scenario_aap_templates_aap_verify_ssl: true

# Templates Organization
scenario_aap_templates_aap_templates_organization: "Default"

# Job Templates
scenario_aap_templates_create_job_templates: true
scenario_aap_templates_job_templates:
  - name: "RHIS_Deploy_Infrastructure"
    description: "Deploy RHIS platform_infrastructure_core"
    inventory: "RHIS_Infrastructure"
    project: "RHIS_Playbooks"
    playbook: "playbooks/deploy_components.yml"
    credential: "RHIS_SSH_Key"
    verbosity: 1
    limit: ""
    skip_tags: ""
    tags: ["rhis", "platform_infrastructure_core", "deploy"]
    extra_vars: {}

  - name: "RHIS_Configure_Satellite"
    description: "Configure Satellite 6.18"
    inventory: "Satellite_Hosts"
    project: "Satellite_Playbooks"
    playbook: "playbooks/satellite_config.yml"
    credential: "RHIS_SSH_Key"
    verbosity: 1
    tags: ["rhis", "scenario_satellite", "config"]
    extra_vars: {}

  - name: "RHIS_Setup_AAP"
    description: "Setup Ansible Automation Platform"
    inventory: "AAP_Controllers"
    project: "AAP_Playbooks"
    playbook: "playbooks/aap_setup.yml"
    credential: "RHIS_SSH_Key"
    verbosity: 1
    tags: ["rhis", "aap", "setup"]
    extra_vars: {}

  - name: "RHIS_Configure_IdM"
    description: "Configure Identity Management"
    inventory: "RHIS_Infrastructure"
    project: "IdM_Playbooks"
    playbook: "playbooks/idm_config.yml"
    credential: "RHIS_SSH_Key"
    vault_credential: "RHIS_Vault"
    verbosity: 1
    tags: ["rhis", "idm", "config"]
    extra_vars: {}

  - name: "RHIS_Provision_Infrastructure"
    description: "Provision platform_infrastructure_core via Libvirt or cloud"
    inventory: "RHIS_Infrastructure"
    project: "Infrastructure_Playbooks"
    playbook: "playbooks/provision.yml"
    credential: "RHIS_SSH_Key"
    verbosity: 1
    ask_inventory: true
    ask_variables: true
    tags: ["rhis", "platform_infrastructure_core", "provision"]
    extra_vars: {}

# Workflow Templates
scenario_aap_templates_create_workflow_templates: true
scenario_aap_templates_workflow_templates:
  - name: "RHIS_Complete_Deployment"
    description: "Complete RHIS deployment workflow"
    organization: "{{ scenario_aap_templates_aap_templates_organization }}"
    tags: ["rhis", "workflow", "complete"]

  - name: "RHIS_Infrastructure_Setup"
    description: "Infrastructure setup and validation"
    organization: "{{ scenario_aap_templates_aap_templates_organization }}"
    tags: ["rhis", "workflow", "platform_infrastructure_core"]

  - name: "RHIS_Product_Deployment"
    description: "Deploy all RHIS products"
    organization: "{{ scenario_aap_templates_aap_templates_organization }}"
    tags: ["rhis", "workflow", "products"]

# Workflow Job Template Nodes (define the workflow steps)
scenario_aap_templates_create_workflow_nodes: true
scenario_aap_templates_workflow_nodes:
  - workflow_template: "RHIS_Complete_Deployment"
    nodes:
      - identifier: "deploy_infrastructure"
        job_template: "RHIS_Deploy_Infrastructure"
        success_nodes:
          - "configure_satellite"
          - "setup_aap"
          - "configure_idm"
          - "provision_infrastructure"
        failure_nodes: []
      - identifier: "configure_satellite"
        job_template: "RHIS_Configure_Satellite"
        success_nodes:
          - "provision_infrastructure"
        failure_nodes: []
      - identifier: "setup_aap"
        job_template: "RHIS_Setup_AAP"
        success_nodes:
          - "provision_infrastructure"
        failure_nodes: []
      - identifier: "configure_idm"
        job_template: "RHIS_Configure_IdM"
        success_nodes:
          - "provision_infrastructure"
        failure_nodes: []
      - identifier: "provision_infrastructure"
        job_template: "RHIS_Provision_Infrastructure"
        success_nodes: []
        failure_nodes: []

# Feature toggles
scenario_aap_templates_aap_templates_validate_connectivity: true
scenario_aap_templates_aap_templates_test_validation: true
scenario_aap_templates_aap_templates_ask_variables: false
