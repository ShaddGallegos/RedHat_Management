---
# Configure AAP Templates
- name: Validate AAP Templates Configuration
  block:
    - name: Authenticate with AAP
      ansible.builtin.uri:
        url: "{{ scenario_aap_templates_aap_url }}/api/v2/auth/token/"
        method: POST
        user: "{{ scenario_aap_templates_aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: "{{ scenario_aap_templates_aap_verify_ssl }}"
      register: aap_auth
      no_log: true

    - name: Extract AAP Token
      ansible.builtin.set_fact:
        aap_token: "{{ aap_auth.json.token }}"
      no_log: true

  when: scenario_aap_templates_aap_templates_config_enabled
  tags: ["aap_templates", "validation"]

- name: Get Organization ID
  ansible.builtin.uri:
    url: "{{ scenario_aap_templates_aap_url }}/api/v2/organizations/?name={{ scenario_aap_templates_aap_templates_organization }}"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_token }}"
    validate_certs: "{{ scenario_aap_templates_aap_verify_ssl }}"
  register: org_response
  no_log: true

- name: Set Organization ID
  ansible.builtin.set_fact:
    aap_organization_id: "{{ org_response.json.results[0].id }}"
  when: org_response.json.results | length > 0
  no_log: true

- name: Configure Job Templates
  block:
    - name: Get Inventory IDs
      ansible.builtin.uri:
        url: "{{ scenario_aap_templates_aap_url }}/api/v2/inventories/?name={{ item.inventory }}&organization={{ aap_organization_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ scenario_aap_templates_aap_verify_ssl }}"
      register: inv_lookup
      loop: "{{ scenario_aap_templates_job_templates }}"
      no_log: true
      when: scenario_aap_templates_create_job_templates

    - name: Get Project IDs
      ansible.builtin.uri:
        url: "{{ scenario_aap_templates_aap_url }}/api/v2/projects/?name={{ item.project }}&organization={{ aap_organization_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ scenario_aap_templates_aap_verify_ssl }}"
      register: proj_lookup
      loop: "{{ scenario_aap_templates_job_templates }}"
      no_log: true
      when: scenario_aap_templates_create_job_templates

    - name: Get Credential IDs
      ansible.builtin.uri:
        url: "{{ scenario_aap_templates_aap_url }}/api/v2/credentials/?name={{ item.credential }}&organization={{ aap_organization_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ scenario_aap_templates_aap_verify_ssl }}"
      register: cred_lookup
      loop: "{{ scenario_aap_templates_job_templates }}"
      no_log: true
      when: scenario_aap_templates_create_job_templates

    - name: Create Job Templates
      ansible.builtin.uri:
        url: "{{ scenario_aap_templates_aap_url }}/api/v2/scenario_aap_templates_job_templates/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ scenario_aap_templates_aap_verify_ssl }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description | default('') }}"
          inventory: "{{ item.inventory_id | default(0) }}"
          project: "{{ item.project_id | default(0) }}"
          playbook: "{{ item.playbook }}"
          credential: "{{ item.credential_id | default(0) }}"
          vault_credential: "{{ item.vault_credential_id | default(null) }}"
          verbosity: "{{ item.verbosity | default(0) }}"
          limit: "{{ item.limit | default('') }}"
          tags: "{{ item.tags | default([]) | join(',') }}"
          skip_tags: "{{ item.skip_tags | default('') }}"
          ask_inventory_on_launch: "{{ item.ask_inventory | default(false) }}"
          ask_variables_on_launch: "{{ item.ask_variables | default(false) }}"
          extra_vars: "{{ item.extra_vars | default({}) | to_nice_json }}"
      register: job_template_results
      loop: "{{ scenario_aap_templates_job_templates }}"
      no_log: true
      when: scenario_aap_templates_create_job_templates

    - name: Display Job Templates Created
      ansible.builtin.debug:
        msg: "Created job template: {{ item.item.name }}"
      loop: "{{ job_template_results.results }}"
      when: scenario_aap_templates_create_job_templates and job_template_results.results is defined

  when: scenario_aap_templates_aap_templates_config_enabled
  tags: ["aap_templates", "job"]

- name: Configure Workflow Templates
  block:
    - name: Create Workflow Templates
      ansible.builtin.uri:
        url: "{{ scenario_aap_templates_aap_url }}/api/v2/workflow_job_templates/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ scenario_aap_templates_aap_verify_ssl }}"
        body_format: json
        body:
          name: "{{ item.name }}"
          description: "{{ item.description | default('') }}"
          organization: "{{ aap_organization_id }}"
      register: workflow_template_results
      loop: "{{ scenario_aap_templates_workflow_templates }}"
      no_log: true
      when: scenario_aap_templates_create_workflow_templates

    - name: Display Workflow Templates Created
      ansible.builtin.debug:
        msg: "Created workflow template: {{ item.item.name }}"
      loop: "{{ workflow_template_results.results }}"
      when: scenario_aap_templates_create_workflow_templates and workflow_template_results.results is defined

  when: scenario_aap_templates_aap_templates_config_enabled
  tags: ["aap_templates", "workflow"]

- name: Test Templates
  block:
    - name: Retrieve All Job Templates
      ansible.builtin.uri:
        url: "{{ scenario_aap_templates_aap_url }}/api/v2/scenario_aap_templates_job_templates/?organization={{ aap_organization_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ scenario_aap_templates_aap_verify_ssl }}"
      register: all_job_templates
      no_log: true

    - name: Retrieve All Workflow Templates
      ansible.builtin.uri:
        url: "{{ scenario_aap_templates_aap_url }}/api/v2/workflow_job_templates/?organization={{ aap_organization_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ scenario_aap_templates_aap_verify_ssl }}"
      register: all_workflow_templates
      no_log: true

    - name: Display Templates Summary
      ansible.builtin.debug:
        msg: |
          Job Templates configured: {{ all_job_templates.json.count }}
          Workflow Templates configured: {{ all_workflow_templates.json.count }}

          Job Template List:
          {% for tmpl in all_job_templates.json.results %}
          - {{ tmpl.name }} (Playbook: {{ tmpl.playbook }})
          {% endfor %}

          Workflow Template List:
          {% for tmpl in all_workflow_templates.json.results %}
          - {{ tmpl.name }}
          {% endfor %}

  when: scenario_aap_templates_aap_templates_config_enabled and scenario_aap_templates_aap_templates_test_validation
  tags: ["aap_templates", "test"]
