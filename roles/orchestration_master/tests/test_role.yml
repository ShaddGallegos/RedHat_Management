---
# Test: orchestration_master role basic functionality
- name: Test orchestration_master role
  hosts: localhost
  gather_facts: false
  vars:
    orchestration_master_enabled: true
    deployment_scenario: "satellite_aap"
    deployment_platform: "libvirt"
  tasks:
    - name: Verify role variables
      assert:
        that:
          - orchestration_master_enabled is defined
          - deployment_scenario is defined
          - deployment_platform is defined
        fail_msg: "Required variables not defined"

    - name: Check scenario validity
      assert:
        that:
          - deployment_scenario in ['satellite_only', 'aap_only', 'idm_only', 'openshift_only', 'satellite_aap', 'satellite_idm', 'satellite_openshift', 'aap_idm', 'aap_openshift', 'idm_openshift', 'satellite_aap_idm', 'satellite_aap_openshift', 'satellite_idm_openshift', 'aap_idm_openshift', 'satellite_aap_idm_openshift']
        fail_msg: "Invalid deployment scenario"
