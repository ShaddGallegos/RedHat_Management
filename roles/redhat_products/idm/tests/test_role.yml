---
# Test: redhat_products/idm role basic functionality
- name: Test IdM role
  hosts: localhost
  gather_facts: false
  vars:
    idm_enabled: true
    idm_version: "3.0"
  tasks:
    - name: Verify role variables
      assert:
        that:
          - idm_enabled is defined
          - idm_version is defined
