---
# Test: scenario_aap_projects role
- name: Test scenario_aap_projects role
  hosts: localhost
  gather_facts: false
  vars:
    aap_projects_config_enabled: true
    aap_url: "https://aap.example.com"
    aap_username: "admin"
  tasks:
    - name: Verify role variables
      ansible.builtin.assert:
        that:
          - aap_projects_config_enabled is defined
          - aap_url is defined
