---
# Prompts Role Defaults
# Variables for platform_infrastructure_core configuration ansible_dev_node_prompts

# Infrastructure Type
ansible_dev_node_prompts_infrastructure_type: 1  # 1=Libvirt, 2=Nutanix, 3=VMware, 4=AWS, 5=GCP, 6=Azure

# Ansible Domain
ansible_dev_node_prompts_ansible_domain: "example.com"

# Libvirt Configuration
ansible_dev_node_prompts_libvirt_host_short_name: "libvirt01"

# External Network (NAT) - Primary/eth0
ansible_dev_node_prompts_libvirt_external_network: "192.168.0.0/24"
ansible_dev_node_prompts_libvirt_external_network_gw: "192.168.0.1"

# Internal Network (Private Services) - Secondary/eth1
ansible_dev_node_prompts_libvirt_internal_network: "10.168.0"
ansible_dev_node_prompts_libvirt_internal_network_subnet: "10.168.0.0/16"
ansible_dev_node_prompts_libvirt_internal_network_gw: "10.168.0.1"

# Node IP Allocation (on internal 10.168.0.0/16)
ansible_dev_node_prompts_libvirt_installer_node_ip: "10.168.0.1"          # installer.<domain> - Gateway & Control Machine
ansible_dev_node_prompts_libvirt_aap_ip: "10.168.0.26"                    # aap.<domain> - Containerized AAP
ansible_dev_node_prompts_libvirt_satellite_ip: "10.168.0.27"              # scenario_satellite.<domain> - TFTP/DHCP/DNS
ansible_dev_node_prompts_libvirt_idm_ip: "10.168.0.28"                    # idm.<domain> - Directory Service

# Node Names
ansible_dev_node_prompts_libvirt_installer_node_short_name: "installer"
ansible_dev_node_prompts_libvirt_aap_node_short_name: "aap"
ansible_dev_node_prompts_libvirt_satellite_node_short_name: "scenario_satellite"
ansible_dev_node_prompts_libvirt_idm_node_short_name: "idm"
