---
# Default variables for scenario_aap_inventories role
scenario_aap_inventories_aap_inventories_config_enabled: true
scenario_aap_inventories_aap_inventories_config_version: "1.0"
scenario_aap_inventories_aap_inventories_config_timeout: 600

# AAP Connection
scenario_aap_inventories_aap_url: "https://aap.example.com"
scenario_aap_inventories_aap_username: "admin"
# aap_password: use vault!
scenario_aap_inventories_aap_verify_ssl: true

# Inventories Organization
scenario_aap_inventories_aap_inventories_organization: "Default"

# Static Inventories
scenario_aap_inventories_create_static_inventories: true
scenario_aap_inventories_static_inventories:
  - name: "RHIS_Infrastructure"
    description: "RHIS platform_infrastructure_core hosts"
    variables:
      ansible_connection: "ssh"
      ansible_user: "ansible"
    tags: ["rhis", "platform_infrastructure_core"]

  - name: "Satellite_Hosts"
    description: "Satellite server inventory"
    variables:
      ansible_connection: "ssh"
    tags: ["rhis", "scenario_satellite"]

  - name: "AAP_Controllers"
    description: "AAP controller nodes"
    variables:
      ansible_connection: "ssh"
    tags: ["rhis", "aap"]

# Dynamic Inventories
scenario_aap_inventories_create_dynamic_inventories: true
scenario_aap_inventories_dynamic_inventories:
  - name: "Satellite_Sync"
    description: "Satellite dynamic inventory"
    source: "scenario_satellite"
    source_vars:
      satellite_host: "scenario_satellite.example.com"
      satellite_credential: "Satellite_API"
      satellite_group_prefix: "satellite_"
    tags: ["rhis", "scenario_satellite", "dynamic"]

  - name: "AWS_Dynamic"
    description: "AWS EC2 inventory"
    source: "aws_ec2"
    source_vars:
      regions:
        - "us-east-1"
      compose:
        ansible_host: "private_ip_address"
    tags: ["rhis", "aws", "dynamic"]

# Inventory Sources
scenario_aap_inventories_create_inventory_sources: true
scenario_aap_inventories_inventory_sources:
  - name: "RHIS_Project_Sync"
    description: "Sync from RHIS project"
    inventory: "RHIS_Infrastructure"
    source: "project"
    source_path: "inventory/hosts"
    overwrite: true
    tags: ["rhis", "source"]

# Feature toggles
scenario_aap_inventories_aap_inventories_validate_connectivity: true
scenario_aap_inventories_aap_inventories_test_imports: true
