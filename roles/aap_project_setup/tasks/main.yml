---
- name: Create AAP project
  awx.awx.project:
- name: "{{ aap_project_name }}"
    description: "{{ aap_project_description }}"
    scm_type: "{{ aap_project_scm_type }}"
    scm_url: "{{ aap_project_scm_url }}"
    scm_branch: "{{ aap_project_scm_branch }}"
    organization: "{{ organization_name }}"
    state: present
    validate_certs: "{{ aap_controller_verify_ssl }}"
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_controller_username }}"
    controller_password: "{{ aap_controller_password }}"

- name: Ensure playbooks are present in project
  ansible.builtin.debug:
    msg: "Playbooks available in project: {{ aap_project_playbooks }}"