---
# Test: scenario_satellite_activation_config role
- name: Test scenario_satellite_activation_config role
  hosts: localhost
  gather_facts: false
  vars:
    satellite_activation_config_enabled: true
    satellite_url: "https://scenario_satellite.example.com"
    satellite_username: "admin"
  tasks:
    - name: Verify role variables
      ansible.builtin.assert:
        that:
          - satellite_activation_config_enabled is defined
          - satellite_url is defined
