---
# Default variables for scenario_satellite_lifecycle_config role
scenario_satellite_lifecycle_config_satellite_lifecycle_config_enabled: true
scenario_satellite_lifecycle_config_satellite_lifecycle_config_version: "1.0"
scenario_satellite_lifecycle_config_satellite_lifecycle_config_timeout: 1800

# Satellite Connection
scenario_satellite_lifecycle_config_satellite_url: "https://scenario_satellite.example.com"
scenario_satellite_lifecycle_config_satellite_username: "admin"
# satellite_password: use vault!
scenario_satellite_lifecycle_config_satellite_validate_ssl: true
scenario_satellite_lifecycle_config_satellite_organization: "Default Organization"

# Feature toggles
scenario_satellite_lifecycle_config_create_lifecycle_environments: true
scenario_satellite_lifecycle_config_create_content_views: true
scenario_satellite_lifecycle_config_create_filters: false
scenario_satellite_lifecycle_config_publish_content_views: false
scenario_satellite_lifecycle_config_promote_content_views: false

# Lifecycle Environments
scenario_satellite_lifecycle_config_lifecycle_environments:
  - name: "Development"
    description: "Development environment"
    prior: "Library"
    organization: "{{ scenario_satellite_lifecycle_config_satellite_organization }}"
    tags: ["rhis", "development"]

  - name: "Staging"
    description: "Staging/QA environment"
    prior: "Development"
    organization: "{{ scenario_satellite_lifecycle_config_satellite_organization }}"
    tags: ["rhis", "staging"]

  - name: "Production"
    description: "Production environment"
    prior: "Staging"
    organization: "{{ scenario_satellite_lifecycle_config_satellite_organization }}"
    tags: ["rhis", "production"]

# Content Views
scenario_satellite_lifecycle_config_content_views:
  - name: "RHIS_BaseOS"
    description: "RHIS Base OS Content View"
    organization: "{{ scenario_satellite_lifecycle_config_satellite_organization }}"
    repositories:
      - "RHEL 9 BaseOS"
      - "RHEL 9 AppStream"
    tags: ["rhis", "baseos"]

  - name: "RHIS_AppStack"
    description: "RHIS Application Stack Content View"
    organization: "{{ scenario_satellite_lifecycle_config_satellite_organization }}"
    repositories:
      - "RHEL 9 AppStream"
    tags: ["rhis", "appstack"]

  - name: "RHIS_RHEL10_BaseOS"
    description: "RHIS RHEL 10 Base OS Content View"
    organization: "{{ scenario_satellite_lifecycle_config_satellite_organization }}"
    repositories:
      - "RHEL 10 BaseOS"
      - "RHEL 10 AppStream"
    tags: ["rhis", "rhel10", "baseos"]

# Content View Filters
scenario_satellite_lifecycle_config_content_view_filters:
  - name: "Security_Errata"
    content_view: "RHIS_BaseOS"
    organization: "{{ scenario_satellite_lifecycle_config_satellite_organization }}"
    description: "Filter for security errata only"
    filter_type: "erratum"
    inclusion: true
    tags: ["rhis", "filter", "security"]

  - name: "Exclude_Deprecated"
    content_view: "RHIS_AppStack"
    organization: "{{ scenario_satellite_lifecycle_config_satellite_organization }}"
    description: "Exclude deprecated packages"
    filter_type: "package"
    inclusion: false
    tags: ["rhis", "filter"]

# Composite Content Views
scenario_satellite_lifecycle_config_composite_content_views:
  - name: "RHIS_Complete_Stack"
    description: "Complete RHIS content stack"
    organization: "{{ scenario_satellite_lifecycle_config_satellite_organization }}"
    auto_publish: true
    components:
      - name: "RHIS_BaseOS"
        latest: true
      - name: "RHIS_AppStack"
        latest: true
    tags: ["rhis", "composite"]

# Content View Versions to Promote
scenario_satellite_lifecycle_config_promote_versions:
  - content_view: "RHIS_BaseOS"
    version: 1
    promote_to:
      - "Development"
      - "Staging"
    organization: "{{ scenario_satellite_lifecycle_config_satellite_organization }}"

# Validation
scenario_satellite_lifecycle_config_satellite_lifecycle_validate_connectivity: true
scenario_satellite_lifecycle_config_satellite_lifecycle_test_promotion: false
