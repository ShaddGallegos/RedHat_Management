---
# Installation Method: TFTP
# Configures network-based installation via TFTP boot

- name: "Configure Installation Method: TFTP"
  ansible.builtin.debug:
    msg: |
      Installation Method: TFTP
      ==========================
      Method: Network boot via TFTP
      Boot Method: PXE over TFTP
      Use Case: Network-based bare metal platform_provisioning
  tags: ["installation", "tftp", "config"]

- name: "Validate TFTP installation setup"
  block:
    - name: "Check TFTP server status"
      ansible.builtin.shell: systemctl is-active tftp || systemctl is-active tftpd-hpa
      register: tftp_status
      changed_when: false
      failed_when: false

    - name: "Verify TFTP boot files"
      ansible.builtin.stat:
        path: "/var/lib/tftpboot/pxelinux.0"
      register: tftp_bootfile
      changed_when: false
      failed_when: false

    - name: "Assert TFTP is configured"
      ansible.builtin.assert:
        that:
          - "tftp_status.rc == 0"
          - "tftp_bootfile.stat.exists or 'TFTP boot files will be configured' is not defined"
        fail_msg: "TFTP server not running or boot files missing. Ensure TFTP service is running and pxelinux.0 exists."
      ignore_errors: true

  tags: ["installation", "tftp", "validate"]

- name: "TFTP installation method configured"
  ansible.builtin.debug:
    msg: "TFTP installation method ready for network platform_provisioning"
  tags: ["installation", "tftp", "info"]
