---
- name: Determine OS family and set package list
  set_fact:
    libvirt_packages: "{{ (['libvirt*','qemu*','virt-manager','kvm*','python3-libvirt','cloud-utils'] if ansible_facts['os_family'] == 'RedHat' else (['libvirt-daemon-system','libvirt-clients','qemu-kvm','virt-manager','python3-libvirt','cloud-utils'] if ansible_facts['os_family'] == 'Debian' else ['libvirt*','qemu*','virt-manager','kvm*','python3-libvirt','cloud-utils'])) }}"
  when: ansible_facts is defined

- name: Try to install libvirt and virtualization packages via package manager (use globs on RedHat)
  ansible.builtin.shell: "dnf install -y {{ libvirt_packages | join(' ') }} --skip-broken --allowerasing --best"
  register: libvirt_install_shell
  failed_when: false
  ignore_errors: yes

- name: Check if bridge 'virbr0' already exists on host
  stat:
    path: /sys/class/net/virbr0
  register: virbr0_stat

- name: Set external bridge name (use alternate if virbr0 exists)
  set_fact:
    libvirt_external_bridge: "{{ 'external_nat' if (virbr0_stat.stat is not defined) or (not virbr0_stat.stat.exists) else 'external_nat_alt' }}"
  when: virbr0_stat is defined

- name: Ensure libvirt service is enabled and running
  ansible.builtin.service:
    name: libvirtd
    state: started
    enabled: true

- name: Ensure default network is active (ignore failures)
  ansible.builtin.command: virsh net-start default
  args:
    warn: false
  register: libvirt_net_start
  failed_when: false

- name: Render external libvirt network XML
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/networks/external_nat.xml.j2"
    dest: "/tmp/libvirt-external.xml"

- name: Define external libvirt network (idempotent)
  ansible.builtin.command: virsh net-define /tmp/libvirt-external.xml
  register: define_external
  failed_when: define_external.rc not in [0,1]

- name: Start external libvirt network
  ansible.builtin.command: virsh net-start external
  register: start_external
  failed_when: start_external.rc not in [0,1]

- name: Autostart external libvirt network
  ansible.builtin.command: virsh net-autostart external
  ignore_errors: true

- name: Render internal libvirt network XML
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/networks/internal_priv.xml.j2"
    dest: "/tmp/libvirt-internal.xml"

- name: Define internal libvirt network (idempotent)
  ansible.builtin.command: virsh net-define /tmp/libvirt-internal.xml
  register: define_internal
  failed_when: define_internal.rc not in [0,1]

- name: Start internal libvirt network
  ansible.builtin.command: virsh net-start internal_priv
  register: start_internal
  failed_when: start_internal.rc not in [0,1]

- name: Autostart internal libvirt network
  ansible.builtin.command: virsh net-autostart internal_priv
  ignore_errors: true

- name: Check for persistent setup marker file
  stat:
    path: /var/lib/rhm/platform_libvirt_setup_done
  register: rhm_marker_stat

- name: Set persistent marker fact
  set_fact:
    platform_libvirt_setup_done: "{{ rhm_marker_stat.stat.exists | default(false) }}"

- block:
  - name: Determine OS family and set package list
    set_fact:
      libvirt_packages: "{{ (['libvirt*','qemu*','virt-manager','kvm*','python3-libvirt','cloud-utils'] if ansible_facts['os_family'] == 'RedHat' else ([
  'libvirt-daemon-system','libvirt-clients','qemu-kvm','virt-manager','python3-libvirt','cloud-utils'] if ansible_facts['os_family'] == 'Debian' else ['libvirt*','qemu*','virt-manager','kvm*','python3-libvirt','cloud-utils'])) }}"
    when: ansible_facts is defined

  - name: Try to install libvirt and virtualization packages via package manager (use globs on RedHat)
    ansible.builtin.shell: "dnf install -y {{ libvirt_packages | join(' ') }} --skip-broken --allowerasing --best"
    register: libvirt_install_shell
    failed_when: false
    ignore_errors: yes

  - name: Check if bridge 'virbr0' already exists on host
    stat:
      path: /sys/class/net/virbr0
    register: virbr0_stat

  - name: Set external bridge name (use alternate if virbr0 exists)
    set_fact:
      libvirt_external_bridge: "{{ 'external_nat' if (virbr0_stat.stat is not defined) or (not virbr0_stat.stat.exists) else 'external_nat_alt' }}"
    when: virbr0_stat is defined

  - name: Ensure libvirt service is enabled and running
    ansible.builtin.service:
      name: libvirtd
      state: started
      enabled: true

  - name: Ensure default network is active (ignore failures)
    ansible.builtin.command: virsh net-start default
    args:
      warn: false
    register: libvirt_net_start
    failed_when: false

  - name: Render external libvirt network XML
    ansible.builtin.template:
      src: "{{ playbook_dir }}/../templates/networks/external_nat.xml.j2"
      dest: "/tmp/libvirt-external.xml"

  - name: Define external libvirt network (idempotent)
    ansible.builtin.command: virsh net-define /tmp/libvirt-external.xml
    register: define_external
    failed_when: define_external.rc not in [0,1]

  - name: Start external libvirt network
    ansible.builtin.command: virsh net-start external
    register: start_external
    failed_when: start_external.rc not in [0,1]

  - name: Autostart external libvirt network
    ansible.builtin.command: virsh net-autostart external
    ignore_errors: true

  - name: Render internal libvirt network XML
    ansible.builtin.template:
      src: "{{ playbook_dir }}/../templates/networks/internal_priv.xml.j2"
      dest: "/tmp/libvirt-internal.xml"

  - name: Define internal libvirt network (idempotent)
    ansible.builtin.command: virsh net-define /tmp/libvirt-internal.xml
    register: define_internal
    failed_when: define_internal.rc not in [0,1]

  - name: Start internal libvirt network
    ansible.builtin.command: virsh net-start internal_priv
    register: start_internal
    failed_when: start_internal.rc not in [0,1]

  - name: Autostart internal libvirt network
    ansible.builtin.command: virsh net-autostart internal_priv
    ignore_errors: true

  - name: Create persistent marker file to indicate setup completed
    ansible.builtin.file:
      path: /var/lib/rhm
      state: directory
      owner: root
      group: root
      mode: '0755'
    become: true

  - name: Touch marker file
    ansible.builtin.file:
      path: /var/lib/rhm/platform_libvirt_setup_done
      state: touch
      owner: root
      group: root
      mode: '0644'
    become: true

  - name: Write ansible facts file for persistent recognition
    ansible.builtin.copy:
      dest: /etc/ansible/facts.d/rhm.fact
      content: '{"platform_libvirt_setup_done": true}'
      mode: '0644'
    become: true
  when: not (platform_libvirt_setup_done | default(false))
