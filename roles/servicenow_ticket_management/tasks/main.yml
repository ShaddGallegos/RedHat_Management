---
# Servicenow Ticket Management Tasks

- name: Validate required ServiceNow variables
  ansible.builtin.assert:
    that:
      - servicenow_instance is defined
      - servicenow_username is defined
      - servicenow_password is defined
      - servicenow_table is defined
    fail_msg: "Missing required ServiceNow connection variables."

- name: Create ServiceNow incident ticket
  servicenow.itsm.incident:
    instance: "{{ servicenow_instance }}"
    username: "{{ servicenow_username }}"
    password: "{{ servicenow_password }}"
    state: new
    caller: "{{ servicenow_ticket_caller_id | default('automation') }}"
    short_description: "{{ servicenow_ticket_short_description }}"
    description: "{{ servicenow_ticket_description }}"
    category: "{{ servicenow_ticket_category }}"
    impact: "{{ servicenow_ticket_impact }}"
    urgency: "{{ servicenow_ticket_urgency }}"
    assignment_group: "{{ servicenow_ticket_assignment_group }}"
    timeout: "{{ servicenow_api_timeout | default(30) }}"
    verify_ssl: "{{ servicenow_verify_ssl | default(false) }}"
  register: snow_ticket
  delegate_to: localhost

- name: Log ticket creation
  ansible.builtin.debug:
    msg: "ServiceNow ticket {{ snow_ticket.record.number | default('N/A') }} created for {{ inventory_hostname }}."

- name: Update ServiceNow ticket (example)
  servicenow.itsm.incident:
    instance: "{{ servicenow_instance }}"
    username: "{{ servicenow_username }}"
    password: "{{ servicenow_password }}"
    state: updated
    number: "{{ snow_ticket.record.number }}"
    work_notes: "Ticket updated by Ansible automation at {{ ansible_date_time.iso8601 }}"
    timeout: "{{ servicenow_api_timeout | default(30) }}"
    verify_ssl: "{{ servicenow_verify_ssl | default(false) }}"
  when: snow_ticket is defined and snow_ticket.record.number is defined
  delegate_to: localhost

- name: Close ServiceNow ticket
  servicenow.itsm.incident:
    instance: "{{ servicenow_instance }}"
    username: "{{ servicenow_username }}"
    password: "{{ servicenow_password }}"
    state: closed
    number: "{{ snow_ticket.record.number }}"
    close_code: "Solved (Permanently)"
    close_notes: "Issue resolved by Ansible automation."
    timeout: "{{ servicenow_api_timeout | default(30) }}"
    verify_ssl: "{{ servicenow_verify_ssl | default(false) }}"
  when: snow_ticket is defined and snow_ticket.record.number is defined
  delegate_to: localhost

- name: Log ticket closure
  ansible.builtin.debug:
    msg: "ServiceNow ticket {{ snow_ticket.record.number | default('N/A') }} closed for {{ inventory_hostname }}."
