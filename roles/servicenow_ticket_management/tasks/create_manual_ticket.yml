---
# Tasks to create a manual intervention ticket

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - hostname is defined
      - ticket_type is defined
      - usage_percent is defined
      - servicenow_instance is defined
      - servicenow_username is defined
      - servicenow_password is defined
    fail_msg: "Missing required variables for manual ServiceNow ticket creation"

- name: Create ServiceNow incident for manual intervention
  servicenow.itsm.incident:
    instance: "{{ servicenow_instance }}"
    username: "{{ servicenow_username }}"
    password: "{{ servicenow_password }}"
    state: new
    caller: "{{ user_email | default('ansible@example.com') }}"
    short_description: "MANUAL ACTION REQUIRED: {{ ticket_type }} on {{ hostname }} ({{ usage_percent }}% used)"
    description: "Manual intervention required for {{ hostname }} - {{ ticket_type }}. Current usage: {{ usage_percent }}%."
    priority: "{{ priority | default('2') }}"
    urgency: "{{ urgency | default('2') }}"
    category: "{{ servicenow_ticket_category | default('Infrastructure') }}"
    subcategory: "Storage"
    assignment_group: "{{ servicenow_ticket_assignment_group | default('Linux Admins') }}"
  register: snow_ticket
  delegate_to: localhost

- name: Log manual ticket creation
  ansible.builtin.debug:
    msg: "Manual intervention ticket {{ snow_ticket.record.number | default('N/A') }} created for {{ hostname }}."
