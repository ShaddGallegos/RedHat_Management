---
# Deployment scenarios and platform configurations
# Single source of truth for all 15 scenarios and 7 platforms

# ============================================================================
# DEPLOYMENT SCENARIOS (15 total)
# ============================================================================

rhis_scenarios:
  # Single Product Scenarios (4)
  satellite_only:
    name: "Satellite Only"
    description: "Red Hat Satellite 6.18 for systems management and platform_provisioning"
    products: ["scenario_satellite"]
    tags: ["scenario_satellite", "single-product"]
    min_resources:
      cpu: 8
      memory: 32
      disk: 500
    rhel_versions: ["rhel-9", "rhel-10"]

  aap_only:
    name: "AAP Only"
    description: "Ansible Automation Platform 2.6 for automation and ansible_dev_node_orchestration"
    products: ["aap"]
    tags: ["aap", "single-product"]
    min_resources:
      cpu: 8
      memory: 16
      disk: 100
    rhel_versions: ["rhel-9", "rhel-10"]

  idm_only:
    name: "IdM Only"
    description: "Red Hat Identity Management 3.0 for identity and access management"
    products: ["idm"]
    tags: ["idm", "single-product"]
    min_resources:
      cpu: 4
      memory: 8
      disk: 50
    rhel_versions: ["rhel-9", "rhel-10"]

  openshift_only:
    name: "OpenShift Only"
    description: "OpenShift 4.21+ for container ansible_dev_node_orchestration"
    products: ["scenario_openshift"]
    tags: ["scenario_openshift", "single-product"]
    min_resources:
      cpu: 16
      memory: 64
      disk: 300
    rhel_versions: ["rhel-9", "rhel-10"]

  # Dual Product Scenarios (6)
  satellite_aap:
    name: "Satellite + AAP"
    description: "Inventory management with automation platform"
    products: ["scenario_satellite", "aap"]
    integrations: ["satellite_aap"]
    tags: ["scenario_satellite", "aap", "multi-product", "integration_generic"]
    min_resources:
      cpu: 16
      memory: 48
      disk: 600
    rhel_versions: ["rhel-9", "rhel-10"]

  satellite_idm:
    name: "Satellite + IdM"
    description: "Inventory management with centralized identity"
    products: ["scenario_satellite", "idm"]
    integrations: ["satellite_idm"]
    tags: ["scenario_satellite", "idm", "multi-product", "integration_generic"]
    min_resources:
      cpu: 12
      memory: 40
      disk: 550
    rhel_versions: ["rhel-9", "rhel-10"]

  satellite_openshift:
    name: "Satellite + OpenShift"
    description: "Inventory management with container platform"
    products: ["scenario_satellite", "scenario_openshift"]
    integrations: ["satellite_openshift"]
    tags: ["scenario_satellite", "scenario_openshift", "multi-product", "integration_generic"]
    min_resources:
      cpu: 24
      memory: 96
      disk: 800
    rhel_versions: ["rhel-9", "rhel-10"]

  aap_idm:
    name: "AAP + IdM"
    description: "Automation platform with centralized identity"
    products: ["aap", "idm"]
    integrations: ["aap_idm"]
    tags: ["aap", "idm", "multi-product", "integration_generic"]
    min_resources:
      cpu: 12
      memory: 24
      disk: 150
    rhel_versions: ["rhel-9", "rhel-10"]

  aap_openshift:
    name: "AAP + OpenShift"
    description: "Automation platform with container ansible_dev_node_orchestration"
    products: ["aap", "scenario_openshift"]
    integrations: ["aap_openshift"]
    tags: ["aap", "scenario_openshift", "multi-product", "integration_generic"]
    min_resources:
      cpu: 24
      memory: 80
      disk: 400
    rhel_versions: ["rhel-9", "rhel-10"]

  idm_openshift:
    name: "IdM + OpenShift"
    description: "Centralized identity with container platform"
    products: ["idm", "scenario_openshift"]
    integrations: ["idm_openshift"]
    tags: ["idm", "scenario_openshift", "multi-product", "integration_generic"]
    min_resources:
      cpu: 20
      memory: 72
      disk: 350
    rhel_versions: ["rhel-9", "rhel-10"]

  # Triple Product Scenarios (4)
  satellite_aap_idm:
    name: "Satellite + AAP + IdM"
    description: "Complete management stack with inventory, automation, and identity"
    products: ["scenario_satellite", "aap", "idm"]
    integrations: ["satellite_aap", "satellite_idm", "aap_idm"]
    tags: ["scenario_satellite", "aap", "idm", "multi-product", "integration_generic", "management_stack"]
    min_resources:
      cpu: 20
      memory: 56
      disk: 650
    rhel_versions: ["rhel-9", "rhel-10"]

  satellite_aap_openshift:
    name: "Satellite + AAP + OpenShift"
    description: "Inventory, automation, and container platform"
    products: ["scenario_satellite", "aap", "scenario_openshift"]
    integrations: ["satellite_aap", "satellite_openshift", "aap_openshift"]
    tags: ["scenario_satellite", "aap", "scenario_openshift", "multi-product", "integration_generic"]
    min_resources:
      cpu: 32
      memory: 112
      disk: 900
    rhel_versions: ["rhel-9", "rhel-10"]

  satellite_idm_openshift:
    name: "Satellite + IdM + OpenShift"
    description: "Inventory, identity, and container platform"
    products: ["scenario_satellite", "idm", "scenario_openshift"]
    integrations: ["satellite_idm", "satellite_openshift", "idm_openshift"]
    tags: ["scenario_satellite", "idm", "scenario_openshift", "multi-product", "integration_generic"]
    min_resources:
      cpu: 28
      memory: 104
      disk: 850
    rhel_versions: ["rhel-9", "rhel-10"]

  aap_idm_openshift:
    name: "AAP + IdM + OpenShift"
    description: "Automation, identity, and container platform"
    products: ["aap", "idm", "scenario_openshift"]
    integrations: ["aap_idm", "aap_openshift", "idm_openshift"]
    tags: ["aap", "idm", "scenario_openshift", "multi-product", "integration_generic"]
    min_resources:
      cpu: 28
      memory: 88
      disk: 450
    rhel_versions: ["rhel-9", "rhel-10"]

  # Full Stack (1)
  full_stack:
    name: "FULL STACK"
    description: "All products integrated - Satellite + AAP + IdM + OpenShift"
    products: ["scenario_satellite", "aap", "idm", "scenario_openshift"]
    integrations: ["satellite_aap", "satellite_idm", "satellite_openshift", "aap_idm", "aap_openshift", "idm_openshift"]
    tags: ["scenario_satellite", "aap", "idm", "scenario_openshift", "full-stack", "integration_generic", "scenario_ansible_cmdb_core"]
    min_resources:
      cpu: 40
      memory: 120
      disk: 1000
    rhel_versions: ["rhel-9", "rhel-10"]
    features:
      - "unified_authentication"
      - "centralized_inventory"
      - "complete_automation"
      - "container_management"
      - "infrastructure_visibility"
    repositories:
      enable:
        - "rhel-server-rhscl"
        - "scenario_satellite-tools"
        - "rhel-server-optional"
        - "rhel-fast-datapath"
      optional:
        - "rhel-server-devtools"
        - "rhel-server-debug"

# ============================================================================
# PLATFORM CONFIGURATIONS (7 total)
# ============================================================================

rhis_platforms:
  libvirt:
    name: "LibVirt (KVM)"
    description: "Local KVM virtualization for development and testing"
    provisioning_type: "local"
    provisioner_role: "platform_libvirt_vm_provisioner"
    networking: "libvirt-network"
    storage: "local-disk"
    features:
      - "fast_provisioning"
      - "local_storage"
      - "network_isolation"
    requirements:
      - "libvirt-daemon"
      - "qemu-kvm"
      - "virt-manager"
    tags: ["libvirt", "local", "development"]

  baremetal:
    name: "Bare Metal"
    description: "Physical servers with PXE and DHCP platform_provisioning"
    provisioning_type: "pxe"
    provisioner_role: "platform_baremetal_provisioner"
    networking: "physical-network"
    storage: "direct-attached"
    features:
      - "bare_metal"
      - "high_performance"
      - "direct_storage"
    requirements:
      - "dhcp-server"
      - "tftp-server"
      - "pxe-bootloader"
    tags: ["baremetal", "enterprise", "production"]

  aws:
    name: "Amazon Web Services"
    description: "AWS EC2 instances with auto-scaling"
    provisioning_type: "cloud_api"
    provisioner_role: "platform_infrastructure_manager"
    networking: "vpc"
    storage: "ebs"
    features:
      - "auto_scaling"
      - "elastic_ips"
      - "security_groups"
      - "cloud_monitoring"
    requirements:
      - "aws-cli"
      - "boto3"
      - "aws_credentials"
    tags: ["aws", "cloud", "production"]

  azure:
    name: "Microsoft Azure"
    description: "Azure VMs with managed disks"
    provisioning_type: "cloud_api"
    provisioner_role: "platform_infrastructure_manager"
    networking: "vnet"
    storage: "managed-disk"
    features:
      - "load_balancing"
      - "availability_sets"
      - "network_security_groups"
      - "azure_monitor"
    requirements:
      - "azure-cli"
      - "azure-sdk"
      - "azure_credentials"
    tags: ["azure", "cloud", "production"]

  gcp:
    name: "Google Cloud Platform"
    description: "GCP Compute Engine instances"
    provisioning_type: "cloud_api"
    provisioner_role: "platform_infrastructure_manager"
    networking: "vpc"
    storage: "persistent-disk"
    features:
      - "load_balancing"
      - "instance_groups"
      - "firewall_rules"
      - "cloud_monitoring"
    requirements:
      - "gcloud"
      - "google-cloud-sdk"
      - "gcp_credentials"
    tags: ["gcp", "cloud", "production"]

  platform_vmware:
    name: "VMware vSphere"
    description: "VMware VMs with vSAN storage"
    provisioning_type: "cloud_api"
    provisioner_role: "platform_infrastructure_manager"
    networking: "vsphere-network"
    storage: "vsan"
    features:
      - "vm_templates"
      - "snapshots"
      - "resource_pools"
      - "vsphere_ha"
    requirements:
      - "pyvmomi"
      - "platform_vmware-credentials"
    tags: ["platform_vmware", "enterprise", "production"]

  platform_nutanix:
    name: "Nutanix HCI"
    description: "Nutanix Acropolis with AHV hypervisor"
    provisioning_type: "cloud_api"
    provisioner_role: "platform_infrastructure_manager"
    networking: "platform_nutanix-network"
    storage: "platform_nutanix-storage"
    features:
      - "hyperconverged"
      - "self_healing"
      - "distributed_storage"
      - "nutanix_prism"
    requirements:
      - "platform_nutanix-cli"
      - "platform_nutanix-sdk"
      - "nutanix_credentials"
    tags: ["platform_nutanix", "enterprise", "production"]

# ============================================================================
# PRODUCT DEFINITIONS
# ============================================================================

rhis_products:
  scenario_satellite:
    name: "Red Hat Satellite 6.18"
    version: "6.18"
    tags: ["scenario_satellite"]
    roles: ["ansible_dev_node_redhat_products/scenario_satellite"]

  aap:
    name: "Ansible Automation Platform 2.6"
    version: "2.6"
    tags: ["aap"]
    roles: ["ansible_dev_node_redhat_products/aap"]

  idm:
    name: "Red Hat Identity Management 3.0"
    version: "3.0"
    tags: ["idm"]
    roles: ["ansible_dev_node_redhat_products/idm"]

  scenario_openshift:
    name: "OpenShift 4.21+"
    version: "4.21"
    tags: ["scenario_openshift"]
    roles: ["ansible_dev_node_redhat_products/scenario_openshift"]

# Valid values for validation
rhis_valid_scenarios: "{{ rhis_scenarios.keys() | list }}"
rhis_valid_platforms: "{{ rhis_platforms.keys() | list }}"

# Deployment metadata
rhis_deployment_version: "2.0.0"
rhis_deployment_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
