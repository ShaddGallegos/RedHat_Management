---
# ansible_dev_node_orchestration_master role - Main task file
# Consolidated from ansible_dev_node_orchestration.yml, prompts_and_config.yml, and scenario_configs.yml
# Implements 7-phase RHIS deployment with scenario and platform selection

- name: "Display RHIS Deployment Banner"
  ansible.builtin.debug:
    msg: |
      ╔════════════════════════════════════════════════════════╗
      ║   RHIS Orchestration - Red Hat Infrastructure Standard ║
      ║   Version: {{ rhis_deployment_version }}                      ║
      ║   Timestamp: {{ rhis_deployment_timestamp }}               ║
      ╚════════════════════════════════════════════════════════╝

      Deployment Configuration:
        Scenario: {{ deployment_scenario | default('unset') }}
        Platform: {{ deployment_platform | default('unset') }}
        OS: {{ deployment_os | default('unset') }}
        Installation Method: {{ install_method | default('oemdrv') }}
  tags: ["always"]

# ============================================================================
# CONFIGURATION VALIDATION AND LOADING
# ============================================================================

- name: "Block: Configuration Validation and Loading"
  block:
    - name: "Validate deployment scenario"
      ansible.builtin.assert:
        that:
          - deployment_scenario is defined
          - deployment_scenario in rhis_valid_scenarios
        fail_msg: "Invalid scenario '{{ deployment_scenario }}'. Valid options: {{ rhis_valid_scenarios | join(', ') }}"
      tags: ["always", "validate"]

    - name: "Validate deployment platform"
      ansible.builtin.assert:
        that:
          - deployment_platform is defined
          - deployment_platform in rhis_valid_platforms
        fail_msg: "Invalid platform '{{ deployment_platform }}'. Valid options: {{ rhis_valid_platforms | join(', ') }}"
      tags: ["always", "validate"]

    - name: "Validate OS selection"
      ansible.builtin.assert:
        that:
          - deployment_os is defined
          - deployment_os in ["rhel-9", "rhel-10"]
        fail_msg: "Invalid OS '{{ deployment_os }}'. Valid options: rhel-9, rhel-10"
      tags: ["always", "validate"]

    - name: "Load deployment configuration from file"
      include_vars:
        ansible.builtin.file: "{{ lookup('env', 'HOME') }}/.ansible/conf/deployment_config.yml"
        name: deployment_config
      when: lookup('env', 'HOME') | default('') != ''
      ignore_errors: yes
      tags: ["config", "load"]

    - name: "Set scenario configuration"
      ansible.builtin.set_fact:
        scenario_config: "{{ rhis_scenarios[deployment_scenario] }}"
        platform_config: "{{ rhis_platforms[deployment_platform] }}"
      tags: ["config", "setup"]

    - name: "Display scenario details"
      ansible.builtin.debug:
        msg: |
          Scenario: {{ scenario_config.name }}
          Description: {{ scenario_config.description }}
          Products: {{ scenario_config.products | join(', ') }}
          Integrations: {{ scenario_config.integrations | default([]) | join(', ') or 'None' }}

          Platform: {{ platform_config.name }}
          Provisioning: {{ platform_config.provisioning_type }}
          Storage: {{ platform_config.storage }}

          Minimum Resources:
            CPU: {{ scenario_config.min_resources.cpu }} cores
            Memory: {{ scenario_config.min_resources.memory }} GB
            Disk: {{ scenario_config.min_resources.disk }} GB
      tags: ["always", "info"]
  tags: ["config", "validate"]

# ============================================================================
# PHASE 1: Initialize Ansible Developer Node
# ============================================================================

- name: "PHASE 1 - Initialize Ansible Developer Node"
  block:
    - name: "Setup ansible developer host environment"
      ansible.builtin.include_role:
        name: "ansible_dev_node_deployment_setup"
        tasks_from: "main"
      vars:
        target_platform: "{{ deployment_platform }}"
      tags: ["phase1", "setup"]

    - name: "Install platform-specific requirements"
      ansible.builtin.include_role:
        name: "platform_infrastructure_manager"
        tasks_from: "validate_requirements"
      vars:
        required_platform: "{{ platform_config.provisioning_type }}"
        required_tools: "{{ platform_config.requirements }}"
      tags: ["phase1", "setup", "requirements"]

    - name: "Initialize credential management"
      ansible.builtin.include_role:
        name: "ansible_dev_node_configuration_manager"
        tasks_from: "setup_credentials"
      tags: ["phase1", "credentials"]
  tags: ["phase1"]
  when: "'phase1' in ansible_run_tags or 'always' in ansible_run_tags"

# ============================================================================
# PHASE 2: Platform Infrastructure Preparation
# ============================================================================

- name: "PHASE 2 - Platform Infrastructure Preparation"
  block:
    - name: "Prepare platform platform_infrastructure_core"
      ansible.builtin.include_role:
        name: "platform_infrastructure_manager"
        tasks_from: "prepare_{{ deployment_platform }}"
      tags: ["phase2", "prepare"]

    - name: "Configure platform networking"
      ansible.builtin.include_role:
        name: "platform_infrastructure_manager"
        tasks_from: "networking"
      vars:
        network_type: "{{ platform_config.networking }}"
      tags: ["phase2", "networking"]

    - name: "Setup installation method: {{ install_method | default('oemdrv') }}"
      ansible.builtin.include_role:
        name: "platform_infrastructure_manager"
        tasks_from: "install_method_{{ install_method | default('oemdrv') }}"
      tags: ["phase2", "install_method"]
  tags: ["phase2"]
  when: "'phase2' in ansible_run_tags or 'always' in ansible_run_tags"

# ============================================================================
# PHASE 3: Generate Dynamic Inventory
# ============================================================================

- name: "PHASE 3 - Generate Dynamic Inventory"
  block:
    - name: "Build dynamic inventory"
      ansible.builtin.include_role:
        name: "ansible_dev_node_inventory_generator"
        tasks_from: "generate"
      vars:
        scenario: "{{ deployment_scenario }}"
        platform: "{{ deployment_platform }}"
        products_to_deploy: "{{ scenario_config.products }}"
      tags: ["phase3", "inventory"]

    - name: "Validate generated inventory"
      ansible.builtin.include_role:
        name: "ansible_dev_node_inventory_generator"
        tasks_from: "validate"
      tags: ["phase3", "validate"]
  tags: ["phase3"]
  when: "'phase3' in ansible_run_tags or 'always' in ansible_run_tags"

# ============================================================================
# PHASE 4: Product Deployment (Conditional)
# ============================================================================

- name: "PHASE 4A - Deploy Satellite 6.18"
  block:
    - name: "Provision Satellite"
      ansible.builtin.include_role:
        name: "{{ platform_config.provisioner_role }}"
        tasks_from: "provision_satellite"
      tags: ["phase4a", "scenario_satellite", "provision"]

    - name: "Configure Satellite base OS"
      ansible.builtin.include_role:
        name: "os_generic"
        tasks_from: "configure_rhel_base"
      vars:
        target_os: "{{ deployment_os }}"
      tags: ["phase4a", "scenario_satellite", "os_generic"]

    - name: "Install Satellite 6.18"
      ansible.builtin.include_role:
        name: "ansible_dev_node_redhat_products/scenario_satellite"
        tasks_from: "install"
      tags: ["phase4a", "scenario_satellite", "install"]

    - name: "Post-configuration for Satellite"
      ansible.builtin.include_role:
        name: "ansible_dev_node_redhat_products/scenario_satellite"
        tasks_from: "postconfigure"
      tags: ["phase4a", "scenario_satellite", "postconfigure"]
  tags: ["phase4a", "scenario_satellite"]
  when: "'scenario_satellite' in scenario_config.products and ('phase4a' in ansible_run_tags or 'phase4' in ansible_run_tags or 'always' in ansible_run_tags)"

- name: "PHASE 4B - Deploy AAP 2.6"
  block:
    - name: "Provision AAP"
      ansible.builtin.include_role:
        name: "{{ platform_config.provisioner_role }}"
        tasks_from: "provision_aap"
      tags: ["phase4b", "aap", "provision"]

    - name: "Configure AAP base OS"
      ansible.builtin.include_role:
        name: "os_generic"
        tasks_from: "configure_rhel_base"
      vars:
        target_os: "{{ deployment_os }}"
      tags: ["phase4b", "aap", "os_generic"]

    - name: "Install AAP 2.6"
      ansible.builtin.include_role:
        name: "ansible_dev_node_redhat_products/aap"
        tasks_from: "install"
      tags: ["phase4b", "aap", "install"]

    - name: "Post-configuration for AAP"
      ansible.builtin.include_role:
        name: "ansible_dev_node_redhat_products/aap"
        tasks_from: "postconfigure"
      tags: ["phase4b", "aap", "postconfigure"]
  tags: ["phase4b", "aap"]
  when: "'aap' in scenario_config.products and ('phase4b' in ansible_run_tags or 'phase4' in ansible_run_tags or 'always' in ansible_run_tags)"

- name: "PHASE 4C - Deploy IdM 3.0"
  block:
    - name: "Provision IdM"
      ansible.builtin.include_role:
        name: "{{ platform_config.provisioner_role }}"
        tasks_from: "provision_idm"
      tags: ["phase4c", "idm", "provision"]

    - name: "Configure IdM base OS"
      ansible.builtin.include_role:
        name: "os_generic"
        tasks_from: "configure_rhel_base"
      vars:
        target_os: "{{ deployment_os }}"
      tags: ["phase4c", "idm", "os_generic"]

    - name: "Install IdM 3.0"
      ansible.builtin.include_role:
        name: "ansible_dev_node_redhat_products/idm"
        tasks_from: "install"
      tags: ["phase4c", "idm", "install"]

    - name: "Post-configuration for IdM"
      ansible.builtin.include_role:
        name: "ansible_dev_node_redhat_products/idm"
        tasks_from: "postconfigure"
      tags: ["phase4c", "idm", "postconfigure"]
  tags: ["phase4c", "idm"]
  when: "'idm' in scenario_config.products and ('phase4c' in ansible_run_tags or 'phase4' in ansible_run_tags or 'always' in ansible_run_tags)"

- name: "PHASE 4D - Deploy OpenShift"
  block:
    - name: "Provision OpenShift"
      ansible.builtin.include_role:
        name: "{{ platform_config.provisioner_role }}"
        tasks_from: "provision_openshift"
      tags: ["phase4d", "scenario_openshift", "provision"]

    - name: "Configure OpenShift base OS"
      ansible.builtin.include_role:
        name: "os_generic"
        tasks_from: "configure_rhel_base"
      vars:
        target_os: "{{ deployment_os }}"
      tags: ["phase4d", "scenario_openshift", "os_generic"]

    - name: "Install OpenShift"
      ansible.builtin.include_role:
        name: "ansible_dev_node_redhat_products/scenario_openshift"
        tasks_from: "install"
      tags: ["phase4d", "scenario_openshift", "install"]

    - name: "Post-configuration for OpenShift"
      ansible.builtin.include_role:
        name: "ansible_dev_node_redhat_products/scenario_openshift"
        tasks_from: "postconfigure"
      tags: ["phase4d", "scenario_openshift", "postconfigure"]
  tags: ["phase4d", "scenario_openshift"]
  when: "'scenario_openshift' in scenario_config.products and ('phase4d' in ansible_run_tags or 'phase4' in ansible_run_tags or 'always' in ansible_run_tags)"

# ============================================================================
# PHASE 5: Configure Integrations
# ============================================================================

- name: "PHASE 5 - Configure Integrations"
  block:
    - name: "Configure integrations for scenario"
      ansible.builtin.include_role:
        name: "integration_generic"
        tasks_from: "{{ item }}"
      loop: "{{ scenario_config.integrations | default([]) }}"
      tags: ["phase5", "integrate"]
  tags: ["phase5"]
  when: "scenario_config.integrations is defined and ('phase5' in ansible_run_tags or 'always' in ansible_run_tags)"

# ============================================================================
# PHASE 6: Setup Ansible-CMDB
# ============================================================================

- name: "PHASE 6 - Setup Ansible-CMDB"
  block:
    - name: "Setup Ansible-CMDB"
      ansible.builtin.include_role:
        name: "scenario_ansible_cmdb_core"
        tasks_from: "main"
      when: "'scenario_satellite' in scenario_config.products"
      tags: ["phase6", "scenario_ansible_cmdb_core"]

    - name: "Populate CMDB with inventory"
      ansible.builtin.include_role:
        name: "scenario_ansible_cmdb_core"
        tasks_from: "populate"
      tags: ["phase6", "scenario_ansible_cmdb_core", "populate"]
  tags: ["phase6"]
  when: "'phase6' in ansible_run_tags or 'always' in ansible_run_tags"

# ============================================================================
# PHASE 7: Validate Deployment
# ============================================================================

- name: "PHASE 7 - Validate Deployment"
  block:
    - name: "Run health checks"
      ansible.builtin.include_role:
        name: "ansible_dev_node_support"
        tasks_from: "health_check"
      tags: ["phase7", "validate"]

    - name: "Validate integrations"
      ansible.builtin.include_role:
        name: "ansible_dev_node_support"
        tasks_from: "validate_integrations"
      tags: ["phase7", "validate"]

    - name: "Generate deployment report"
      ansible.builtin.include_role:
        name: "ansible_dev_node_support"
        tasks_from: "deployment_report"
      vars:
        scenario_deployed: "{{ deployment_scenario }}"
        platform_used: "{{ deployment_platform }}"
      tags: ["phase7", "validate", "report"]
  tags: ["phase7"]
  when: "'phase7' in ansible_run_tags or 'always' in ansible_run_tags"

# ============================================================================
# DEPLOYMENT COMPLETION
# ============================================================================

- name: "Display Deployment Completion Summary"
  ansible.builtin.debug:
    msg: |
      ╔════════════════════════════════════════════════════════╗
      ║                 DEPLOYMENT COMPLETE                     ║
      ╚════════════════════════════════════════════════════════╝

      Deployment Details:
        Scenario: {{ deployment_scenario }}
        Platform: {{ deployment_platform }}
        OS: {{ deployment_os }}
        Timestamp: {{ rhis_deployment_timestamp }}

      Deployed Products:
        {% for product in scenario_config.products %}
        - {{ rhis_products[product].name }}
        {% endfor %}

      Next Steps:
        1. Review deployment logs: logs/deployment_{{ rhis_deployment_timestamp }}.log
        2. Access deployed products via Web UI
        3. Configure integrations as needed
        4. Run post-deployment validation

      Documentation: See docs/deployment/ for guides
  tags: ["always"]
