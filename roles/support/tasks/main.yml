---
# Support Role - Wrapper
# Orchestrates all support and testing tasks
# Includes preflight checks, testing, and reporting

- name: "SUPPORT TASKS - Initialize"
  ansible.builtin.debug:
    msg: |
      Support and Validation Tasks
      ==============================
      Scenario: {{ deployment_scenario | default('undefined') }}
      Platform: {{ deployment_platform | default('all') }}
  tags: ["support", "always"]

- name: "Execute preflight validation tests"
  ansible.builtin.include_role:
    name: "support"
    tasks_from: "preflight_tests/main.yml"
    apply:
      tags: ["support", "preflight"]
  when: run_preflight_checks | default(true)
  tags: ["support", "preflight"]

- name: "Execute ansible-cmdb setup (if needed)"
  ansible.builtin.include_role:
    name: "cmdb"
    tasks_from: "setup/merged_main.yml"
    apply:
      tags: ["support", "cmdb"]
  when: configure_cmdb | default(false)
  tags: ["support"]

- name: "Execute backup and restore procedures (if needed)"
  ansible.builtin.include_role:
    name: "support"
    tasks_from: "backup_restore/main.yml"
    apply:
      tags: ["support", "backup"]
  when: backup_and_restore | default(false)
  tags: ["support"]

- name: "Execute testing tasks (if needed)"
  ansible.builtin.include_role:
    name: "support"
    tasks_from: "testing/main.yml"
    apply:
      tags: ["support", "testing"]
  when: run_tests | default(false)
  tags: ["support"]

- name: "Support tasks completed"
  tags: ["support"]
  block:
    - name: "Validate support tasks successful"
      ansible.builtin.debug:
        msg: "Support validation and setup complete."
      tags: ["support", "info"]

  rescue:
    - name: "Support tasks failed - detailed error"
      ansible.builtin.fail:
        msg: |
          ❌ SUPPORT TASKS FAILED

          Common causes:
          1. Preflight checks failed
          2. Testing framework issues
          3. Insufficient permissions
          4. Service connectivity problems
          5. Backup/restore operation failure

          Recovery steps:
          1. Review preflight check results
          2. Verify test framework availability
          3. Confirm required permissions
          4. Check service connectivity
          5. Verify backup storage and permissions

          Check logs above for detailed error information.
      tags: ["support"]
