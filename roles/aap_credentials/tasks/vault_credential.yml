---
- name: Create Vault credential in AAP
  awx.awx.credential:
- name: "Ansible Vault Credential"
    description: "Ansible Vault password for encrypted files"
    organization: "{{ organization_name }}"
    credential_type: "Vault"
    inputs:
    vault_password: "{{ lookup('env', 'ANSIBLE_VAULT_PASSWORD') }}"
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_controller_username }}"
    controller_password: "{{ vault_aap_controller_password }}"
    validate_certs: "{{ aap_controller_verify_ssl }}"
    state: present
