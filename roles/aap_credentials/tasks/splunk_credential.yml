---
- name: Create Splunk HEC credential in AAP
  awx.awx.credential:
- name: "Splunk HEC Credential"
    description: "Credentials for Splunk HTTP Event Collector"
    organization: "{{ organization_name }}"
    credential_type: "Splunk HEC"
    inputs:
    host: "{{ splunk_host }}"
    port: "{{ splunk_port }}"
    token: "{{ vault_splunk_token }}"
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_controller_username }}"
    controller_password: "{{ vault_aap_controller_password }}"
    validate_certs: "{{ aap_controller_verify_ssl }}"
    state: present
