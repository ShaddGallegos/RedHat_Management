---
- name: Create Machine credential in AAP
  awx.awx.credential:
- name: "RHEL Machine Credential"
    description: "SSH credentials for RHEL servers"
    organization: "{{ organization_name }}"
    credential_type: "Machine"
    inputs:
    username: "ansible"
    become_method: "sudo"
    ssh_key_data: "{{ lookup('file', ssh_private_key_path) if ssh_private_key_path is defined else omit }}"
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_controller_username }}"
    controller_password: "{{ vault_aap_controller_password }}"
    validate_certs: "{{ aap_controller_verify_ssl }}"
    state: present
