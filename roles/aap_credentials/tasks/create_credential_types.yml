---
- name: Create ServiceNow custom credential type
  awx.awx.credential_type:
- name: "ServiceNow API"
    description: "ServiceNow API credentials"
    kind: cloud
    inputs:
    fields:
    - id: instance
      type: string
      label: ServiceNow Instance
    - id: username
      type: string
      label: Username
    - id: password
      type: string
      label: Password
      secret: true
      required:
      - instance
      - username
      - password
    injectors:
    env:
    SNOW_INSTANCE: "{{ '{{' }} instance {{ '}}' }}"
    SNOW_USER: "{{ '{{' }} username {{ '}}' }}"
    SNOW_PASS: "{{ '{{' }} password {{ '}}' }}"
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_controller_username }}"
    controller_password: "{{ vault_aap_controller_password }}"
    validate_certs: "{{ aap_controller_verify_ssl }}"
    state: present

- name: Create Nutanix custom credential type
  awx.awx.credential_type:
- name: "Nutanix Prism"
    description: "Nutanix Prism Central credentials"
    kind: cloud
    inputs:
    fields:
    - id: host
      type: string
      label: Prism Central Host
    - id: username
      type: string
      label: Username
    - id: password
      type: string
      label: Password
      secret: true
    - id: port
      type: string
      label: Port
      default: "9440"
    - id: validate_certs
      type: boolean
      label: Validate SSL Certificates
      required:
      - host
      - username
      - password
    injectors:
      env:
      NUTANIX_HOST: "{{ '{{' }} host {{ '}}' }}"
      NUTANIX_USER: "{{ '{{' }} username {{ '}}' }}"
      NUTANIX_PASS: "{{ '{{' }} password {{ '}}' }}"
      NUTANIX_PORT: "{{ '{{' }} port {{ '}}' }}"
      NUTANIX_VALIDATE_CERTS: "{{ '{{' }} validate_certs {{ '}}' }}"
      controller_host: "{{ aap_controller_host }}"
      controller_username: "{{ aap_controller_username }}"
      controller_password: "{{ vault_aap_controller_password }}"
      validate_certs: "{{ aap_controller_verify_ssl }}"
      state: present

- name: Create Splunk HEC custom credential type
  awx.awx.credential_type:
- name: "Splunk HEC"
   description: "Splunk HTTP Event Collector"
   kind: cloud
   inputs:
   fields:
   - id: host
     type: string
     label: Splunk Host
   - id: port
     type: string
     label: HEC Port
     default: "8088"

   - id: token
     type: string
     label: HEC Token
     secret: true
     required:
     - host
     - token
  injectors:
    env:
    SPLUNK_HOST: "{{ '{{' }} host {{ '}}' }}"
    SPLUNK_PORT: "{{ '{{' }} port {{ '}}' }}"
    SPLUNK_TOKEN: "{{ '{{' }} token {{ '}}' }}"
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_controller_username }}"
    controller_password: "{{ vault_aap_controller_password }}"
    validate_certs: "{{ aap_controller_verify_ssl }}"
    state: present
