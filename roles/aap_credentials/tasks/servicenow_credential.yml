---
- name: Create ServiceNow credential in AAP
  awx.awx.credential:
- name: "ServiceNow API Credential"
    description: "Credentials for ServiceNow API integration"
    organization: "{{ organization_name }}"
    credential_type: "ServiceNow API"
    inputs:
    instance: "{{ snow_instance }}"
    username: "{{ snow_username }}"
    password: "{{ vault_snow_password }}"
    controller_host: "{{ aap_controller_host }}"
    controller_username: "{{ aap_controller_username }}"
    controller_password: "{{ vault_aap_controller_password }}"
    controller_validate_certs: "{{ aap_controller_verify_ssl }}"
    state: present
