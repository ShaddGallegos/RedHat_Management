---
# AAP Credentials Role Defaults
credentials_to_create:
- name: "ServiceNow API Credential"
   credential_type: "servicenow"
   inputs:
   instance: "{{ snow_instance }}"
   username: "{{ snow_username }}"
   password: "{{ vault_snow_password }}"
 
- name: "Nutanix Prism Credential"
   credential_type: "nutanix"
   inputs:
   host: "{{ nutanix_host }}"
   username: "{{ nutanix_username }}"
   password: "{{ vault_nutanix_password }}"
   port: "{{ nutanix_port }}"
   validate_certs: "{{ nutanix_validate_certs }}"
 
- name: "Splunk HEC Credential"
   credential_type: "splunk_hec"
   inputs:
   host: "{{ splunk_host }}"
   port: "{{ splunk_port }}"
   token: "{{ vault_splunk_token }}"
 
- name: "RHEL Machine Credential"
   credential_type: "machine"
   inputs:
   username: "ansible"
   become_method: "sudo"
 
- name: "Vault Password Credential"
   credential_type: "vault"
   inputs:
   vault_password: "{{ vault_password }}"
