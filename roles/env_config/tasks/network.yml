---
# Example: Prompt for network configuration for Libvirt integration
- name: Prompt for external network device
  vars_prompt:
    - name: external_device
      prompt: "Enter external ethernet device (e.g., eth0)"
      private: no
    - name: external_type
      prompt: "Enter external network type (e.g., NAT)"
      private: no
- name: Prompt for internal network device
  vars_prompt:
    - name: internal_device
      prompt: "Enter internal ethernet device (e.g., eth1)"
      private: no
    - name: internal_subnet
      prompt: "Enter internal subnet (default: 10.168.0.0/16)"
      private: no
      default: "10.168.0.0/16"
- name: Write network config to defaults/main.yml
  template:
    src: network_defaults.j2
    dest: "{{ role_path }}/defaults/main.yml"
