---
# TFTP Boot Server Role
# Sets up TFTP server to serve ISOs and OEMDRV for network installations
# Serves files from PROJECT_ROOT/files/ directory

- name: Display TFTP Server Setup Header
  ansible.builtin.debug:
    msg: |

               Setting Up TFTP Boot Server for Network Installations


- name: Verify TFTP prerequisites
  block:
    - name: Check if tftp-server is installed
      ansible.builtin.package:
        name: tftp-server
        state: present
      become: yes

    - name: Install tftp-server package
      ansible.builtin.yum:
        name: tftp-server
        state: present
      become: yes
      when: ansible_os_family == "RedHat"

- name: Configure TFTP Server
  block:
    - name: Create TFTP boot directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      become: yes
      loop:
        - /var/lib/tftpboot
        - /var/lib/tftpboot/pxelinux.cfg
        - /var/lib/tftpboot/images
        - /var/lib/tftpboot/iso

    - name: Copy ISO files from files/ to TFTP directory
      ansible.builtin.shell: |
        if [ -d "{{ project_root }}/files" ] && [ -f "{{ project_root }}/files"/*.iso ]; then
          cp -v "{{ project_root }}/files"/*.iso /var/lib/tftpboot/iso/
          chmod 644 /var/lib/tftpboot/iso/*.iso
          echo "ISO files copied successfully"
        else
          echo "No ISO files found in {{ project_root }}/files/"
        fi
      register: iso_copy_result
      become: yes
      changed_when: "'copied' in iso_copy_result.stdout"

    - name: Copy OEMDRV files from files/ to TFTP directory
      ansible.builtin.shell: |
        if [ -d "{{ project_root }}/files" ] && [ -f "{{ project_root }}/files"/OEMDRV* ]; then
          cp -v "{{ project_root }}/files"/OEMDRV* /var/lib/tftpboot/
          chmod 644 /var/lib/tftpboot/OEMDRV*
          echo "OEMDRV files copied successfully"
        else
          echo "No OEMDRV files found in {{ project_root }}/files/"
        fi
      register: oemdrv_copy_result
      become: yes
      changed_when: "'copied' in oemdrv_copy_result.stdout"

    - name: Create symlink from files to TFTP for dynamic access
      ansible.builtin.file:
        src: "{{ project_root }}/files"
        dest: /var/lib/tftpboot/project-files
        state: link
      become: yes

- name: Start and Enable TFTP Service
  block:
    - name: Enable TFTP socket
      ansible.builtin.systemd:
        name: tftp.socket
        enabled: yes
        state: started
      become: yes

    - name: Verify TFTP service is running
      ansible.builtin.systemd:
        name: tftp.socket
        state: started
      become: yes

    - name: Configure firewall for TFTP (if firewalld is active)
      ansible.posix.firewalld:
        ansible.builtin.service: tftp
        permanent: yes
        immediate: yes
        state: enabled
      become: yes
      when:
        - ansible_os_family == "RedHat"
        - tftp_enable_firewall | default(true)
      ignore_errors: yes

- name: Create TFTP Boot Configuration Files
  block:
    - name: Create DHCP boot menu configuration
      ansible.builtin.template:
        src: pxelinux.cfg.j2
        dest: /var/lib/tftpboot/pxelinux.cfg/default
        mode: '0644'
      become: yes
      vars:
        tftp_server_ip: "{{ tftp_server_ip | default(ansible_default_ipv4.address) }}"
        iso_list: "{{ lookup('fileglob', project_root + '/files/*.iso', wantlist=True) | map('basename') | list }}"

    - name: Create boot menu HTML for web access
      ansible.builtin.template:
        src: boot_menu.html.j2
        dest: /var/lib/tftpboot/index.html
        mode: '0644'
      become: yes
      vars:
        iso_list: "{{ lookup('fileglob', project_root + '/files/*.iso', wantlist=True) | map('basename') | list }}"

- name: Display TFTP Server Information
  block:
    - name: Get network configuration
      ansible.builtin.debug:
        msg: "Server IPs: {{ ansible_all_ipv4_addresses | join(', ') }}"
      changed_when: false
      register: host_ips

    - name: Get TFTP root contents
      find:
        paths: /var/lib/tftpboot
        recurse: yes
        file_type: file
      register: tftp_files
      become: yes

    - name: Display TFTP Server Status
      ansible.builtin.debug:
        msg: |

          ============================================================
                      TFTP BOOT SERVER CONFIGURED
          ============================================================

          Status:              ACTIVE
          Service:             tftp.socket (xinetd)
          Root Directory:      /var/lib/tftpboot
          Server IP:           {{ host_ips.stdout_lines[0] | default('IP detection failed') }}
          Server Port:         69/UDP

          Directories Created:
            - /var/lib/tftpboot          (root)
            - /var/lib/tftpboot/iso      (ISO files)
            - /var/lib/tftpboot/images   (boot images)
            - /var/lib/tftpboot/pxelinux.cfg (PXE boot configs)

          Symbolic Links:
            - /var/lib/tftpboot/project-files -> {{ project_root }}/files

          Available Files in TFTP ({{ tftp_files.matched }} files):
          {% for file in tftp_files.files %}
            - {{ file.path | regex_replace('^/var/lib/tftpboot/', '') }}
          {% endfor %}

          How to Use:

          1. NETWORK BOOT via DHCP/PXE:
             Configure your DHCP server to point to this TFTP server
             for network boot operations.

          2. MANUAL TFTP ACCESS:
             tftp {{ host_ips.stdout_lines[0].split()[0] | default('SERVER_IP') }}
             > get iso/RHEL-10-x86_64-dvd.iso

          3. FROM FILES DIRECTORY:
             Any ISO or OEMDRV file in {{ project_root }}/files/
             will be automatically available via TFTP at:
             tftp://{{ host_ips.stdout_lines[0].split()[0] | default('SERVER_IP') }}/iso/filename.iso
             tftp://{{ host_ips.stdout_lines[0].split()[0] | default('SERVER_IP') }}/OEMDRV

          4. FIREWALL RULES:
             TFTP (port 69/UDP) has been opened in firewalld
             (if firewalld is active)

          ============================================================

- name: Create monitoring script
  ansible.builtin.copy:
    dest: /usr/local/bin/tftp-server-status
    mode: '0755'
    content: |
      #!/bin/bash
      # TFTP Server Status and Monitoring Script

      echo "TFTP Server Status"
      echo "==================="
      systemctl status tftp.socket
      echo ""
      echo "TFTP Root Directory Contents:"
      ls -lah /var/lib/tftpboot/
      echo ""
      echo "ISO Files Available:"
      ls -lah /var/lib/tftpboot/iso/
      echo ""
      echo "OEMDRV Files:"
      ls -lah /var/lib/tftpboot/OEMDRV* 2>/dev/null || echo "None found"
  become: yes

- name: Create update script for syncing files
  ansible.builtin.copy:
    dest: /usr/local/bin/tftp-sync-files
    mode: '0755'
    content: |
      #!/bin/bash
      # Sync ISO and OEMDRV files from project files/ to TFTP

      PROJECT_ROOT="${1:-{{ project_root }}}"
      TFTP_ROOT="/var/lib/tftpboot"

      if [ ! -d "$PROJECT_ROOT/files" ]; then
          echo "Error: $PROJECT_ROOT/files directory not found"
          exit 1
      fi

      echo "Syncing files from $PROJECT_ROOT/files to $TFTP_ROOT..."

      # Sync ISOs
      if ls "$PROJECT_ROOT"/files/*.iso 1> /dev/null 2>&1; then
          cp -v "$PROJECT_ROOT"/files/*.iso "$TFTP_ROOT/iso/"
          chmod 644 "$TFTP_ROOT/iso"/*.iso
          echo "ISO files synced"
      fi

      # Sync OEMDRV
      if ls "$PROJECT_ROOT"/files/OEMDRV* 1> /dev/null 2>&1; then
          cp -v "$PROJECT_ROOT"/files/OEMDRV* "$TFTP_ROOT/"
          chmod 644 "$TFTP_ROOT"/OEMDRV*
          echo "OEMDRV files synced"
      fi

      echo "Sync complete!"
      tftp-server-status
  become: yes
