---
# Configuration Manager Role - Wrapper
# Orchestrates credential and configuration management tasks
# Routes to appropriate configuration subroles

- name: "CONFIGURATION MANAGEMENT - Initialize"
  ansible.builtin.debug:
    msg: |
      Configuration Management
      ==========================
      Scenario: {{ deployment_scenario | default('undefined') }}
      Managing credentials and environment setup
  tags: ["configuration", "always"]

- name: "Execute credential setup and management"
  ansible.builtin.include_role:
    name: "ansible_dev_node_configuration_manager"
    tasks_from: "setup_credentials"
    apply:
      tags: ["configuration", "credentials"]
  tags: ["configuration"]

- name: "Configuration management completed"
  ansible.builtin.debug:
    msg: "Credentials and configuration setup complete."
  tags: ["configuration", "info"]
