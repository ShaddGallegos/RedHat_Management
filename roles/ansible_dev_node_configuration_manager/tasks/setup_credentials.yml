---
# Configuration Manager Role
# Handles vault loading, credential management, and deployment configuration persistence
# Consolidated from prompts_and_config.yml utilities

- name: "Setup Credentials Management"
  block:
    - name: "Create credential directory (only if explicitly enabled)"
      ansible.builtin.file:
        path: "{{ ansible_user_dir }}/.ansible/conf"
        state: directory
        mode: "0700"
      when: use_local_env | default(false) | bool
      tags: ["credentials", "setup"]

    - name: "Check for existing vault file"
      stat:
        path: "{{ ansible_user_dir }}/.ansible/conf/env.yml"
      register: vault_stat
      tags: ["credentials", "load"]

    - name: "Load existing vault file (only if explicitly enabled)"
      include_vars:
        ansible.builtin.file: "{{ ansible_user_dir }}/.ansible/conf/env.yml"
        name: vault_config
      when: vault_stat.stat.exists and use_local_env | default(false) | bool
      no_log: true
      tags: ["credentials", "load"]

    - name: "Create new vault file if not exists (only if explicitly enabled)"
      ansible.builtin.template:
        src: vault_template.yml.j2
        dest: "{{ ansible_user_dir }}/.ansible/conf/env.yml"
        mode: "0600"
        force: no
      when: not vault_stat.stat.exists and (use_local_env | default(false) | bool)
      tags: ["credentials", "create"]

    - name: "Encrypt vault file with ansible-vault (only if explicitly enabled)"
      ansible.builtin.command: >
        ansible-vault encrypt {{ ansible_user_dir }}/.ansible/conf/env.yml
        --vault-password-file={{ ansible_user_dir }}/.ansible/conf/.vault_pass
      register: vault_encrypt
      changed_when: "'already encrypted' not in vault_encrypt.stderr"
      failed_when: false
      when: use_local_env | default(false) | bool
      tags: ["credentials", "encrypt"]

  tags: ["credentials"]

- name: "Setup Deployment Configuration"
  block:
    - name: "Check for existing deployment config"
      stat:
        path: "{{ ansible_user_dir }}/.ansible/conf/deployment_config.yml"
      register: deploy_config_stat
      tags: ["config", "load"]

    - name: "Load existing deployment config"
      include_vars:
        ansible.builtin.file: "{{ ansible_user_dir }}/.ansible/conf/deployment_config.yml"
        name: deployment_config
      when: deploy_config_stat.stat.exists
      tags: ["config", "load"]

    - name: "Create default deployment config"
      ansible.builtin.copy:
        content: |
          ---
          # RHIS Deployment Configuration
          # Auto-generated on first run
          # Edit to change deployment parameters

          deployment_scenario: "{{ deployment_scenario | default('full_stack') }}"
          deployment_platform: "{{ deployment_platform | default('libvirt') }}"
          deployment_os: "{{ deployment_os | default('rhel-9') }}"
          install_method: "{{ install_method | default('oemdrv') }}"

          # Deployment metadata
          deployment_timestamp: "{{ ansible_date_time.iso8601 }}"
          deployment_version: "2.0.0"

          # Feature flags
          enable_cmdb: true
          enable_integrations: true
          enable_validation: true
        dest: "{{ ansible_user_dir }}/.ansible/conf/deployment_config.yml"
        mode: "0600"
        force: no
      tags: ["config", "create"]

  tags: ["config"]

- name: "Load Vault Variables"
  block:
    - name: "Load vault-encrypted environment file (only if explicitly enabled)"
      include_vars:
        ansible.builtin.file: "{{ ansible_user_dir }}/.ansible/conf/env.yml"
        name: vault_credentials
      when: use_local_env | default(false) | bool
      ignore_errors: true
      no_log: true
      tags: ["vault", "load"]

    - name: "Set vault-based facts (only when vault loaded)"
      set_fact:
        cdn_username: "{{ vault_credentials.cdn_username | default('') }}"
        cdn_password: "{{ vault_credentials.cdn_password | default('') }}"
        rh_offline_token: "{{ vault_credentials.rh_offline_token | default('') }}"
      when: use_local_env | default(false) | bool
      no_log: true
      tags: ["vault", "facts"]

  tags: ["vault"]

- name: "Validate Required Credentials"
  block:
    - name: "Check Red Hat credentials (when using local vault)"
      assert:
        that:
          - cdn_username is defined
          - cdn_username != ''
          - cdn_password is defined
          - cdn_password != ''
        fail_msg: "Red Hat CDN credentials not configured in local vault. Set `use_local_env=true` and ensure ~/.ansible/conf/env.yml is populated and vaulted."
      when: use_local_env | default(false) | bool
      tags: ["validate", "credentials"]

  tags: ["validate"]
