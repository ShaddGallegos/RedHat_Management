---
- ansible.builtin.stat: null
- name: Check if running on RHEL
  path: /etc/redhat-release
  register: rhel_check
- ansible.builtin.debug: null
  msg: 'Detected: {{ ansible_distribution }} {{ ansible_distribution_version }}'
- name: Display RHEL version
  when: rhel_check.stat.exists
- ansible.builtin.command: ansible-galaxy --version
  changed_when: false
  failed_when: false
- name: Verify ansible-galaxy is installed
  register: galaxy_check
- ansible.builtin.fail: null
  msg: ansible-galaxy not found. Please install Ansible first.
- name: Fail if ansible-galaxy not found
  when: galaxy_check.rc!= 0
- ansible.builtin.command: grep -q "console.redhat.com" ansible.cfg
  args: null
  changed_when: false
  chdir: '{{ playbook_dir }}'
  failed_when: false
- name: Check ansible.cfg for Red Hat Automation Hub configuration
  register: hub_config_check
- ansible.builtin.debug: null
  msg:
  - 'WARNING: Red Hat Automation Hub not configured in ansible.cfg'
  - 'To configure:'
  - '1. Get token: https://console.redhat.com/ansible/automation-hub/token'
  - '2. Add to ansible.cfg:'
  - ' [galaxy]'
  - ' server_list = automation_hub, community'
  - ' [galaxy_server.automation_hub]'
  - ' url=https://console.redhat.com/api/automation-hub/'
  - ' token=YOUR_TOKEN'
- name: Display warning if Automation Hub not configured
  when: hub_config_check.rc!= 0
- ansible.builtin.command: ansible-galaxy collection install {{ item }} --force
  changed_when: redhat_install.rc == 0
  failed_when: false
  loop: '{{ redhat_collections }}'
- name: Install Red Hat Certified Collections
  register: redhat_install
- ansible.builtin.command: ansible-galaxy collection install {{ item }} --force
  changed_when: community_install.rc == 0
  loop: '{{ community_collections }}'
- name: Install Community Collections
  register: community_install
- ansible.builtin.command: ansible-galaxy collection list | grep -E 'redhat\.|servicenow\.|ansible\.controller'
  changed_when: false
  failed_when: false
- name: Verify Red Hat Collections installation
  register: redhat_verify
- ansible.builtin.debug: null
  msg: '{{ redhat_verify.stdout_lines }}'
- name: Display installed Red Hat Collections
  when: redhat_verify.rc == 0
- ansible.builtin.command: ansible-galaxy collection list | grep -E 'community\.|nutanix\.|ansible\.eda'
  changed_when: false
  failed_when: false
- name: Verify Community Collections installation
  register: community_verify
- ansible.builtin.debug: null
  msg: '{{ community_verify.stdout_lines }}'
- name: Display installed Community Collections
  when: community_verify.rc == 0
- ansible.builtin.debug: null
  msg:
  - Production RHEL Collection Installation Complete!
  - ''
  - 'Benefits of Red Hat Certified Collections:'
  - ' - Enterprise support through Red Hat subscription'
  - ' - Security patches and updates'
  - ' - Certified compatibility with RHEL'
  - ' - Integration with Red Hat products'
  - ' - Enterprise-grade documentation and support'
  - ''
  - 'Next Steps:'
  - ' 1. Test collections: ansible-galaxy collection list'
  - ' 2. Run setup:./setup_lvm_automation.sh'
  - ' 3. Configure inventory: vi inventory.yml'
  - ' 4. Start automation:./start_eda.sh'
- name: Display completion summary
