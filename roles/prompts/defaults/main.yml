---
# Prompts Role Defaults
# Variables for infrastructure configuration prompts

# Infrastructure Type
infrastructure_type: 1  # 1=Libvirt, 2=Nutanix, 3=VMware, 4=AWS, 5=GCP, 6=Azure

# Ansible Domain
ansible_domain: "lab.local"

# Libvirt Configuration
libvirt_host_short_name: "libvirt01"

# External Network (NAT) - Primary/eth0
libvirt_external_network: "192.168.0.0/24"
libvirt_external_network_gw: "192.168.0.1"

# Internal Network (Private Services) - Secondary/eth1
libvirt_internal_network: "10.168.0"
libvirt_internal_network_subnet: "10.168.0.0/16"
libvirt_internal_network_gw: "10.168.0.1"

# Node IP Allocation (on internal 10.168.0.0/16)
libvirt_installer_node_ip: "10.168.0.1"          # installer.<domain> - Gateway & Control Machine
libvirt_aap_ip: "10.168.0.26"                    # aap.<domain> - Containerized AAP
libvirt_satellite_ip: "10.168.0.27"              # satellite.<domain> - TFTP/DHCP/DNS
libvirt_idm_ip: "10.168.0.28"                    # idm.<domain> - Directory Service

# Node Names
libvirt_installer_node_short_name: "installer"
libvirt_aap_node_short_name: "aap"
libvirt_satellite_node_short_name: "satellite"
libvirt_idm_node_short_name: "idm"
