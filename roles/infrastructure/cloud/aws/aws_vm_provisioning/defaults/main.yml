---
# AWS VM Provisioning Role Defaults

# Enable/disable VM provisioning
aws_vm_provisioning_enabled: true

# AWS region for VMs
aws_region: us-east-1

# Instance defaults
aws_instance_type: t3.large
aws_instance_root_volume_size: 30
aws_instance_root_volume_type: gp3
aws_instance_root_volume_iops: 3000
aws_instance_root_volume_throughput: 125

# VPC and subnet configuration
aws_vpc_name: "{{ aws_vpc_name | default('redhat-vpc') }}"
aws_subnet_name: "{{ aws_subnet_name | default('redhat-subnet') }}"

# Security group configuration
aws_security_group_name: "redhat-sg"
aws_security_group_rules:
  - proto: tcp
    from_port: 22
    to_port: 22
    cidr_ip: "0.0.0.0/0"

# VM image defaults
aws_image_name: "RHEL-9.0-x86_64-*"
aws_image_owner: "309956199498"  # Red Hat official

# Tags for resources
aws_resource_tags:
  Project: RedHat
  Environment: Lab
  Managed: Ansible
