---
# Default variables for cmdb role
cmdb_enabled: true
cmdb_version: "1.0"
cmdb_timeout: 300

# CMDB configuration
cmdb_database: "cmdb"
cmdb_update_frequency: 86400

# Feature toggles
cmdb_enable_tracking: true

# Merged defaults from ansible_cmdb_setup (normalized)
cmdb_output_dir: "/var/www/html/cmdb"
cmdb_facts_dir: "/var/lib/ansible/facts.d"
cmdb_port: 8081
cmdb_generate_docs: true
