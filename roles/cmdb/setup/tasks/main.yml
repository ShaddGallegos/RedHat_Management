---
# roles/cmdb/setup/tasks/main.yml
# Setup Ansible-CMDB for infrastructure visibility and "Source of Truth" dashboard

- name: "Display CMDB setup information"
  debug:
    msg: |
      Setting up Ansible-CMDB on {{ cmdb_host | default('satellite') }}
      
      Purpose:
      - Centralized infrastructure visibility
      - Source of Truth for all managed systems
      - Real-time fact aggregation from all platforms
      - Web dashboard on port {{ cmdb_port | default('8081') }}

- name: "Ensure dependencies are installed on target host"
  dnf:
    name:
      - python3-pip
      - git
      - python3-devel
      - gcc
    state: present
  become: yes

- name: "Install ansible-cmdb via pip"
  pip:
    name:
      - ansible-cmdb
      - pyyaml
      - jinja2
    state: present
    executable: pip3
  become: yes

- name: "Create directories for CMDB"
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: yes
  loop:
    - /opt/ansible-cmdb
    - /var/lib/ansible-cmdb/facts
    - /var/lib/ansible-cmdb/output
    - /var/log/ansible-cmdb

- name: "Create ansible-cmdb collection playbook"
  copy:
    dest: /opt/ansible-cmdb/collect_facts.yml
    mode: '0644'
    content: |
      ---
      - name: "Collect facts from all managed systems"
        hosts: all
        gather_facts: yes
        
        tasks:
          - name: "Generate fact cache"
            command: "ansible -i inventory/hosts -m setup --tree /var/lib/ansible-cmdb/facts"
            delegate_to: localhost
            run_once: yes

- name: "Create systemd service for ansible-cmdb dashboard"
  copy:
    dest: /etc/systemd/system/ansible-cmdb.service
    mode: '0644'
    content: |
      [Unit]
      Description=Ansible-CMDB Web Dashboard
      Documentation=https://ansible-cmdb.readthedocs.io/
      After=network.target
      Wants=ansible-cmdb-facts.timer
      
      [Service]
      Type=simple
      User=root
      WorkingDirectory=/opt/ansible-cmdb
      ExecStart=/usr/local/bin/ansible-cmdb -i /var/lib/ansible-cmdb/facts -t html_fancy_split -p {{ cmdb_port | default('8081') }} -o /var/lib/ansible-cmdb/output
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      
      # Security hardening
      NoNewPrivileges=true
      PrivateTmp=true
      
      [Install]
      WantedBy=multi-user.target
  become: yes
  notify: "Reload systemd daemon"

- name: "Create systemd timer for periodic fact collection"
  copy:
    dest: /etc/systemd/system/ansible-cmdb-facts.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Collect Ansible facts for CMDB
      Requires=ansible-cmdb-facts.service
      
      [Timer]
      OnBootSec=1h
      OnUnitActiveSec=1h
      AccuracySec=1s
      
      [Install]
      WantedBy=timers.target
  become: yes
  notify: "Reload systemd daemon"

- name: "Create systemd service for periodic fact collection"
  copy:
    dest: /etc/systemd/system/ansible-cmdb-facts.service
    mode: '0644'
    content: |
      [Unit]
      Description=Collect Ansible facts for CMDB
      After=network.target
      
      [Service]
      Type=oneshot
      User=root
      WorkingDirectory=/opt/ansible-cmdb
      ExecStart=/usr/bin/ansible -i /etc/ansible/inventory/hosts -m setup --tree /var/lib/ansible-cmdb/facts
      StandardOutput=journal
      StandardError=journal
  become: yes

- name: "Configure firewall for CMDB access"
  firewalld:
    port: "{{ cmdb_port | default('8081') }}/tcp"
    permanent: yes
    state: enabled
  become: yes
  notify: "Reload firewall"

- name: "Enable and start ansible-cmdb service"
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes
  loop:
    - ansible-cmdb
    - ansible-cmdb-facts.timer

- name: "Wait for CMDB web interface to be ready"
  wait_for:
    port: "{{ cmdb_port | default('8081') }}"
    delay: 5
    timeout: 30

- name: "Display CMDB access information"
  debug:
    msg: |
      ✓ Ansible-CMDB installed and configured
      
      Access Information:
      Dashboard URL:     http://{{ inventory_hostname }}:{{ cmdb_port | default('8081') }}
      
      Facts Directory:   /var/lib/ansible-cmdb/facts
      Output Directory:  /var/lib/ansible-cmdb/output
      Systemd Service:   ansible-cmdb
      
      Fact Collection:
      Scheduled every 1 hour via systemd timer
      Manual collection: ansible -i inventory/hosts -m setup --tree /var/lib/ansible-cmdb/facts
      
      Next Steps:
      1. Visit the dashboard at: http://{{ inventory_hostname }}:{{ cmdb_port | default('8081') }}
      2. Review infrastructure overview
      3. Configure integration with monitoring (Prometheus, Grafana, etc.)
      4. Setup authentication for dashboard (optional)
      
      Facts Collected:
      - System information (OS, kernel, CPU, memory)
      - Network configuration (interfaces, IP addresses, routes)
      - Storage (disks, partitions, mounts)
      - Services and processes
      - Installed packages
      - User accounts and sudo configuration
      - Security policies (SELinux, firewall)
      - Custom facts (via Ansible fact plugins)
