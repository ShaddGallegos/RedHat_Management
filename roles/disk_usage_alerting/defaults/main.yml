---
# Disk Usage Alerting Defaults

threshold_percent: 80
critical_threshold_percent: 90

send_email_alerts: true
mail_smtp_host: "localhost"
mail_smtp_port: 25
mail_smtp_user: ""
mail_smtp_password: ""
mail_use_tls: false

alert_email_recipients:
  - "sysadmin@example.com"

eda_webhook_url: "http://localhost:5000/webhook"
check_interval_minutes: 15
alert_cooldown_minutes: 60

alert_filesystem: "/"   # Specify which filesystem to monitor
alert_subject_prefix: "[Disk Alert]"
