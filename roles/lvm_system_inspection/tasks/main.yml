---
# Lvm System Inspection Tasks

- name: Gather disk and LVM facts
  ansible.builtin.setup:
    gather_subset:
      - hardware
      - mounts

- name: Collect LVM info
  ansible.builtin.shell: |
    vgs --noheadings --units g --separator ',' -o vg_name,vg_size,vg_free
  register: vg_info
  changed_when: false

- name: Collect LV info
  ansible.builtin.shell: |
    lvs --noheadings --units g --separator ',' -o lv_name,vg_name,lv_size,data_percent
  register: lv_info
  changed_when: false

- name: Parse VG info
  ansible.builtin.set_fact:
    vg_list: "{{ vg_info.stdout_lines | map('split', ',') | list }}"

- name: Parse LV info
  ansible.builtin.set_fact:
    lv_list: "{{ lv_info.stdout_lines | map('split', ',') | list }}"

- name: Inspect mount points for usage
  ansible.builtin.set_fact:
    mount_alerts: >-
      {{
        ansible_mounts
        | selectattr('mount', 'in', lvm_inspect_mount_points)
        | selectattr('size_total', 'defined')
        | map('combine', {
            'usage_percent': lambda m: ((m.size_total - m.size_available) * 100 / m.size_total) | int
          })
        | selectattr('usage_percent', '>=', lvm_inspect_warning_threshold_percent)
        | list
      }}

- name: Send email alert if usage exceeds threshold
  community.general.mail:
    to: "{{ lvm_inspect_email }}"
    subject: "LVM System Inspection Alert - {{ inventory_hostname }}"
    body: |
      LVM System Inspection Report for {{ inventory_hostname }}

      {% for mount in mount_alerts %}
      - Mount: {{ mount.mount }} Usage: {{ mount.usage_percent }}%
      {% endfor %}

      Volume Groups:
      {% for vg in vg_list %}
      - VG: {{ vg[0] }} Size: {{ vg[1] }} Free: {{ vg[2] }}
      {% endfor %}

      Logical Volumes:
      {% for lv in lv_list %}
      - LV: {{ lv[0] }} (VG: {{ lv[1] }}) Size: {{ lv[2] }} Used: {{ lv[3] | default('N/A') }}%
      {% endfor %}
  when:
    - lvm_inspect_enable_email_alert | bool
    - mount_alerts | length > 0

- name: Send webhook alert if enabled
  ansible.builtin.uri:
    url: "{{ lvm_inspect_webhook_url }}"
    method: POST
    body_format: json
    body:
      hostname: "{{ inventory_hostname }}"
      mount_alerts: "{{ mount_alerts }}"
      vg_list: "{{ vg_list }}"
      lv_list: "{{ lv_list }}"
    status_code: [200, 201, 202]
  when:
    - lvm_inspect_enable_webhook | bool
    - mount_alerts | length > 0

- name: Log inspection summary
  ansible.builtin.debug:
    msg: >
      LVM inspection completed. Mounts with alerts: {{ mount_alerts | length }}.
