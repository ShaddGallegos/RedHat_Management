---
# Product Installation Role - Installation tasks executor
# This role handles product-specific installation tasks
# Calls product-specific roles (e.g., scenario_aap_setup, satellite_base, idm_base)
# 
# Usage:
#   - name: Install AAP
#     hosts: aap
#     roles:
#       - role: ansible_dev_node_product_lifecycle/install
#         vars:
#           product_name: aap
#           product_roles:
#             - scenario_aap_setup

- name: "Display installation information"
  ansible.builtin.debug:
    msg: |
      Installing {{ product_name | default('product') }}
      Roles to execute: {{ product_roles | default([]) | join(', ') }}

- name: "Validate prerequisites"
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution_major_version | int >= 8
    fail_msg: "Product installation requires RHEL 8+ (EL family)"
  tags: ["install", "validate"]

- name: "Execute product-specific installation"
  ansible.builtin.debug:
    msg: "Installation will be handled by product-specific roles: {{ product_roles | default([]) }}"
  tags: ["install"]
