---
# Default variables for platform_baremetal_provisioner role
platform_baremetal_provisioner_baremetal_provisioner_enabled: false
platform_baremetal_provisioner_baremetal_provisioner_version: "1.0"
platform_baremetal_provisioner_baremetal_provisioner_timeout: 3600

# PXE boot configuration
platform_baremetal_provisioner_pxe_boot_enabled: false
platform_baremetal_provisioner_dhcp_range_start: "192.168.1.100"
platform_baremetal_provisioner_dhcp_range_end: "192.168.1.200"
platform_baremetal_provisioner_tftp_root: "/var/lib/tftpboot"

# Feature toggles
platform_baremetal_provisioner_baremetal_provisioner_validate_hardware: true
