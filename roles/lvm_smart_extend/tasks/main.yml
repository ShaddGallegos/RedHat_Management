---
# Lvm Smart Extend Tasks

- name: Gather disk usage facts
  ansible.builtin.setup:
    gather_subset:
      - hardware
      - mounts

- name: Get mount info for target filesystem
  ansible.builtin.set_fact:
    lvm_mount_info: "{{ ansible_mounts | selectattr('mount', 'equalto', lvm_mount_point) | list | first }}"

- name: Calculate usage percent
  ansible.builtin.set_fact:
    lvm_usage_percent: "{{ ((lvm_mount_info.size_total - lvm_mount_info.size_available) * 100 / lvm_mount_info.size_total) | int }}"

- name: Check if LVM extension is needed
  ansible.builtin.set_fact:
    needs_extension: "{{ lvm_usage_percent > lvm_extend_threshold_percent }}"

- name: Log current usage
  ansible.builtin.debug:
    msg: "Current usage on {{ lvm_mount_point }}: {{ lvm_usage_percent }}% (threshold: {{ lvm_extend_threshold_percent }}%)"

- name: Get filesystem type
  ansible.builtin.shell: |
    blkid -o value -s TYPE /dev/{{ lvm_vg_name }}/{{ lvm_lv_name }}
  register: fs_type
  changed_when: false
  when: needs_extension

- name: Extend logical volume if needed
  community.general.lvol:
    vg: "{{ lvm_vg_name }}"
    lv: "{{ lvm_lv_name }}"
    size: "+{{ lvm_extend_percent }}%VG"
  register: lv_extend_result
  when: needs_extension

- name: Resize ext4 filesystem after LV extend
  ansible.builtin.shell: |
    resize2fs /dev/{{ lvm_vg_name }}/{{ lvm_lv_name }}
  when:
    - needs_extension
    - lv_extend_result is changed
    - fs_type.stdout == "ext4"

- name: Resize XFS filesystem after LV extend
  ansible.builtin.shell: |
    xfs_growfs {{ lvm_mount_point }}
  when:
    - needs_extension
    - lv_extend_result is changed
    - fs_type.stdout == "xfs"

- name: Send email notification
  community.general.mail:
    to: "{{ lvm_notify_email }}"
    subject: "LVM Extended on {{ inventory_hostname }}"
    body: |
      Logical volume {{ lvm_lv_name }} was extended by {{ lvm_extend_percent }}%.
      New usage: {{ lvm_usage_percent }}%
      Filesystem: {{ fs_type.stdout }}
      Host: {{ inventory_hostname }}
  when:
    - needs_extension
    - lvm_enable_email_alert | bool

- name: Send webhook notification
  ansible.builtin.uri:
    url: "{{ lvm_webhook_url }}"
    method: POST
    body_format: json
    body:
      hostname: "{{ inventory_hostname }}"
      vg: "{{ lvm_vg_name }}"
      lv: "{{ lvm_lv_name }}"
      extended: "{{ needs_extension }}"
      percent: "{{ lvm_extend_percent }}"
      usage: "{{ lvm_usage_percent }}"
      filesystem: "{{ fs_type.stdout }}"
      status: "{{ 'success' if lv_extend_result is changed else 'skipped' }}"
  when:
    - needs_extension
    - lvm_enable_webhook | bool

- name: Log extension status
  ansible.builtin.debug:
    msg: >
      LVM extension {{ 'performed' if needs_extension else 'not needed' }} on {{ lvm_lv_name }}.
