- name: Load survey for VMware (if present)
  ansible.builtin.include_role:
    name: integration_survey_loader
  run_once: true
  delegate_to: localhost

- name: VMware role main dispatcher
  - name: include install.yml
  ansible.builtin.import_tasks: install.yml
  tags: [install]

- name: include configure.yml
- ansible.builtin.import_tasks: configure.yml
  tags: [configure]

- name: include test.yml
- ansible.builtin.import_tasks: test.yml
  tags: [test]

- name: include backup.yml
- ansible.builtin.import_tasks: backup.yml
  tags: [backup]

- name: include restore.yml
- ansible.builtin.import_tasks: restore.yml
  tags: [restore]
