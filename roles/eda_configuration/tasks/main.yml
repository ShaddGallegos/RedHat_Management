---
- name: Create EDA rulebook project
  awx.awx.project:
- name: "{{ eda_rulebook_project }}"
    scm_type: git
    scm_url: "{{ aap_project_scm_url | default('https://git.example.com/yourrepo.git') }}"
    scm_branch: "{{ aap_project_scm_branch | default('main') }}"
    organization: "{{ organization_name | default('Default') }}"
    controller_host: "{{ eda_controller_host }}"
    controller_username: "{{ eda_controller_username }}"
    controller_password: "{{ eda_controller_password }}"
    validate_certs: "{{ eda_controller_verify_ssl }}"
    state: present

- name: Upload EDA rulebook
  awx.awx.project_update:
- name: "{{ eda_rulebook_project }}"
    controller_host: "{{ eda_controller_host }}"
    controller_username: "{{ eda_controller_username }}"
    controller_password: "{{ eda_controller_password }}"
    validate_certs: "{{ eda_controller_verify_ssl }}"

- name: Create EDA rulebook
  awx.awx.rulebook:
- name: "{{ eda_rulebook_name }}"
    description: "{{ eda_rulebook_description }}"
    project: "{{ eda_rulebook_project }}"
    rulebook: "{{ eda_rulebook_path }}"
    controller_host: "{{ eda_controller_host }}"
    controller_username: "{{ eda_controller_username }}"
    controller_password: "{{ eda_controller_password }}"
    validate_certs: "{{ eda_controller_verify_ssl }}"
    state: present

- name: Create EDA activation
  awx.awx.activation:
- name: "{{ eda_activation_name }}"
    description: "{{ eda_activation_description }}"
    rulebook: "{{ eda_activation_rulebook }}"
    status: "{{ eda_activation_status }}"
    webhook_url: "{{ eda_webhook_url }}"
    webhook_token: "{{ eda_webhook_token }}"
    controller_host: "{{ eda_controller_host }}"
    controller_username: "{{ eda_controller_username }}"
    controller_password: "{{ eda_controller_password }}"
    validate_certs: "{{ eda_controller_verify_ssl }}"
    state: present

- name: Notify admin of EDA setup
  community.general.mail:
    to: "{{ eda_notification_email }}"
    subject: "{{ eda_notification_subject }}"
    body: "{{ lookup('template', eda_notification_body_template) }}"
    host: "{{ mail_smtp_host | default('localhost') }}"
    port: "{{ mail_smtp_port | default(25) }}"
    ignore_errors: true