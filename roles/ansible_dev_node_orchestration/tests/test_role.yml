---
# Test: ansible_dev_node_orchestration role basic functionality
- name: Test ansible_dev_node_orchestration role
  hosts: localhost
  gather_facts: false
  vars:
    ansible_dev_node_orchestration_orchestration_enabled: true
  tasks:
    - name: Verify role variables
      ansible.builtin.assert:
        that:
          - ansible_dev_node_orchestration_orchestration_enabled is defined
