---
# Default variables for satellite_content_config role
scenario_satellite_618_configure_provisioning_satellite_content_config_enabled: true
scenario_satellite_618_configure_provisioning_satellite_content_config_version: "1.0"
scenario_satellite_618_configure_provisioning_satellite_content_config_timeout: 3600

# Satellite Connection
scenario_satellite_618_configure_provisioning_satellite_url: "https://scenario_satellite.example.com"
scenario_satellite_618_configure_provisioning_satellite_username: "admin"
# satellite_password: use vault!
scenario_satellite_618_configure_provisioning_satellite_validate_ssl: true
scenario_satellite_618_configure_provisioning_satellite_organization: "Default Organization"
scenario_satellite_618_configure_provisioning_satellite_location: "Default Location"

# Feature toggles
scenario_satellite_618_configure_provisioning_create_organizations: true
scenario_satellite_618_configure_provisioning_create_locations: true
scenario_satellite_618_configure_provisioning_create_products: false
scenario_satellite_618_configure_provisioning_create_repositories: false
scenario_satellite_618_configure_provisioning_synchronize_repositories: false
scenario_satellite_618_configure_provisioning_enable_repository_sets: true

# Repository Sets Configuration - Enable RHEL yum repos for each product
# These are the official Red Hat repository sets that should be enabled
scenario_satellite_618_configure_provisioning_repository_sets_to_enable:
  - name: "Red Hat Enterprise Linux Server (v. 9 for x86_64)"
    product: "Red Hat Enterprise Linux Server"
    basearch: "x86_64"
    releasever: "9"

  - name: "Red Hat Enterprise Linux AppStream (v. 9 for x86_64)"
    product: "Red Hat Enterprise Linux Server"
    basearch: "x86_64"
    releasever: "9"

  - name: "Red Hat Enterprise Linux Server (v. 10 for x86_64)"
    product: "Red Hat Enterprise Linux Server"
    basearch: "x86_64"
    releasever: "10"

  - name: "Red Hat Enterprise Linux AppStream (v. 10 for x86_64)"
    product: "Red Hat Enterprise Linux Server"
    basearch: "x86_64"
    releasever: "10"

# Organizations Configuration
scenario_satellite_618_configure_provisioning_organizations:
  - name: "{{ scenario_satellite_618_configure_provisioning_satellite_organization }}"
    description: "Default organization for RHIS"
    state: present
    tags: ["rhis", "default"]

# Locations Configuration
scenario_satellite_618_configure_provisioning_locations:
  - name: "{{ scenario_satellite_618_configure_provisioning_satellite_location }}"
    description: "Default location for RHIS"
    state: present
    tags: ["rhis", "default"]

# Products Configuration (Custom scenario_satellite_618_configure_provisioning_products)
scenario_satellite_618_configure_provisioning_products:
  - name: "RHIS_Custom_Products"
    organization: "{{ scenario_satellite_618_configure_provisioning_satellite_organization }}"
    description: "Custom RHIS scenario_satellite_618_configure_provisioning_products"
    tags: ["rhis", "scenario_satellite_618_configure_provisioning_products"]

# Repositories Configuration
scenario_satellite_618_configure_provisioning_repositories:
  - name: "RHEL_9_BaseOS"
    product: "Red Hat Enterprise Linux Server"
    organization: "{{ scenario_satellite_618_configure_provisioning_satellite_organization }}"
    content_type: "yum"
    url: "https://cdn.redhat.com/content/dist/rhel/rhel-9/rhel-9-x86_64/baseos/os_generic"
    tags: ["rhis", "rhel", "baseos"]

  - name: "RHEL_9_AppStream"
    product: "Red Hat Enterprise Linux Server"
    organization: "{{ scenario_satellite_618_configure_provisioning_satellite_organization }}"
    content_type: "yum"
    url: "https://cdn.redhat.com/content/dist/rhel/rhel-9/rhel-9-x86_64/appstream/os_generic"
    tags: ["rhis", "rhel", "appstream"]

  - name: "RHEL_10_BaseOS"
    product: "Red Hat Enterprise Linux Server"
    organization: "{{ scenario_satellite_618_configure_provisioning_satellite_organization }}"
    content_type: "yum"
    url: "https://cdn.redhat.com/content/dist/rhel/rhel-10/rhel-10-x86_64/baseos/os_generic"
    tags: ["rhis", "rhel", "baseos", "rhel10"]

  - name: "RHEL_10_AppStream"
    product: "Red Hat Enterprise Linux Server"
    organization: "{{ scenario_satellite_618_configure_provisioning_satellite_organization }}"
    content_type: "yum"
    url: "https://cdn.redhat.com/content/dist/rhel/rhel-10/rhel-10-x86_64/appstream/os_generic"
    tags: ["rhis", "rhel", "appstream", "rhel10"]

# Sync Plans
scenario_satellite_618_configure_provisioning_create_sync_plans: true
scenario_satellite_618_configure_provisioning_sync_plans:
  - name: "Daily_Sync"
    organization: "{{ scenario_satellite_618_configure_provisioning_satellite_organization }}"
    description: "Daily repository synchronization"
    sync_date: "2024-01-01 00:00:00"
    interval: "daily"
    enabled: true
    tags: ["rhis", "sync"]

  - name: "Weekly_Sync"
    organization: "{{ scenario_satellite_618_configure_provisioning_satellite_organization }}"
    description: "Weekly repository synchronization"
    sync_date: "2024-01-01 02:00:00"
    interval: "weekly"
    enabled: true
    tags: ["rhis", "sync"]

# Validation
scenario_satellite_618_configure_provisioning_satellite_content_validate_connectivity: true
scenario_satellite_618_configure_provisioning_satellite_content_test_sync: false
